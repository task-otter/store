---
name: Main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  TEST_SHARDS: '6'
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - name: Run CI
        uses: ./.github/actions/ci

  integration:
    name: Integration (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      # Packages are dealt round-robin across shards, so adding a taskfile
      # module never requires touching this workflow.
      - name: Integration shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          packages=$(go list ./... | awk "NR % ${TEST_SHARDS} == ${SHARD} % ${TEST_SHARDS}")
          if [ -z "${packages}" ]; then
            echo "shard ${SHARD} has no packages"
            exit 0
          fi
          echo "${packages}"
          # shellcheck disable=SC2086
          go test ${packages} -count=1 -timeout 10m \
            -run 'TestModuleIntegration|TestEveryTaskfileFolderHasAnIntegrationTest|TestRunExercisesEveryCheck|TestRunSpecDryRunsSelectedTasks'
