---
name: Smoke
description: Run the Taskfile public-task smoke runner.
runs:
  using: composite
  steps:
    - name: Setup
      uses: $/.github/actions/setup
    - name: Run smoke
      shell: bash
      run: |
        task go:verify
        export PATH="${HOME}/.nix-profile/bin:/nix/var/nix/profiles/default/bin:${PATH}"
        go run ./cmd/tasksmoke
