---
name: Smoke
description: Run the Taskfile public-task smoke runner.
runs:
  using: composite
  steps:
    - name: Setup
      uses: $/.github/actions/setup
    - name: Setup Nix
      if: runner.os != 'Windows'
      uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa  # v23
    - name: Run smoke
      shell: bash
      run: go run ./cmd/tasksmoke
