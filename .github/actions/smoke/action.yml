---
name: Smoke
description: Run the Taskfile public-task smoke runner.

runs:
  using: composite
  steps:
    - name: Install Task
      uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
    - name: Run smoke
      shell: bash
      run: |-
        task go:verify
        export PATH="${HOME}/.nix-profile/bin:/nix/var/nix/profiles/default/bin:${PATH}"
        go run ./cmd/tasksmoke
