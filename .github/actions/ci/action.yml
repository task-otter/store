---
name: CI
description: Run the repository's own lint/format checks and go vet.
runs:
  using: composite
  steps:
    - name: Setup
      uses: ./.github/actions/setup
    - name: Run CI
      shell: bash
      run: task -t Taskfile.yml ci
    - name: Vet
      shell: bash
      run: go vet ./...
