---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml

  gh: ../gh/Taskfile.yml

vars:
  GIT_BASE: '{{.GIT_BASE | default "main"}}'
  GIT_BODY: '{{.GIT_BODY | default ""}}'
  GIT_BRANCH: '{{.GIT_BRANCH | default ""}}'
  GIT_CLONE_DIR: '{{.GIT_CLONE_DIR | default ""}}'
  GIT_COMMIT: '{{.GIT_COMMIT | default ""}}'
  GIT_COMMIT_MSG: '{{.GIT_COMMIT_MSG | default ""}}'
  GIT_EMAIL: '{{.GIT_EMAIL | default ""}}'
  GIT_EXTRA_ARGS: '{{.GIT_EXTRA_ARGS | default ""}}'
  GIT_FILES: '{{.GIT_FILES | default "."}}'
  GIT_MERGE_METHOD: '{{.GIT_MERGE_METHOD | default "merge"}}'
  GIT_MESSAGE: '{{.GIT_MESSAGE | default ""}}'
  GIT_NAME: '{{.GIT_NAME | default ""}}'
  GIT_NOTES: '{{.GIT_NOTES | default ""}}'
  GIT_OWNER: '{{.GIT_OWNER | default ""}}'
  GIT_REMOTE: '{{.GIT_REMOTE | default "origin"}}'
  GIT_REPO: '{{.GIT_REPO | default ""}}'
  GIT_STASH_INDEX: '{{.GIT_STASH_INDEX | default "0"}}'
  GIT_TAG: '{{.GIT_TAG | default ""}}'
  GIT_TITLE: '{{.GIT_TITLE | default ""}}'
  GIT_URL: '{{.GIT_URL | default ""}}'
  GIT_NIX_INSTALLABLE: '{{.GIT_NIX_INSTALLABLE | default "nixpkgs#git"}}'

tasks:
  default:
    run: once
    desc: Show available git automation tasks
    summary: Display the list of available git-related tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install git via the Nix profile
    summary: |
      Install git into the user Nix profile when it is not already
      available on PATH. Override the GIT_NIX_INSTALLABLE
      variable to pin a different package or version.
    status:
      - command -v git >/dev/null 2>&1
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.GIT_NIX_INSTALLABLE}}"

  version:
    run: once
    desc: Show the active git version
    summary: |
      Print the version reported by the git binary resolved from PATH.
      Auto-installs git if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  auth:setup:
    run: once
    desc: Configure git to use the GitHub CLI as a credential helper
    summary: |
      Delegate git HTTPS authentication to gh via `gh auth setup-git`.
      Run this once before using clone, push, or pull over HTTPS.
      Installs gh automatically if not already present.
    cmds:
      - task: gh:auth:setup-git

  init:
    run: once
    desc: Initialize a new git repository in the current directory
    summary: |
      Run `git init`. Set BRANCH to specify the initial branch name.
      Example: GIT_BRANCH=main
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          git init{{if .GIT_BRANCH}} --initial-branch={{.GIT_BRANCH}}{{end}} {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: git init{{if .GIT_BRANCH}} --initial-branch={{.GIT_BRANCH}}{{end}} {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  clone:
    run: once
    desc: Clone a GitHub repository using the GitHub CLI
    summary: |
      Clone a repository via gh. Requires REPO. Set OWNER for repos owned
      by another user or organisation. Set CLONE_DIR for the destination.
      Run `task auth:setup` first to configure git credentials via gh.
      Example: GIT_OWNER=github GIT_REPO=cli GIT_CLONE_DIR=~/src/gh
    requires:
      vars:
        - GIT_REPO
    deps:
      - task: gh:install
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          gh repo clone {{if .GIT_OWNER}}{{.GIT_OWNER}}/{{end}}{{.GIT_REPO}}
          {{if .GIT_CLONE_DIR}}{{.GIT_CLONE_DIR}}{{end}} {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: >-
          gh repo clone {{if .GIT_OWNER}}{{.GIT_OWNER}}/{{end}}{{.GIT_REPO}}
          {{if .GIT_CLONE_DIR}}{{.GIT_CLONE_DIR}}{{end}} {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  status:
    run: once
    desc: Show the current working tree status
    summary: Print the status of staged and unstaged changes via `git status`.
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git status'
        platforms: [linux, darwin]
      - cmd: git status
        platforms: [windows]

  add:
    run: once
    desc: Stage files for the next commit
    summary: |
      Stage files via `git add`. FILES defaults to "." (all changes in the
      working tree). Pass specific files or globs via FILES.
      Example: GIT_FILES="src/main.ts tests/"
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git add {{.GIT_FILES}} {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: git add {{.GIT_FILES}} {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  add:all:
    run: once
    desc: Stage all changes including untracked files
    summary: Stage all changes (modified, deleted, untracked) via `git add --all`.
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git add --all'
        platforms: [linux, darwin]
      - cmd: git add --all
        platforms: [windows]

  commit:
    run: once
    desc: Create a commit from staged changes
    summary: |
      Commit staged changes. Requires COMMIT_MSG.
      Example: GIT_COMMIT_MSG="feat: add login page"
    requires:
      vars:
        - GIT_COMMIT_MSG
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git commit -m "{{.GIT_COMMIT_MSG}}" {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: git commit -m "{{.GIT_COMMIT_MSG}}" {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  commit:amend:
    run: once
    desc: Amend the most recent commit
    summary: |
      Amend the last commit. Set COMMIT_MSG to update the message, or omit
      COMMIT_MSG to keep the existing message (--no-edit).
      Example: GIT_COMMIT_MSG="fix: corrected typo"
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          git commit --amend
          {{if .GIT_COMMIT_MSG}}-m "{{.GIT_COMMIT_MSG}}"{{else}}--no-edit{{end}} {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: >-
          git commit --amend
          {{if .GIT_COMMIT_MSG}}-m "{{.GIT_COMMIT_MSG}}"{{else}}--no-edit{{end}} {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  push:
    run: once
    desc: Push commits to the remote repository
    summary: |
      Push to the remote. REMOTE defaults to "origin". Set BRANCH to push
      to a specific remote branch; otherwise pushes HEAD.
      Example: GIT_REMOTE=origin GIT_BRANCH=main
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          git push {{.GIT_REMOTE}}
          {{if .GIT_BRANCH}}{{.GIT_BRANCH}}{{else}}HEAD{{end}} {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: git push {{.GIT_REMOTE}} {{if .GIT_BRANCH}}{{.GIT_BRANCH}}{{else}}HEAD{{end}} {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  push:force:
    run: once
    desc: Force-push the current branch using --force-with-lease
    summary: |
      Force-push using --force-with-lease for safety. REMOTE defaults to "origin".
      WARNING: This rewrites history on the remote branch.
    prompt: Force-push will rewrite remote history. Continue?
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          git push {{.GIT_REMOTE}}
          {{if .GIT_BRANCH}}{{.GIT_BRANCH}}{{else}}HEAD{{end}} --force-with-lease {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: >-
          git push {{.GIT_REMOTE}}
          {{if .GIT_BRANCH}}{{.GIT_BRANCH}}{{else}}HEAD{{end}} --force-with-lease {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  pull:
    run: once
    desc: Pull changes from the remote repository
    summary: |
      Fetch and merge changes from the remote. REMOTE defaults to "origin".
      Set BRANCH to pull a specific branch.
      Example: GIT_REMOTE=origin GIT_BRANCH=main
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          git pull {{.GIT_REMOTE}}
          {{- if .GIT_BRANCH}} {{.GIT_BRANCH}}{{end}} {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: git pull {{.GIT_REMOTE}}{{if .GIT_BRANCH}} {{.GIT_BRANCH}}{{end}} {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  fetch:
    run: once
    desc: Fetch branches from the remote without merging
    summary: |
      Fetch all branches and prune deleted refs via `git fetch --prune`.
      REMOTE defaults to "origin".
      Example: GIT_REMOTE=upstream
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git fetch {{.GIT_REMOTE}} --prune {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: git fetch {{.GIT_REMOTE}} --prune {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  sync:
    run: once
    desc: Sync the current branch with its GitHub upstream via the GitHub CLI
    summary: |
      Sync the local branch with its GitHub upstream via `gh repo sync`.
      Set BRANCH to sync a specific branch instead of the current one.
      Run `task auth:setup` first to configure git credentials via gh.
      Example: GIT_BRANCH=main
    deps:
      - task: gh:install
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          gh repo sync {{if .GIT_BRANCH}}--branch {{.GIT_BRANCH}}{{end}} {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: gh repo sync {{if .GIT_BRANCH}}--branch {{.GIT_BRANCH}}{{end}} {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  diff:
    run: once
    desc: Show unstaged changes in the working tree
    summary: |
      Show changes between the working tree and the index via `git diff`.
      Set FILES to limit to specific paths.
      Example: GIT_FILES=src/
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git diff {{.GIT_FILES}} {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: git diff {{.GIT_FILES}} {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  diff:staged:
    run: once
    desc: Show changes staged for the next commit
    summary: Show staged changes ready for commit via `git diff --staged`.
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git diff --staged {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: git diff --staged {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  log:
    run: once
    desc: Show the commit history with author and date
    summary: |
      Display commits with short hash, author, date, and message.
      Example: GIT_EXTRA_ARGS="-n 20"
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          git log --format="%C(yellow)%h%Creset %C(blue)%ad%Creset %s %C(green)<%an>%Creset"
          --date=short {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: >-
          git log --format="%C(yellow)%h%Creset %C(blue)%ad%Creset %s %C(green)<%an>%Creset"
          --date=short {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  log:graph:
    run: once
    desc: Show commit history as an ASCII branch graph
    summary: Display a compact decorated graph of all branches and commits.
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git log --oneline --graph --decorate --all {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: git log --oneline --graph --decorate --all {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  branch:list:
    run: once
    desc: List all local and remote branches
    summary: Show all local and remote branches via `git branch -a`.
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git branch -a {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: git branch -a {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  branch:create:
    run: once
    desc: Create and switch to a new branch from current HEAD
    summary: |
      Create a new branch at current HEAD and switch to it. Requires BRANCH.
      Example: GIT_BRANCH=feature/my-feature
    requires:
      vars:
        - GIT_BRANCH
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git switch -c {{.GIT_BRANCH}} {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: git switch -c {{.GIT_BRANCH}} {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  branch:switch:
    run: once
    desc: Switch to an existing branch
    summary: |
      Switch to a branch via `git switch`. Requires BRANCH.
      Example: GIT_BRANCH=main
    requires:
      vars:
        - GIT_BRANCH
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git switch {{.GIT_BRANCH}} {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: git switch {{.GIT_BRANCH}} {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  branch:delete:
    run: once
    desc: Delete a local branch
    summary: |
      Delete a local branch. Requires BRANCH.
      WARNING: Unmerged commits on this branch may be lost.
      Example: GIT_BRANCH=feature/old-feature
    requires:
      vars:
        - GIT_BRANCH
    prompt: Delete local branch "{{.GIT_BRANCH}}"?
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git branch -d {{.GIT_BRANCH}} {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: git branch -d {{.GIT_BRANCH}} {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  branch:rename:
    run: once
    desc: Rename the current branch to a new name
    summary: |
      Rename the current branch. Requires BRANCH (the new name).
      Example: GIT_BRANCH=new-name
    requires:
      vars:
        - GIT_BRANCH
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git branch -m {{.GIT_BRANCH}}'
        platforms: [linux, darwin]
      - cmd: git branch -m {{.GIT_BRANCH}}
        platforms: [windows]

  tag:list:
    run: once
    desc: List all tags sorted by version descending
    summary: List tags sorted by version via `git tag --sort=-v:refname`.
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git tag --sort=-v:refname {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: git tag --sort=-v:refname {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  tag:create:
    run: once
    desc: Create an annotated tag at HEAD
    summary: |
      Create an annotated tag. Requires TAG. Set MESSAGE for the tag
      annotation; defaults to the tag name.
      Example: GIT_TAG=v1.0.0 GIT_MESSAGE="Release v1.0.0"
    requires:
      vars:
        - GIT_TAG
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          git tag -a {{.GIT_TAG}} -m "{{default .GIT_TAG .GIT_MESSAGE}}" {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: git tag -a {{.GIT_TAG}} -m "{{default .GIT_TAG .GIT_MESSAGE}}" {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  tag:push:
    run: once
    desc: Push a tag or all tags to the remote
    summary: |
      Push TAG to the remote. Omit TAG to push all tags via --tags.
      Example: GIT_TAG=v1.0.0 GIT_REMOTE=origin
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          git push {{.GIT_REMOTE}}
          {{if .GIT_TAG}}{{.GIT_TAG}}{{else}}--tags{{end}} {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: git push {{.GIT_REMOTE}} {{if .GIT_TAG}}{{.GIT_TAG}}{{else}}--tags{{end}} {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  tag:delete:
    run: once
    desc: Delete a tag locally and from the remote
    summary: |
      Delete a tag both locally and on the remote. Requires TAG.
      WARNING: This removes the tag permanently from both local and remote.
      Example: GIT_TAG=v0.1.0 GIT_REMOTE=origin
    requires:
      vars:
        - GIT_TAG
    prompt: Delete tag "{{.GIT_TAG}}" locally and from remote "{{.GIT_REMOTE}}"?
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git tag -d {{.GIT_TAG}}'
        platforms: [linux, darwin]
      - cmd: git tag -d {{.GIT_TAG}}
        platforms: [windows]
      - cmd: bash -lc '{{.NIX_LOAD}}; git push {{.GIT_REMOTE}} --delete {{.GIT_TAG}}'
        platforms: [linux, darwin]
      - cmd: git push {{.GIT_REMOTE}} --delete {{.GIT_TAG}}
        platforms: [windows]

  stash:
    run: once
    desc: Stash uncommitted changes in the working tree
    summary: |
      Save the working tree and index to a stash entry. Set MESSAGE for
      a description of the stashed changes.
      Example: GIT_MESSAGE="WIP: refactor auth module"
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          git stash push {{if .GIT_MESSAGE}}-m "{{.GIT_MESSAGE}}"{{end}} {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: git stash push {{if .GIT_MESSAGE}}-m "{{.GIT_MESSAGE}}"{{end}} {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  stash:pop:
    run: once
    desc: Apply and remove the latest stash entry
    summary: |
      Apply and remove a stash entry. STASH_INDEX defaults to 0 (most recent).
      Example: GIT_STASH_INDEX=1
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git stash pop stash@{{{.GIT_STASH_INDEX}}} {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: git stash pop stash@{{{.GIT_STASH_INDEX}}} {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  stash:list:
    run: once
    desc: List all stash entries
    summary: Display all stash entries via `git stash list`.
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git stash list'
        platforms: [linux, darwin]
      - cmd: git stash list
        platforms: [windows]

  stash:drop:
    run: once
    desc: Discard a stash entry without applying it
    summary: |
      Remove a stash entry. STASH_INDEX defaults to 0 (most recent).
      Example: GIT_STASH_INDEX=2
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git stash drop stash@{{{.GIT_STASH_INDEX}}} {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: git stash drop stash@{{{.GIT_STASH_INDEX}}} {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  reset:soft:
    run: once
    desc: Soft-reset HEAD to a commit, preserving staged changes
    summary: |
      Move HEAD back without touching the index or working tree. Requires COMMIT.
      Use to undo commits while keeping changes staged for a new commit.
      Example: GIT_COMMIT=HEAD~1
    requires:
      vars:
        - GIT_COMMIT
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git reset --soft {{.GIT_COMMIT}} {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: git reset --soft {{.GIT_COMMIT}} {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  reset:hard:
    run: once
    desc: Hard-reset HEAD to a commit, discarding all local changes
    summary: |
      Move HEAD and discard all staged and unstaged changes. Requires COMMIT.
      WARNING: All uncommitted changes are permanently lost.
      Example: GIT_COMMIT=HEAD~1
    requires:
      vars:
        - GIT_COMMIT
    prompt: Hard-reset to "{{.GIT_COMMIT}}"? All uncommitted changes will be permanently lost.
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git reset --hard {{.GIT_COMMIT}} {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: git reset --hard {{.GIT_COMMIT}} {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  clean:
    run: once
    desc: Remove untracked files and directories from the working tree
    summary: |
      Delete untracked files and directories via `git clean -fd`.
      WARNING: This permanently removes untracked files.
    prompt: Permanently remove all untracked files and directories?
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git clean -fd {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: git clean -fd {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  config:user:
    run: once
    desc: Set the global git user name and email address
    summary: |
      Configure the global git identity. Requires NAME and EMAIL.
      Example: GIT_NAME="Ada Lovelace" GIT_EMAIL=ada@example.com
    requires:
      vars:
        - GIT_NAME
        - GIT_EMAIL
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git config --global user.name "{{.GIT_NAME}}"'
        platforms: [linux, darwin]
      - cmd: git config --global user.name "{{.GIT_NAME}}"
        platforms: [windows]
      - cmd: bash -lc '{{.NIX_LOAD}}; git config --global user.email "{{.GIT_EMAIL}}"'
        platforms: [linux, darwin]
      - cmd: git config --global user.email "{{.GIT_EMAIL}}"
        platforms: [windows]

  config:list:
    run: once
    desc: List all git configuration values
    summary: Show all git config values (system + global + local) via `git config --list`.
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git config --list {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: git config --list {{.GIT_EXTRA_ARGS}}
        platforms: [windows]

  remote:list:
    run: once
    desc: List all configured remotes and their URLs
    summary: Show all remotes and their fetch/push URLs via `git remote -v`.
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git remote -v'
        platforms: [linux, darwin]
      - cmd: git remote -v
        platforms: [windows]

  remote:add:
    run: once
    desc: Add a new remote to the repository
    summary: |
      Add a named remote. Requires NAME and URL.
      Example: GIT_NAME=upstream GIT_URL=https://github.com/org/repo.git
    requires:
      vars:
        - GIT_NAME
        - GIT_URL
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git remote add {{.GIT_NAME}} {{.GIT_URL}}'
        platforms: [linux, darwin]
      - cmd: git remote add {{.GIT_NAME}} {{.GIT_URL}}
        platforms: [windows]

  remote:remove:
    run: once
    desc: Remove a configured remote from the repository
    summary: |
      Remove a remote. Requires NAME.
      Example: GIT_NAME=upstream
    requires:
      vars:
        - GIT_NAME
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git remote remove {{.GIT_NAME}}'
        platforms: [linux, darwin]
      - cmd: git remote remove {{.GIT_NAME}}
        platforms: [windows]

  remote:set-url:
    run: once
    desc: Update the URL of a configured remote
    summary: |
      Change the URL of a remote. Requires NAME and URL.
      Example: GIT_NAME=origin GIT_URL=git@github.com:org/repo.git
    requires:
      vars:
        - GIT_NAME
        - GIT_URL
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git remote set-url {{.GIT_NAME}} {{.GIT_URL}}'
        platforms: [linux, darwin]
      - cmd: git remote set-url {{.GIT_NAME}} {{.GIT_URL}}
        platforms: [windows]

  pr:create:
    run: once
    desc: Push the current branch and open a pull request on GitHub
    summary: |
      Push HEAD to remote, then create a pull request via the GitHub CLI.
      Requires TITLE. Set BASE for the target branch (default: main).
      Set BODY for the PR description.
      Run `task auth:setup` first to configure git credentials via gh.
      Example: GIT_TITLE="feat: new feature" GIT_BASE=main
    requires:
      vars:
        - GIT_TITLE
    deps:
      - task: gh:install
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          git push {{.GIT_REMOTE}}
          {{if .GIT_BRANCH}}{{.GIT_BRANCH}}{{else}}HEAD{{end}} {{.GIT_EXTRA_ARGS}}'
        platforms: [linux, darwin]
      - cmd: git push {{.GIT_REMOTE}} {{if .GIT_BRANCH}}{{.GIT_BRANCH}}{{else}}HEAD{{end}} {{.GIT_EXTRA_ARGS}}
        platforms: [windows]
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          gh pr create
          --title "{{.GIT_TITLE}}"
          --base "{{default "main" .GIT_BASE}}"
          {{if .GIT_BODY}}--body "{{.GIT_BODY}}"{{end}}'
        platforms: [linux, darwin]
      - cmd: >-
          gh pr create
          --title "{{.GIT_TITLE}}"
          --base "{{default "main" .GIT_BASE}}"
          {{if .GIT_BODY}}--body "{{.GIT_BODY}}"{{end}}
        platforms: [windows]

  pr:open:
    run: once
    desc: Open the current pull request in the browser via the GitHub CLI
    summary: |
      Open the pull request for the current branch on GitHub in the browser
      via `gh pr view --web`. Run `task auth:setup` first if needed.
    deps:
      - task: gh:install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh pr view --web'
        platforms: [linux, darwin]
      - cmd: gh pr view --web
        platforms: [windows]

  release:create:
    run: once
    desc: Create a git tag and a GitHub release via the GitHub CLI
    summary: |
      Create an annotated tag, push it to remote, then create a GitHub release.
      Requires TAG. Set TITLE for the release title and NOTES for the body.
      Run `task auth:setup` first to configure git credentials via gh.
      Example: GIT_TAG=v1.0.0 GIT_TITLE="v1.0.0" GIT_NOTES="Initial release"
    requires:
      vars:
        - GIT_TAG
    deps:
      - task: gh:install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git tag -a {{.GIT_TAG}} -m "{{default .GIT_TAG .GIT_TITLE}}"'
        platforms: [linux, darwin]
      - cmd: git tag -a {{.GIT_TAG}} -m "{{default .GIT_TAG .GIT_TITLE}}"
        platforms: [windows]
      - cmd: bash -lc '{{.NIX_LOAD}}; git push {{.GIT_REMOTE}} {{.GIT_TAG}}'
        platforms: [linux, darwin]
      - cmd: git push {{.GIT_REMOTE}} {{.GIT_TAG}}
        platforms: [windows]
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          gh release create {{.GIT_TAG}}
          {{if .GIT_TITLE}}--title "{{.GIT_TITLE}}"{{end}}
          {{if .GIT_NOTES}}--notes "{{.GIT_NOTES}}"{{end}}'
        platforms: [linux, darwin]
      - cmd: >-
          gh release create {{.GIT_TAG}}
          {{if .GIT_TITLE}}--title "{{.GIT_TITLE}}"{{end}}
          {{if .GIT_NOTES}}--notes "{{.GIT_NOTES}}"{{end}}
        platforms: [windows]

  help:
    run: once
    desc: Show the git built-in help and command list
    summary: Display the git help overview and list of common commands.
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; git help'
        platforms: [linux, darwin]
      - cmd: git help
        platforms: [windows]

  _version:unix:
    run: once
    internal: true
    desc: Show git version on macOS or Linux
    summary: Print the git version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; git --version'

  _version:windows:
    run: once
    internal: true
    desc: Show git version on Windows
    summary: Print the git version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Get-Command git -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: git is not installed or not available in PATH.
    cmds:
      - git --version
