---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  bun:
    taskfile: ../../bun/Taskfile.yml

vars:
  STYLELINT_TARGETS: ""
  STYLELINT_DEFAULT_TARGETS: "**/*.{css,scss,sass,less,vue,svelte,astro}"
  STYLELINT_CONFIG: ""
  STYLELINT_CACHE: ""
  STYLELINT_DEFAULT_CACHE: "true"
  STYLELINT_ALLOW_EMPTY_INPUT: ""
  STYLELINT_DEFAULT_ALLOW_EMPTY_INPUT: "true"
  STYLELINT_EXTRA_ARGS: ""
  STYLELINT_VERSION: ""

tasks:
  default:
    run: once
    desc: Show available Stylelint tasks
    cmds:
      - task --list

  install:
    run: once
    dir: "{{.USER_WORKING_DIR}}"
    desc: Install Stylelint and the standard config as local devDependencies
    summary: |
      Install stylelint and stylelint-config-standard as local devDependencies.
      Pass STYLELINT_VERSION=x.y.z to pin stylelint to a specific release.
    vars:
      RESOLVED_VERSION: '{{.STYLELINT_VERSION}}'
      RESOLVED_EXTRA_ARGS: '{{.STYLELINT_EXTRA_ARGS}}'
    status:
      - >-
        node -e "const installed = require('./node_modules/stylelint/package.json');
        const requested = '{{.RESOLVED_VERSION}}';
        process.exit(!requested || installed.version === requested ? 0 : 1)"
    cmds:
      - task: _bun:unix
        vars:
          ARGS: >-
            add -d --silent stylelint{{if .RESOLVED_VERSION}}@{{.RESOLVED_VERSION}}{{end}} stylelint-config-standard
            {{.RESOLVED_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
      - task: _bun:windows
        vars:
          ARGS: >-
            add -d --silent stylelint{{if .RESOLVED_VERSION}}@{{.RESOLVED_VERSION}}{{end}} stylelint-config-standard
            {{.RESOLVED_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}

  install:undo:
    run: once
    desc: Remove the locally installed Stylelint devDependencies
    summary: Remove stylelint and stylelint-config-standard from local devDependencies.
    prompt:
      - This will remove stylelint and stylelint-config-standard from local devDependencies.
      - Continue?
    cmds:
      - task: _bun:unix
        vars:
          ARGS: >-
            remove --silent stylelint stylelint-config-standard {{.STYLELINT_EXTRA_ARGS}}
      - task: _bun:windows
        vars:
          ARGS: >-
            remove --silent stylelint stylelint-config-standard {{.STYLELINT_EXTRA_ARGS}}

  upgrade:
    run: once
    desc: Upgrade Stylelint to the latest release
    summary: Reinstall stylelint and stylelint-config-standard at their latest versions.
    cmds:
      - task: _bun:unix
        vars:
          ARGS: >-
            add -d --silent stylelint@latest stylelint-config-standard@latest
            {{.STYLELINT_EXTRA_ARGS}}
      - task: _bun:windows
        vars:
          ARGS: >-
            add -d --silent stylelint@latest stylelint-config-standard@latest
            {{.STYLELINT_EXTRA_ARGS}}

  config:init:
    run: once
    dir: "{{.USER_WORKING_DIR}}"
    desc: Create a starter Stylelint config when none exists
    vars:
      RESOLVED_CONFIG: '{{.STYLELINT_CONFIG}}'
    cmds:
      - |
        config_file="{{.RESOLVED_CONFIG}}"
        if [ -z "$config_file" ]; then
          config_file=".stylelintrc.json"
        fi
        if [ -e "$config_file" ]; then
          echo "$config_file already exists."
        else
          printf '%s\n' '{' '  "extends": "stylelint-config-standard"' '}' > "$config_file"
          echo "Created $config_file."
        fi

  # Shared implementation of lint / ci:fix / ci. Each override is resolved
  # exactly once here; the three public tasks differ only by MODE_ARGS.
  _run:
    internal: true
    run: when_changed
    vars:
      RESOLVED_TARGETS: '{{or .STYLELINT_TARGETS .STYLELINT_DEFAULT_TARGETS}}'
      RESOLVED_CONFIG: '{{.STYLELINT_CONFIG}}'
      RESOLVED_CACHE: '{{or .STYLELINT_CACHE .STYLELINT_DEFAULT_CACHE}}'
      RESOLVED_EMPTY: >-
        {{or .STYLELINT_ALLOW_EMPTY_INPUT .STYLELINT_DEFAULT_ALLOW_EMPTY_INPUT}}
      RESOLVED_EXTRA_ARGS: '{{.STYLELINT_EXTRA_ARGS}}'
    cmds:
      - task: _bun:unix
        vars:
          ARGS: >-
            x stylelint
            {{.RESOLVED_TARGETS}}
            {{- if .MODE_ARGS}} {{.MODE_ARGS}}{{end}}
            {{- if .RESOLVED_CONFIG}} --config "{{.RESOLVED_CONFIG}}"{{end}}
            {{- if eq .RESOLVED_CACHE "true"}} --cache --cache-location .cache/stylelint/{{end}}
            {{- if eq .RESOLVED_EMPTY "true"}} --allow-empty-input{{end}}
            {{.RESOLVED_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
      - task: _bun:windows
        vars:
          ARGS: >-
            x stylelint
            {{.RESOLVED_TARGETS}}
            {{- if .MODE_ARGS}} {{.MODE_ARGS}}{{end}}
            {{- if .RESOLVED_CONFIG}} --config "{{.RESOLVED_CONFIG}}"{{end}}
            {{- if eq .RESOLVED_CACHE "true"}} --cache --cache-location .cache/stylelint/{{end}}
            {{- if eq .RESOLVED_EMPTY "true"}} --allow-empty-input{{end}}
            {{.RESOLVED_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}

  ci:fix:
    run: once
    desc: Lint stylesheet targets with Stylelint and apply fixes
    cmds:
      - task: _run
        vars:
          MODE_ARGS: "--fix"
      - echo "✅ stylelint fixes applied"

  ci:
    run: once
    desc: Run Stylelint with zero-warning CI enforcement
    cmds:
      - task: _run
        vars:
          MODE_ARGS: "--max-warnings=0"
      - echo "✅ stylelint passed"

  cache:clean:
    run: once
    desc: Remove the Stylelint cache directory
    cmds:
      - if [ -d .cache/stylelint ]; then rm -rf .cache/stylelint; fi

  version:
    run: once
    desc: Show the locally resolved Stylelint version
    cmds:
      - task: _bun:unix
        vars:
          ARGS: x stylelint --version
      - task: _bun:windows
        vars:
          ARGS: x stylelint --version

  help:
    run: once
    desc: Show Stylelint CLI help
    cmds:
      - task: _bun:unix
        vars:
          ARGS: >-
            x stylelint --help
            {{.STYLELINT_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
      - task: _bun:windows
        vars:
          ARGS: >-
            x stylelint --help
            {{.STYLELINT_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}

  _bun:unix:
    run: when_changed
    internal: true
    platforms: [linux, darwin]
    dir: "{{.USER_WORKING_DIR}}"
    set: [errexit, nounset, pipefail]
    requires:
      vars: [ARGS]
    deps:
      - task: bun:_ensure
    env:
      CI: "1"
    cmds:
      - >-
        BUN_INSTALL="${BUN_INSTALL:-$HOME/.bun}"
        PATH="$BUN_INSTALL/bin:$PATH"
        bun {{.ARGS}}

  _bun:windows:
    run: when_changed
    internal: true
    platforms: [windows]
    dir: "{{.USER_WORKING_DIR}}"
    requires:
      vars: [ARGS]
    deps:
      - task: bun:_ensure
    env:
      CI: "1"
    cmds:
      - >-
        powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command
        "$ErrorActionPreference = 'Stop';
        $env:CI = '1';
        $bun = if (Get-Command bun -ErrorAction SilentlyContinue) { 'bun' }
        else { \"$env:USERPROFILE\.bun\bin\bun.exe\" }; & $bun {{.ARGS}}"
