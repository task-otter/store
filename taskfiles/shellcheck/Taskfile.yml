---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml

vars:
  SHELLCHECK_EXTRA_ARGS: '{{.SHELLCHECK_EXTRA_ARGS | default ""}}'
  SHELLCHECK_TARGETS: '{{.SHELLCHECK_TARGETS | default ""}}'
  SHELLCHECK_NIX_INSTALLABLE: '{{.SHELLCHECK_NIX_INSTALLABLE | default "nixpkgs#shellcheck"}}'

tasks:
  default:
    run: once
    desc: Show available ShellCheck automation tasks
    summary: Display the list of available ShellCheck-related tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install ShellCheck via the Nix profile
    summary: |
      Install ShellCheck into the user Nix profile when it is not already
      available on PATH. Override the SHELLCHECK_NIX_INSTALLABLE
      variable to pin a different package or version.
    status:
      - command -v shellcheck >/dev/null 2>&1
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.SHELLCHECK_NIX_INSTALLABLE}}"

  version:
    run: once
    desc: Show the active ShellCheck version
    summary: |
      Print the version reported by the shellcheck binary resolved from PATH.
      Auto-installs ShellCheck if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  ci:
    run: once
    desc: Lint shell scripts with ShellCheck (SHELLCHECK_TARGETS=glob)
    summary: |
      Run shellcheck against SHELLCHECK_TARGETS. When SHELLCHECK_TARGETS is empty, all *.sh and
      *.bash files under the working tree are discovered recursively (excluding .git).
      Pass explicit paths or globs to check specific scripts. Pass SHELLCHECK_EXTRA_ARGS
      for additional flags such as --shell or --severity, or CLI arguments
      after -- to override all variables directly. Auto-installs ShellCheck if missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    cmds:
      - task: _lint:unix
      - task: _lint:windows

  _version:unix:
    run: once
    internal: true
    desc: Show ShellCheck version on macOS or Linux
    summary: Print the ShellCheck version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; shellcheck --version'

  _version:windows:
    run: once
    internal: true
    desc: Show ShellCheck version on Windows
    summary: Print the ShellCheck version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Get-Command shellcheck -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: ShellCheck is not installed or not available in PATH.
    cmds:
      - shellcheck --version

  _lint:unix:
    run: once
    internal: true
    platforms: [darwin, linux]
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        bash -lc '{{.NIX_LOAD}};
        if [ -n "{{.CLI_ARGS}}" ]; then
          shellcheck {{.CLI_ARGS}} && echo "✅ shellcheck passed" || { echo "❌ shellcheck failed"; exit 1; }
          exit
        fi

        extra="{{.SHELLCHECK_EXTRA_ARGS}}"
        targets="{{.SHELLCHECK_TARGETS}}
        "
        file_list="$(mktemp)"
        trap '"'"'rm -f "$file_list"'"'"' EXIT

        if [ -z "$targets" ]; then
          find . -type f \( -name "*.sh" -o -name "*.bash" \) ! -path "*/.git/*" -print0
        else
          for target in $targets; do
            if [ -d "$target" ]; then
              find "$target" -type f \( -name "*.sh" -o -name "*.bash" \) ! -path "*/.git/*" -print0
            elif [ -f "$target" ]; then
              printf "%s\000" "$target"
            fi
          done
        fi >"$file_list"

        if [ ! -s "$file_list" ]; then
          echo "✅ shellcheck passed (no matching shell scripts found)"
          exit 0
        fi

        xargs -0 shellcheck $extra <"$file_list"
        echo "✅ shellcheck passed"'

  _lint:windows:
    run: once
    internal: true
    platforms: [windows]
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "$ErrorActionPreference='Stop';
        if ('{{.CLI_ARGS}}') {
          shellcheck {{.CLI_ARGS}}; exit $LASTEXITCODE
        };
        $extra='{{.SHELLCHECK_EXTRA_ARGS}}';
        $targets='{{.SHELLCHECK_TARGETS}}
        ';
        if (-not $targets) {
          $files = Get-ChildItem -Recurse -Filter '*.sh' -File |
            Where-Object { $_.FullName -notmatch '\\\.git\\' };
        } else {
          $files = @($targets.Split(' ') | ForEach-Object {
            if (Test-Path -LiteralPath $_ -PathType Container) {
              Get-ChildItem -LiteralPath $_ -Recurse -File |
                Where-Object { $_.Extension -in @('.sh', '.bash') -and $_.FullName -notmatch '\\\.git\\' }
            } elseif (Test-Path -LiteralPath $_ -PathType Leaf) {
              Get-Item -LiteralPath $_
            }
          });
        };
        $paths = @($files | ForEach-Object FullName);
        if (-not $paths) { Write-Host 'No matching shell scripts found'; exit 0 };
        $arguments = @();
        if ($extra) { $arguments += $extra.Split(' ') };
        shellcheck @arguments @paths;
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE };
        Write-Host '✅ shellcheck passed'"
