---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml

vars:
  SHELLCHECK_EXTRA_ARGS: ""
  SHELLCHECK_TARGETS: ""
  SHELLCHECK_NIX_INSTALLABLE: nixpkgs#shellcheck

tasks:
  default:
    run: once
    desc: Show available ShellCheck automation tasks
    summary: Display the list of available ShellCheck-related tasks defined in this Taskfile.
    cmds:
      - task --list

  ci:
    run: once
    desc: Lint shell scripts with ShellCheck (SHELLCHECK_TARGETS=glob)
    summary: |
      Run shellcheck against SHELLCHECK_TARGETS. When SHELLCHECK_TARGETS is empty, all *.sh and
      *.bash files under the working tree are discovered recursively (excluding .git).
      Pass explicit paths or globs to check specific scripts. Pass SHELLCHECK_EXTRA_ARGS
      for additional flags such as --shell or --severity, or CLI arguments
      after -- to override all variables directly. Auto-installs ShellCheck if missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.SHELLCHECK_NIX_INSTALLABLE}}"
    cmds:
      - task: _lint:unix
      - task: _lint:windows

  _lint:unix:
    run: once
    internal: true
    platforms: [darwin, linux]
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        bash -lc '{{.NIX_LOAD}};
        if [ -n "{{.CLI_ARGS}}" ]; then
          shellcheck {{.CLI_ARGS}} && echo "✅ shellcheck passed" || { echo "❌ shellcheck failed"; exit 1; }
          exit
        fi

        extra="{{if .SHELLCHECK_EXTRA_ARGS_OVERRIDE}}{{.SHELLCHECK_EXTRA_ARGS_OVERRIDE}}
        {{- else}}{{.SHELLCHECK_EXTRA_ARGS}}{{end}}"
        targets="{{if .SHELLCHECK_TARGETS_OVERRIDE}}{{.SHELLCHECK_TARGETS_OVERRIDE}}{{else}}{{.SHELLCHECK_TARGETS}}
        {{end}}"
        file_list="$(mktemp)"
        trap '"'"'rm -f "$file_list"'"'"' EXIT

        if [ -z "$targets" ]; then
          find . -type f \( -name "*.sh" -o -name "*.bash" \) ! -path "*/.git/*" -print0
        else
          for target in $targets; do
            if [ -d "$target" ]; then
              find "$target" -type f \( -name "*.sh" -o -name "*.bash" \) ! -path "*/.git/*" -print0
            elif [ -f "$target" ]; then
              printf "%s\000" "$target"
            fi
          done
        fi >"$file_list"

        if [ ! -s "$file_list" ]; then
          echo "✅ shellcheck passed (no matching shell scripts found)"
          exit 0
        fi

        xargs -0 shellcheck $extra <"$file_list"
        echo "✅ shellcheck passed"'

  _lint:windows:
    run: once
    internal: true
    platforms: [windows]
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "$ErrorActionPreference='Stop';
        if ('{{.CLI_ARGS}}') {
          shellcheck {{.CLI_ARGS}}; exit $LASTEXITCODE
        };
        $extra='{{if .SHELLCHECK_EXTRA_ARGS_OVERRIDE}}{{.SHELLCHECK_EXTRA_ARGS_OVERRIDE}}
        {{else}}{{.SHELLCHECK_EXTRA_ARGS}}{{end}}';
        $targets='{{if .SHELLCHECK_TARGETS_OVERRIDE}}{{.SHELLCHECK_TARGETS_OVERRIDE}}{{else}}{{.SHELLCHECK_TARGETS}}
        {{end}}';
        if (-not $targets) {
          $files = Get-ChildItem -Recurse -Filter '*.sh' -File |
            Where-Object { $_.FullName -notmatch '\\\.git\\' };
        } else {
          $files = @($targets.Split(' ') | ForEach-Object {
            if (Test-Path -LiteralPath $_ -PathType Container) {
              Get-ChildItem -LiteralPath $_ -Recurse -File |
                Where-Object { $_.Extension -in @('.sh', '.bash') -and $_.FullName -notmatch '\\\.git\\' }
            } elseif (Test-Path -LiteralPath $_ -PathType Leaf) {
              Get-Item -LiteralPath $_
            }
          });
        };
        $paths = @($files | ForEach-Object FullName);
        if (-not $paths) { Write-Host 'No matching shell scripts found'; exit 0 };
        $arguments = @();
        if ($extra) { $arguments += $extra.Split(' ') };
        shellcheck @arguments @paths;
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE };
        Write-Host '✅ shellcheck passed'"
