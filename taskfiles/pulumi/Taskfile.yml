---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml

vars:
  PULUMI_NIX_INSTALLABLE: nixpkgs#pulumi
  PULUMI_LOGIN_URL: ""
  PULUMI_TEMPLATE: ""
  PULUMI_STACK: ""
  PULUMI_ARGS: ""
  PULUMI_EXTRA_ARGS: ""

tasks:
  default:
    run: once
    desc: Show available Pulumi automation tasks
    summary: Display the list of available Pulumi-related tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install Pulumi via the Nix profile
    summary: |
      Install Pulumi into the user Nix profile when it is not already
      available on PATH. Override the PULUMI_NIX_INSTALLABLE
      variable to pin a different package or version.
    status:
      - command -v pulumi >/dev/null 2>&1
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.PULUMI_NIX_INSTALLABLE}}"

  version:
    run: once
    desc: Show the active Pulumi version
    summary: |
      Print the version reported by the pulumi binary resolved from PATH.
      Auto-installs Pulumi if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  login:
    run: once
    dir: "{{.USER_WORKING_DIR}}"
    desc: Log in to a Pulumi backend
    summary: |
      Run `pulumi login` against PULUMI_LOGIN_URL, falling back to the default
      Pulumi Cloud backend when empty. Pass PULUMI_EXTRA_ARGS for extra flags.
      Auto-installs Pulumi if missing.
    deps:
      - task: install
    cmds:
      - task: _pulumi:unix
        vars:
          PULUMI_ARGS: >-
            login
            {{if .PULUMI_LOGIN_URL}}"{{.PULUMI_LOGIN_URL}}"{{end}}
            {{.PULUMI_EXTRA_ARGS}}
      - task: _pulumi:windows
        vars:
          PULUMI_ARGS: >-
            login
            {{if .PULUMI_LOGIN_URL}}"{{.PULUMI_LOGIN_URL}}"{{end}}
            {{.PULUMI_EXTRA_ARGS}}

  new:
    run: once
    dir: "{{.USER_WORKING_DIR}}"
    desc: Scaffold a new Pulumi project from a template (PULUMI_TEMPLATE=name)
    summary: |
      Run `pulumi new PULUMI_TEMPLATE` to scaffold a new Pulumi project from a
      named template (for example aws-typescript or gcp-python). Pass
      PULUMI_EXTRA_ARGS for extra flags such as --yes or --dir.
      Auto-installs Pulumi if missing.
    deps:
      - task: install
    requires:
      vars:
        - PULUMI_TEMPLATE
    preconditions:
      - sh: test -n "{{.PULUMI_TEMPLATE}}"
        msg: PULUMI_TEMPLATE is required. Pass PULUMI_TEMPLATE=name when running this task.
    cmds:
      - task: _pulumi:unix
        vars:
          PULUMI_ARGS: >-
            new
            "{{.PULUMI_TEMPLATE}}"
            {{.PULUMI_EXTRA_ARGS}}
      - task: _pulumi:windows
        vars:
          PULUMI_ARGS: >-
            new
            "{{.PULUMI_TEMPLATE}}"
            {{.PULUMI_EXTRA_ARGS}}

  up:
    run: once
    dir: "{{.USER_WORKING_DIR}}"
    desc: Preview and deploy the current Pulumi stack
    summary: |
      Run `pulumi up` in the current working directory. Pass PULUMI_STACK=name
      to target a specific stack and PULUMI_EXTRA_ARGS for extra flags such as
      --yes or --skip-preview.
      Auto-installs Pulumi if missing.
    deps:
      - task: install
    cmds:
      - task: _pulumi:unix
        vars:
          PULUMI_ARGS: >-
            up
            {{if .PULUMI_STACK}}--stack "{{.PULUMI_STACK}}"{{end}}
            {{.PULUMI_EXTRA_ARGS}}
      - task: _pulumi:windows
        vars:
          PULUMI_ARGS: >-
            up
            {{if .PULUMI_STACK}}--stack "{{.PULUMI_STACK}}"{{end}}
            {{.PULUMI_EXTRA_ARGS}}

  _pulumi:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    requires:
      vars: [PULUMI_ARGS]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; pulumi {{.PULUMI_ARGS}}'

  _pulumi:windows:
    run: once
    internal: true
    platforms: [windows]
    requires:
      vars: [PULUMI_ARGS]
    cmds:
      - pulumi {{.PULUMI_ARGS}}

  _version:unix:
    run: once
    internal: true
    desc: Show Pulumi version on macOS or Linux
    summary: Print the Pulumi version on macOS or Linux.
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; pulumi version'

  _version:windows:
    run: once
    internal: true
    desc: Show Pulumi version on Windows
    summary: Print the Pulumi version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Get-Command pulumi -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: Pulumi is not installed or not available in PATH.
    cmds:
      - pulumi version
