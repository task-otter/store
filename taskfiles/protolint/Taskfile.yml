---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml

vars:
  PROTOLINT_EXTRA_ARGS: ""
  PROTOLINT_NIX_INSTALLABLE: nixpkgs#protolint
  PROTOLINT_TARGETS: "."

tasks:
  default:
    run: once
    desc: Show available protolint automation tasks
    summary: Display the list of available protolint-related tasks defined in this Taskfile.
    cmds:
      - task --list

  ci:
    run: once
    desc: Lint protobuf files with protolint (PROTOLINT_TARGETS=path)
    summary: |
      Run protolint lint against PROTOLINT_TARGETS (default: .). Pass PROTOLINT_EXTRA_ARGS for
      protolint options such as -config_path or -reporter json.
      Auto-installs protolint if needed.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.PROTOLINT_NIX_INSTALLABLE}}"
    cmds:
      - task: _lint:unix
      - task: _lint:windows

  ci:fix:
    run: once
    desc: Fix protobuf lint issues with protolint (PROTOLINT_TARGETS=path)
    summary: |
      Run protolint lint -fix against PROTOLINT_TARGETS (default: .) to apply automatic
      fixes for fixable lint violations. Pass PROTOLINT_EXTRA_ARGS for protolint options.
      Auto-installs protolint if needed.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.PROTOLINT_NIX_INSTALLABLE}}"
    cmds:
      - task: _fix:unix
      - task: _fix:windows

  _lint:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    cmds:
      - task: _lint:run:unix
        vars:
          PROTOLINT_FIX_FLAG: ""

  _lint:windows:
    run: once
    internal: true
    platforms: [windows]
    cmds:
      - task: _lint:run:windows
        vars:
          PROTOLINT_FIX_FLAG: ""

  _fix:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    cmds:
      - task: _lint:run:unix
        vars:
          PROTOLINT_FIX_FLAG: "-fix"

  _fix:windows:
    run: once
    internal: true
    platforms: [windows]
    cmds:
      - task: _lint:run:windows
        vars:
          PROTOLINT_FIX_FLAG: "-fix"

  _lint:run:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    cmds:
      - |
        bash -lc '{{.NIX_LOAD}};
        protolint lint {{.PROTOLINT_FIX_FLAG}} \
          {{if .PROTOLINT_EXTRA_ARGS_OVERRIDE}}{{.PROTOLINT_EXTRA_ARGS_OVERRIDE}}
          {{- else}}{{.PROTOLINT_EXTRA_ARGS}}{{end}} \
          "{{if .PROTOLINT_TARGETS_OVERRIDE}}{{.PROTOLINT_TARGETS_OVERRIDE}}
          {{- else}}{{.PROTOLINT_TARGETS}}{{end}}"'

  _lint:run:windows:
    run: once
    internal: true
    platforms: [windows]
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "$target='{{if .PROTOLINT_TARGETS_OVERRIDE}}{{.PROTOLINT_TARGETS_OVERRIDE}}
        {{- else}}{{.PROTOLINT_TARGETS}}{{end}}';
        protolint lint {{.PROTOLINT_FIX_FLAG}}
          {{if .PROTOLINT_EXTRA_ARGS_OVERRIDE}}{{.PROTOLINT_EXTRA_ARGS_OVERRIDE}}
          {{- else}}{{.PROTOLINT_EXTRA_ARGS}}{{end}} $target;
        exit $LASTEXITCODE"
