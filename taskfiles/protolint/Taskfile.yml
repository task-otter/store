---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml

vars:
  PROTOLINT_EXTRA_ARGS: ""
  PROTOLINT_NIX_INSTALLABLE: nixpkgs#protolint
  PROTOLINT_TARGETS: "."

tasks:
  default:
    run: once
    desc: Show available protolint automation tasks
    summary: Display the list of available protolint-related tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install protolint via the Nix profile
    summary: |
      Install protolint into the user Nix profile when it is not already
      available on PATH. Override the PROTOLINT_NIX_INSTALLABLE
      variable to pin a different package or version.
    status:
      - command -v protolint >/dev/null 2>&1
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.PROTOLINT_NIX_INSTALLABLE}}"

  version:
    run: once
    desc: Show the active protolint version
    summary: |
      Print the version reported by the protolint binary resolved from PATH.
      Auto-installs protolint if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  ci:
    run: once
    desc: Lint protobuf files with protolint (PROTOLINT_TARGETS=path)
    summary: |
      Run protolint lint against PROTOLINT_TARGETS (default: .). Pass PROTOLINT_EXTRA_ARGS for
      protolint options such as -config_path or -reporter json.
      Auto-installs protolint if needed.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    cmds:
      - task: _lint:unix
      - task: _lint:windows

  ci:fix:
    run: once
    desc: Fix protobuf lint issues with protolint (PROTOLINT_TARGETS=path)
    summary: |
      Run protolint lint -fix against PROTOLINT_TARGETS (default: .) to apply automatic
      fixes for fixable lint violations. Pass PROTOLINT_EXTRA_ARGS for protolint options.
      Auto-installs protolint if needed.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    cmds:
      - task: _fix:unix
      - task: _fix:windows

  _lint:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    cmds:
      - task: _lint:run:unix
        vars:
          PROTOLINT_FIX_FLAG: ""

  _lint:windows:
    run: once
    internal: true
    platforms: [windows]
    cmds:
      - task: _lint:run:windows
        vars:
          PROTOLINT_FIX_FLAG: ""

  _fix:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    cmds:
      - task: _lint:run:unix
        vars:
          PROTOLINT_FIX_FLAG: "-fix"

  _fix:windows:
    run: once
    internal: true
    platforms: [windows]
    cmds:
      - task: _lint:run:windows
        vars:
          PROTOLINT_FIX_FLAG: "-fix"

  _lint:run:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    cmds:
      - |
        bash -lc '{{.NIX_LOAD}};
        protolint lint {{.PROTOLINT_FIX_FLAG}} \
          {{.PROTOLINT_EXTRA_ARGS}} \
          "{{.PROTOLINT_TARGETS}}"'

  _lint:run:windows:
    run: once
    internal: true
    platforms: [windows]
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "$target='{{.PROTOLINT_TARGETS}}';
        protolint lint {{.PROTOLINT_FIX_FLAG}}
          {{.PROTOLINT_EXTRA_ARGS}} $target;
        exit $LASTEXITCODE"

  _version:unix:
    run: once
    internal: true
    desc: Show protolint version on macOS or Linux
    summary: Print the protolint version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; protolint version'

  _version:windows:
    run: once
    internal: true
    desc: Show protolint version on Windows
    summary: Print the protolint version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Get-Command protolint -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: protolint is not installed or not available in PATH.
    cmds:
      - protolint version
