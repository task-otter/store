---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  go:
    taskfile: ../go/Taskfile.yml
  nix:
    taskfile: ../nix/Taskfile.yml
  winget:
    taskfile: ../winget/Taskfile.yml

vars:
  PROTOLINT_EXTRA_ARGS: '{{.PROTOLINT_EXTRA_ARGS | default ""}}'
  PROTOLINT_NIX_INSTALLABLE: '{{.PROTOLINT_NIX_INSTALLABLE | default "nixpkgs#protolint"}}'
  PROTOLINT_GO_PKG: '{{.PROTOLINT_GO_PKG | default "github.com/yoheimuta/protolint/cmd/protolint@latest"}}'
  PROTOLINT_TARGETS: '{{.PROTOLINT_TARGETS | default "."}}'

tasks:
  default:
    run: once
    desc: Show available protolint automation tasks
    summary: Display the list of available protolint-related tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install protolint via Nix (Unix) or go install (Windows)
    summary: |
      Install protolint into the user Nix profile on Linux and macOS when it
      is not already on PATH. On Windows, installs via go:install:pkg using
      PROTOLINT_GO_PKG. Override PROTOLINT_NIX_INSTALLABLE or PROTOLINT_GO_PKG
      to pin a different package or version.
    cmds:
      - task: _install:unix
      - task: _install:windows

  _install:unix:
    internal: true
    platforms: [linux, darwin]
    status:
      - command -v protolint >/dev/null 2>&1
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.PROTOLINT_NIX_INSTALLABLE}}"

  _install:windows:
    internal: true
    platforms: [windows]
    status:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "{{.WINGET_LOAD}}; {{.GO_LOAD}}; protolint version; exit \$LASTEXITCODE"
    cmds:
      - task: go:install:pkg
        vars:
          GO_PKG: "{{.PROTOLINT_GO_PKG}}"

  version:
    run: once
    desc: Show the active protolint version
    summary: |
      Print the version reported by the protolint binary resolved from PATH.
      Auto-installs Go and protolint if missing.
    deps:
      - task: go:install
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  ci:
    run: once
    desc: Lint protobuf files with protolint (PROTOLINT_TARGETS=path)
    summary: |
      Run protolint lint against PROTOLINT_TARGETS (default: .). Pass PROTOLINT_EXTRA_ARGS for
      protolint options such as -config_path or -reporter json.
      Auto-installs Go and protolint if needed.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: go:install
      - task: install
    cmds:
      - task: _lint:unix
      - task: _lint:windows

  ci:fix:
    run: once
    desc: Fix protobuf lint issues with protolint (PROTOLINT_TARGETS=path)
    summary: |
      Run protolint lint -fix against PROTOLINT_TARGETS (default: .) to apply automatic
      fixes for fixable lint violations. Pass PROTOLINT_EXTRA_ARGS for protolint options.
      Auto-installs Go and protolint if needed.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: go:install
      - task: install
    cmds:
      - task: _fix:unix
      - task: _fix:windows

  _lint:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    cmds:
      - task: _lint:run:unix
        vars:
          PROTOLINT_FIX_FLAG: ""

  _lint:windows:
    run: once
    internal: true
    platforms: [windows]
    cmds:
      - task: _lint:run:windows
        vars:
          PROTOLINT_FIX_FLAG: ""

  _fix:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    cmds:
      - task: _lint:run:unix
        vars:
          PROTOLINT_FIX_FLAG: "-fix"

  _fix:windows:
    run: once
    internal: true
    platforms: [windows]
    cmds:
      - task: _lint:run:windows
        vars:
          PROTOLINT_FIX_FLAG: "-fix"

  _lint:run:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    cmds:
      - |
        bash -lc '{{.NIX_LOAD}};
        protolint lint {{.PROTOLINT_FIX_FLAG}} \
          {{.PROTOLINT_EXTRA_ARGS}} \
          "{{.PROTOLINT_TARGETS}}"'

  _lint:run:windows:
    run: once
    internal: true
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; {{.GO_LOAD}}; protolint version; exit \$LASTEXITCODE"
        msg: protolint is not installed or not available in PATH.
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "{{.WINGET_LOAD}}; {{.GO_LOAD}};
        \$target='{{.PROTOLINT_TARGETS}}';
        protolint lint {{.PROTOLINT_FIX_FLAG}}
          {{.PROTOLINT_EXTRA_ARGS}} \$target;
        exit \$LASTEXITCODE"

  _version:unix:
    run: once
    internal: true
    desc: Show protolint version on macOS or Linux
    summary: Print the protolint version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; protolint version'

  _version:windows:
    run: once
    internal: true
    desc: Show protolint version on Windows
    summary: Print the protolint version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; {{.GO_LOAD}}; protolint version; exit \$LASTEXITCODE"
        msg: protolint is not installed or not available in PATH.
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "{{.WINGET_LOAD}}; {{.GO_LOAD}}; protolint version; exit \$LASTEXITCODE"
