---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml

  jq: ../jq/Taskfile.yml

vars:
  VAULT_ADDR: "http://127.0.0.1:8200"
  VAULT_ADDR_TARGET: "{{if .VAULT_ADDR_OVERRIDE}}{{.VAULT_ADDR_OVERRIDE}}{{else}}{{.VAULT_ADDR}}{{end}}"
  VAULT_KEYS_FILE: .vault-init-keys.json
  VAULT_SHARES: 5
  VAULT_THRESHOLD: 3
  VAULT_SNAPSHOT_FILE: vault-snapshot.snap
  VAULT_FILE: ""
  VAULT_EXTRA_ARGS: ""
  VAULT_ROOT_TOKEN: ""
  VAULT_ROLE_ID: ""
  VAULT_SECRET_ID: ""
  VAULT_APPROLE_MOUNT: "approle"
  VAULT_NIX_INSTALLABLE: nixpkgs#vault

env:
  VAULT_ADDR: "{{.VAULT_ADDR_TARGET}}"

tasks:
  default:
    run: once
    desc: Show available Vault automation tasks
    summary: Display the list of available HashiCorp Vault-related tasks defined in this Taskfile.
    cmds:
      - task --list

  verify:
    run: once
    desc: Verify the Vault CLI installation and server connectivity
    summary: |
      Print the Vault CLI version and current server status. Useful for confirming
      the binary is installed and the server at VAULT_ADDR is reachable.
      Auto-installs the CLI if missing.
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.VAULT_NIX_INSTALLABLE}}"
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; vault version'
        platforms: [linux, darwin]
      - cmd: vault version
        platforms: [windows]
      - cmd: bash -lc '{{.NIX_LOAD}}; vault status -address="{{.VAULT_ADDR_TARGET}}"'
        platforms: [linux, darwin]
      - cmd: vault status -address="{{.VAULT_ADDR_TARGET}}"
        platforms: [windows]

  status:
    run: once
    desc: Show Vault seal and HA status
    summary: |
      Run vault status to display the current seal state, HA mode, cluster info,
      and active node details. Exits with a non-zero code if sealed — the ||true
      prevents task failure when the server is sealed or unreachable.
      Auto-installs the CLI if missing.
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.VAULT_NIX_INSTALLABLE}}"
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; vault status -address="{{.VAULT_ADDR_TARGET}}" || true'
        platforms: [linux, darwin]
      - cmd: vault status -address="{{.VAULT_ADDR_TARGET}}" || true
        platforms: [windows]

  health:
    run: once
    desc: Show Vault health as JSON (VAULT_ADDR=url)
    summary: |
      Fetch the raw health JSON from the Vault HTTP API at VAULT_ADDR/v1/sys/health
      and pretty-print it with jq. Returns HTTP 200 when active, 429 when standby,
      472 when in recovery mode, and 501 when uninitialized.
      This task only uses curl and jq — it does not require the Vault CLI.
    set: [errexit, nounset, pipefail]
    deps:
      - task: jq:nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.JQ_NIX_INSTALLABLE}}"
    preconditions:
      - sh: command -v curl >/dev/null 2>&1
        msg: curl is required to query the Vault health endpoint.
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          curl -s
          "{{.VAULT_ADDR_TARGET}}/v1/sys/health"
          | jq .'
        platforms: [linux, darwin]
      - cmd: >-
          curl -s
          "{{.VAULT_ADDR_TARGET}}/v1/sys/health"
          | jq .
        platforms: [windows]

  init:
    run: once
    desc: Initialize Vault and save unseal keys (VAULT_KEYS_FILE=path)
    summary: |
      Run vault operator init with SHARES key shares and THRESHOLD as the unseal
      threshold. The resulting JSON — containing unseal keys and the root token —
      is written to KEYS_FILE with mode 600 under umask 077 and is not echoed to
      stdout. Keep this file safe and out of version control.
      KEYS_FILE defaults to .vault-init-keys.json.
      Auto-installs the CLI if missing.
    set: [errexit, nounset, pipefail]
    preconditions:
      - sh: test ! -e "{{if .VAULT_KEYS_FILE_OVERRIDE}}{{.VAULT_KEYS_FILE_OVERRIDE}}{{else}}{{.VAULT_KEYS_FILE}}{{end}}"
        msg: >-
          KEYS_FILE already exists:
          {{if .VAULT_KEYS_FILE_OVERRIDE}}{{.VAULT_KEYS_FILE_OVERRIDE}}{{else}}{{.VAULT_KEYS_FILE}}{{end}}.
          Move or remove it before running init again.
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.VAULT_NIX_INSTALLABLE}}"
      - |
        {{.NIX_LOAD}}
        KF="{{if .VAULT_KEYS_FILE_OVERRIDE}}{{.VAULT_KEYS_FILE_OVERRIDE}}{{else}}{{.VAULT_KEYS_FILE}}{{end}}"
        TMP="${KF}.tmp.$$"
        trap 'rm -f "$TMP"' EXIT
        if [ -e "$KF" ]; then
          echo "KEYS_FILE already exists: $KF. Move or remove it before running init again." >&2
          exit 1
        fi
        vault operator init \
          -address="{{.VAULT_ADDR_TARGET}}" \
          -key-shares={{if .VAULT_SHARES_OVERRIDE}}{{.VAULT_SHARES_OVERRIDE}}{{else}}{{.VAULT_SHARES}}{{end}} \
          -key-threshold={{if .VAULT_THRESHOLD_OVERRIDE}}{{.VAULT_THRESHOLD_OVERRIDE}}
          {{- else}}{{.VAULT_THRESHOLD}}{{end}} \
          -format=json > "$TMP"
        chmod 600 "$TMP"
        mv "$TMP" "$KF"
        trap - EXIT
        echo "Vault initialized. Unseal keys and root token saved to $KF"

  unseal:
    run: once
    desc: Unseal Vault using saved keys (VAULT_KEYS_FILE=path)
    summary: |
      Read THRESHOLD unseal keys from KEYS_FILE and submit each one via
      vault operator unseal. KEYS_FILE must exist and contain the JSON produced
      by the init task. Requires jq.
      Auto-installs the CLI if missing.
    set: [errexit, nounset, pipefail]
    preconditions:
      - sh: test -f "{{if .VAULT_KEYS_FILE_OVERRIDE}}{{.VAULT_KEYS_FILE_OVERRIDE}}{{else}}{{.VAULT_KEYS_FILE}}{{end}}"
        msg: >-
          KEYS_FILE not found. Run task init first to generate
          {{if .VAULT_KEYS_FILE_OVERRIDE}}{{.VAULT_KEYS_FILE_OVERRIDE}}{{else}}{{.VAULT_KEYS_FILE}}{{end}}.
    cmds:
      - task: jq:nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.JQ_NIX_INSTALLABLE}}"
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.VAULT_NIX_INSTALLABLE}}"
      - |
        {{.NIX_LOAD}}
        VAULT_KEYS_FILE="{{if .VAULT_KEYS_FILE_OVERRIDE}}{{.VAULT_KEYS_FILE_OVERRIDE}}
        {{- else}}{{.VAULT_KEYS_FILE}}{{end}}"
        VAULT_THRESHOLD="{{if .VAULT_THRESHOLD_OVERRIDE}}{{.VAULT_THRESHOLD_OVERRIDE}}
        {{- else}}{{.VAULT_THRESHOLD}}{{end}}"
        for key in $(jq -r ".unseal_keys_b64[0:${THRESHOLD}][]" "$KEYS_FILE"); do
          vault operator unseal -address="{{.VAULT_ADDR_TARGET}}" "$key"
        done

  seal:
    run: once
    desc: Seal the Vault server
    summary: |
      Run vault operator seal to re-seal the active Vault server. After sealing,
      the server will not serve secrets until it is unsealed again with the
      required number of unseal key shares. Requires an authenticated session.
      Auto-installs the CLI if missing.
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.VAULT_NIX_INSTALLABLE}}"
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; vault operator seal -address="{{.VAULT_ADDR_TARGET}}"'
        platforms: [linux, darwin]
      - cmd: vault operator seal -address="{{.VAULT_ADDR_TARGET}}"
        platforms: [windows]

  login:
    run: once
    desc: Log in to Vault using the saved root token (VAULT_KEYS_FILE=path)
    summary: |
      Extract the root token from KEYS_FILE and authenticate with vault login.
      KEYS_FILE must exist and contain the JSON produced by the init task.
      After login, subsequent vault commands will use this token automatically.
      Auto-installs the CLI if missing.
    set: [errexit, nounset, pipefail]
    preconditions:
      - sh: test -f "{{if .VAULT_KEYS_FILE_OVERRIDE}}{{.VAULT_KEYS_FILE_OVERRIDE}}{{else}}{{.VAULT_KEYS_FILE}}{{end}}"
        msg: >-
          KEYS_FILE not found. Run task init first to generate
          {{if .VAULT_KEYS_FILE_OVERRIDE}}{{.VAULT_KEYS_FILE_OVERRIDE}}{{else}}{{.VAULT_KEYS_FILE}}{{end}}.
    cmds:
      - task: jq:nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.JQ_NIX_INSTALLABLE}}"
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.VAULT_NIX_INSTALLABLE}}"
      - |
        {{.NIX_LOAD}}
        KF="{{if .VAULT_KEYS_FILE_OVERRIDE}}{{.VAULT_KEYS_FILE_OVERRIDE}}{{else}}{{.VAULT_KEYS_FILE}}{{end}}"
        jq -r '.root_token' "$KF" \
          | vault login -address="{{.VAULT_ADDR_TARGET}}" -method=token -no-print -

  login:root-token:
    run: once
    desc: Log in to Vault using a token directly (VAULT_ROOT_TOKEN=<token>)
    summary: |
      Authenticate with Vault using a root or service token passed directly
      via the ROOT_TOKEN variable. The token is read from the variable and
      piped to vault login via stdin so it does not appear in the process
      argument list. After login, subsequent vault commands use this token
      automatically via the token helper.
      Auto-installs the CLI if missing.
    set: [errexit, nounset, pipefail]
    env:
      VAULT_LOGIN_ROOT_TOKEN: >-
        {{if .VAULT_ROOT_TOKEN_OVERRIDE}}{{.VAULT_ROOT_TOKEN_OVERRIDE}}
        {{- else}}{{.VAULT_ROOT_TOKEN}}{{end}}
    preconditions:
      - sh: test -n "$VAULT_LOGIN_ROOT_TOKEN"
        msg: ROOT_TOKEN must be set. Pass VAULT_ROOT_TOKEN=<token> on the command line.
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.VAULT_NIX_INSTALLABLE}}"
      - |
        {{.NIX_LOAD}}
        printf '%s' "$VAULT_LOGIN_ROOT_TOKEN" \
          | vault login -address="{{.VAULT_ADDR_TARGET}}" -method=token -no-print -

  login:approle:
    run: once
    desc: Log in to Vault via AppRole (VAULT_ROLE_ID=<id> VAULT_SECRET_ID=<id>)
    summary: |
      Authenticate with Vault using the AppRole auth method. Requires a role_id
      and secret_id passed via the ROLE_ID and SECRET_ID task variables.
      The AppRole mount path defaults to "approle" and can be overridden with
      APPROLE_MOUNT. After login, subsequent vault commands use the resulting
      client token automatically via the token helper.
      Auto-installs the CLI if missing.
    set: [errexit, nounset, pipefail]
    env:
      VAULT_LOGIN_ROLE_ID: "{{if .VAULT_ROLE_ID_OVERRIDE}}{{.VAULT_ROLE_ID_OVERRIDE}}{{else}}{{.VAULT_ROLE_ID}}{{end}}"
      VAULT_LOGIN_SECRET_ID: >-
        {{if .VAULT_SECRET_ID_OVERRIDE}}{{.VAULT_SECRET_ID_OVERRIDE}}
        {{- else}}{{.VAULT_SECRET_ID}}{{end}}
      VAULT_LOGIN_APPROLE_MOUNT: >-
        {{if .VAULT_APPROLE_MOUNT_OVERRIDE}}{{.VAULT_APPROLE_MOUNT_OVERRIDE}}
        {{- else}}{{.VAULT_APPROLE_MOUNT}}{{end}}
    preconditions:
      - sh: test -n "$VAULT_LOGIN_ROLE_ID"
        msg: ROLE_ID must be set. Pass VAULT_ROLE_ID=<role-id> on the command line.
      - sh: test -n "$VAULT_LOGIN_SECRET_ID"
        msg: SECRET_ID must be set. Pass VAULT_SECRET_ID=<secret-id> on the command line.
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.VAULT_NIX_INSTALLABLE}}"
      - |
        {{.NIX_LOAD}}
        printf '%s' "$VAULT_LOGIN_SECRET_ID" \
          | vault write \
            -address="{{.VAULT_ADDR_TARGET}}" \
            -field=token \
            "auth/${VAULT_LOGIN_APPROLE_MOUNT}/login" \
            role_id="$VAULT_LOGIN_ROLE_ID" \
            secret_id=- \
          | vault login \
            -address="{{.VAULT_ADDR_TARGET}}" \
            -method=token \
            -no-print \
            -

  token:issue:approle:
    run: once
    desc: Issue a Vault token via AppRole and print it to stdout (VAULT_ROLE_ID=<id> VAULT_SECRET_ID=<id>)
    summary: |
      Authenticate with Vault using the AppRole auth method and print the resulting
      client token to stdout. Unlike login:approle, the token is not stored in the
      token helper — it is only emitted to stdout for capture by the caller.
      Requires ROLE_ID and SECRET_ID task variables. APPROLE_MOUNT defaults to "approle".
      Auto-installs the CLI if missing.
    set: [errexit, nounset, pipefail]
    env:
      VAULT_LOGIN_ROLE_ID: "{{if .VAULT_ROLE_ID_OVERRIDE}}{{.VAULT_ROLE_ID_OVERRIDE}}{{else}}{{.VAULT_ROLE_ID}}{{end}}"
      VAULT_LOGIN_SECRET_ID: >-
        {{if .VAULT_SECRET_ID_OVERRIDE}}{{.VAULT_SECRET_ID_OVERRIDE}}
        {{- else}}{{.VAULT_SECRET_ID}}{{end}}
      VAULT_LOGIN_APPROLE_MOUNT: >-
        {{if .VAULT_APPROLE_MOUNT_OVERRIDE}}{{.VAULT_APPROLE_MOUNT_OVERRIDE}}
        {{- else}}{{.VAULT_APPROLE_MOUNT}}{{end}}
    preconditions:
      - sh: test -n "$VAULT_LOGIN_ROLE_ID"
        msg: ROLE_ID must be set. Pass VAULT_ROLE_ID=<role-id> on the command line.
      - sh: test -n "$VAULT_LOGIN_SECRET_ID"
        msg: SECRET_ID must be set. Pass VAULT_SECRET_ID=<secret-id> on the command line.
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.VAULT_NIX_INSTALLABLE}}"
      - |
        {{.NIX_LOAD}}
        printf '%s' "$VAULT_LOGIN_SECRET_ID" \
          | vault write \
            -address="{{.VAULT_ADDR_TARGET}}" \
            -field=token \
            "auth/${VAULT_LOGIN_APPROLE_MOUNT}/login" \
            role_id="$VAULT_LOGIN_ROLE_ID" \
            secret_id=-

  kv:get:
    run: once
    desc: Read a KV v2 secret and print JSON to stdout (KV_MOUNT=<mount> SECRET_PATH=<path> [SECRET_VERSION=<n>])
    summary: |
      Read a KV v2 secret at SECRET_PATH under KV_MOUNT using the Vault CLI
      and print the result as JSON.

      This keeps the same interface:
        KV_MOUNT=<mount>
        SECRET_PATH=<path>
        SECRET_VERSION=<n optional>

      The VAULT_TOKEN environment variable must be set by the caller.
      Optionally pass SECRET_VERSION to pin to a specific KV version.
    set: [errexit, nounset, pipefail]
    vars:
      KV_MOUNT: ""
      SECRET_PATH: ""
      SECRET_VERSION: ""
    env:
      KV_GET_MOUNT: "{{if .KV_MOUNT_OVERRIDE}}{{.KV_MOUNT_OVERRIDE}}{{else}}{{.KV_MOUNT}}{{end}}"
      KV_GET_PATH: "{{if .SECRET_PATH_OVERRIDE}}{{.SECRET_PATH_OVERRIDE}}{{else}}{{.SECRET_PATH}}{{end}}"
      KV_GET_VERSION: "{{if .SECRET_VERSION_OVERRIDE}}{{.SECRET_VERSION_OVERRIDE}}{{else}}{{.SECRET_VERSION}}{{end}}"
      VAULT_ADDR: "{{.VAULT_ADDR_TARGET}}"
    preconditions:
      - sh: test -n "$KV_GET_MOUNT"
        msg: KV_MOUNT must be set. Pass KV_MOUNT=<mount> on the command line.
      - sh: test -n "$KV_GET_PATH"
        msg: SECRET_PATH must be set. Pass SECRET_PATH=<path> on the command line.
      - sh: test -n "${VAULT_TOKEN:-}"
        msg: VAULT_TOKEN environment variable must be set by the caller.
      - sh: test -n "${VAULT_ADDR:-}"
        msg: VAULT_ADDR must be set. Ensure VAULT_ADDR_TARGET is configured.
      - sh: command -v vault >/dev/null 2>&1
        msg: vault CLI is required to read the Vault KV endpoint.
    cmds:
      - |
        {{.NIX_LOAD}}
        MOUNT="${KV_GET_MOUNT#/}"
        MOUNT="${MOUNT%/}"

        SECRET_PATH="${KV_GET_PATH#/}"

        if [ -n "$KV_GET_VERSION" ]; then
          vault kv get -format=json -mount="$MOUNT" -version="$KV_GET_VERSION" "$SECRET_PATH"
        else
          vault kv get -format=json -mount="$MOUNT" "$SECRET_PATH"
        fi

  token:revoke-self:
    run: once
    desc: Revoke the current Vault token (VAULT_TOKEN must be set in environment)
    summary: |
      Run vault token revoke -self to revoke the token currently set in the
      VAULT_TOKEN environment variable. Auto-installs the CLI if missing.
    set: [errexit, nounset, pipefail]
    preconditions:
      - sh: test -n "${VAULT_TOKEN:-}"
        msg: VAULT_TOKEN environment variable must be set.
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.VAULT_NIX_INSTALLABLE}}"
      - cmd: bash -lc '{{.NIX_LOAD}}; vault token revoke -address="{{.VAULT_ADDR_TARGET}}" -self'
        platforms: [linux, darwin]
      - cmd: vault token revoke -address="{{.VAULT_ADDR_TARGET}}" -self
        platforms: [windows]

  root-token:
    run: once
    desc: Print the saved Vault root token (VAULT_KEYS_FILE=path)
    summary: |
      Read the root_token field from KEYS_FILE and print it to stdout. Useful for
      scripting or when you need to pass the root token to another tool.
      KEYS_FILE must exist and contain the JSON produced by the init task.
    deps:
      - task: jq:nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.JQ_NIX_INSTALLABLE}}"
    preconditions:
      - sh: test -f "{{if .VAULT_KEYS_FILE_OVERRIDE}}{{.VAULT_KEYS_FILE_OVERRIDE}}{{else}}{{.VAULT_KEYS_FILE}}{{end}}"
        msg: >-
          KEYS_FILE not found. Run task init first to generate
          {{if .VAULT_KEYS_FILE_OVERRIDE}}{{.VAULT_KEYS_FILE_OVERRIDE}}{{else}}{{.VAULT_KEYS_FILE}}{{end}}.
    cmds:
      - cmd: |
          {{.NIX_LOAD}}
          jq -r '.root_token' "{{if .VAULT_KEYS_FILE_OVERRIDE}}{{.VAULT_KEYS_FILE_OVERRIDE}}{{else}}{{.VAULT_KEYS_FILE}}{{end}}"
        platforms: [linux, darwin]
      - cmd: >-
          jq -r '.root_token'
          "{{if .VAULT_KEYS_FILE_OVERRIDE}}{{.VAULT_KEYS_FILE_OVERRIDE}}
          {{- else}}{{.VAULT_KEYS_FILE}}{{end}}"
        platforms: [windows]

  peers:
    run: once
    desc: List Vault Raft cluster peers
    summary: |
      Run vault operator raft list-peers to display all nodes in the Raft cluster
      with their addresses, followers, voter status, and applied index.
      Requires an authenticated session and an active Vault server.
      Auto-installs the CLI if missing.
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.VAULT_NIX_INSTALLABLE}}"
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; vault operator raft list-peers -address="{{.VAULT_ADDR_TARGET}}"'
        platforms: [linux, darwin]
      - cmd: vault operator raft list-peers -address="{{.VAULT_ADDR_TARGET}}"
        platforms: [windows]

  snapshot:
    run: once
    desc: Save a Vault Raft snapshot (VAULT_FILE=path; root VAULT_FILE=path)
    summary: |
      Run vault operator raft snapshot save to write a point-in-time backup of
      the Vault Raft storage to VAULT_FILE. VAULT_FILE defaults to SNAPSHOT_FILE
      (vault-snapshot.snap). Requires an authenticated session.
      Auto-installs the CLI if missing.
    vars:
      FILE_TARGET: >-
        {{if .VAULT_FILE_OVERRIDE}}{{.VAULT_FILE_OVERRIDE -}}
        {{- else if .VAULT_FILE_OVERRIDE}}{{.VAULT_FILE_OVERRIDE -}}
        {{- else if .VAULT_FILE}}{{.VAULT_FILE -}}
        {{- else if .VAULT_SNAPSHOT_FILE_OVERRIDE}}{{.VAULT_SNAPSHOT_FILE_OVERRIDE -}}
        {{- else}}{{.VAULT_SNAPSHOT_FILE}}{{end}}
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.VAULT_NIX_INSTALLABLE}}"
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; vault operator raft snapshot save -address="{{.VAULT_ADDR_TARGET}}" "{{.FILE_TARGET}}"'
        platforms: [linux, darwin]
      - cmd: vault operator raft snapshot save -address="{{.VAULT_ADDR_TARGET}}" "{{.FILE_TARGET}}"
        platforms: [windows]

  restore:
    run: once
    desc: Restore a Vault Raft snapshot (VAULT_FILE=path; root VAULT_FILE=path)
    summary: |
      Run vault operator raft snapshot restore -force to restore Vault state from
      a previously saved snapshot at VAULT_FILE. VAULT_FILE defaults to SNAPSHOT_FILE
      (vault-snapshot.snap). This is a destructive operation that overwrites the
      current Vault state. Requires an authenticated session.
      Auto-installs the CLI if missing.
    vars:
      FILE_TARGET: >-
        {{if .VAULT_FILE_OVERRIDE}}{{.VAULT_FILE_OVERRIDE -}}
        {{- else if .VAULT_FILE_OVERRIDE}}{{.VAULT_FILE_OVERRIDE -}}
        {{- else if .VAULT_FILE}}{{.VAULT_FILE -}}
        {{- else if .VAULT_SNAPSHOT_FILE_OVERRIDE}}{{.VAULT_SNAPSHOT_FILE_OVERRIDE -}}
        {{- else}}{{.VAULT_SNAPSHOT_FILE}}{{end}}
    prompt:
      - This will overwrite the current Vault state with the snapshot.
      - Continue?
    set: [errexit, nounset, pipefail]
    preconditions:
      - sh: test -f "{{.FILE_TARGET}}"
        msg: >-
          Snapshot file not found. Pass VAULT_FILE=path/to/snapshot, or VAULT_FILE=path/to/snapshot from the root
          include.
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.VAULT_NIX_INSTALLABLE}}"
      - cmd: bash -lc '{{.NIX_LOAD}}; vault operator raft snapshot restore -address="{{.VAULT_ADDR_TARGET}}" -force "{{.FILE_TARGET}}"'
        platforms: [linux, darwin]
      - cmd: vault operator raft snapshot restore -address="{{.VAULT_ADDR_TARGET}}" -force "{{.FILE_TARGET}}"
        platforms: [windows]

