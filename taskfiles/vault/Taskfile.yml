---
version: '3.5'

output:
  group:
    begin: ::group::{{.TASK}}
    end: '::endgroup::'
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml
  winget:
    taskfile: ../winget/Taskfile.yml
  dasel: ../dasel/Taskfile.yml

vars:
  VAULT_ADDR: '{{.VAULT_ADDR | default "http://127.0.0.1:8200"}}'
  VAULT_ADDR_TARGET: '{{.VAULT_ADDR_TARGET | default "{{.VAULT_ADDR}}"}}'
  VAULT_EXTRA_ARGS: '{{.VAULT_EXTRA_ARGS | default ""}}'
  VAULT_ROOT_TOKEN: '{{.VAULT_ROOT_TOKEN | default ""}}'
  VAULT_ROLE_ID: '{{.VAULT_ROLE_ID | default ""}}'
  VAULT_SECRET_ID: '{{.VAULT_SECRET_ID | default ""}}'
  VAULT_APPROLE_MOUNT: '{{.VAULT_APPROLE_MOUNT | default "approle"}}'
  VAULT_SSH_ROLE: '{{.VAULT_SSH_ROLE | default ""}}'
  VAULT_SSH_PRIVATE_KEY_PATH: '{{.VAULT_SSH_PRIVATE_KEY_PATH | default ""}}'
  VAULT_SSH_PUBLIC_KEY_PATH: '{{.VAULT_SSH_PUBLIC_KEY_PATH | default ""}}'
  VAULT_SSH_MOUNT: '{{.VAULT_SSH_MOUNT | default "ssh"}}'
  VAULT_NIX_INSTALLABLE: '{{.VAULT_NIX_INSTALLABLE | default "nixpkgs#vault-bin"}}'
  VAULT_WINGET_INSTALLABLE: '{{.VAULT_WINGET_INSTALLABLE | default "Hashicorp.Vault"}}'

env:
  VAULT_ADDR: '{{.VAULT_ADDR_TARGET}}'
  NIXPKGS_ALLOW_UNFREE: '1'
  VAULT_SSH_ROLE: '{{.VAULT_SSH_ROLE}}'
  VAULT_SSH_PRIVATE_KEY_PATH: '{{.VAULT_SSH_PRIVATE_KEY_PATH}}'
  VAULT_SSH_PUBLIC_KEY_PATH: '{{.VAULT_SSH_PUBLIC_KEY_PATH}}'
  VAULT_SSH_MOUNT: '{{.VAULT_SSH_MOUNT}}'

tasks:
  ssh:keys:
    desc: Generate an SSH key pair and sign the public key with Vault
    summary: |
      Set VAULT_SSH_ROLE, VAULT_SSH_PRIVATE_KEY_PATH and VAULT_SSH_PUBLIC_KEY_PATH.
      VAULT_SSH_MOUNT defaults to ssh. Uses the current Vault authentication.
      Reuses existing keys and renews the certificate on every invocation.
      Saves the certificate beside the public key as <name>-cert.pub.
      Requires ssh-keygen on PATH; generates an unencrypted Ed25519 key.
    set:
      - errexit
      - nounset
      - pipefail
    preconditions:
      - sh: test -n "$VAULT_SSH_ROLE"
        msg: VAULT_SSH_ROLE must be set.
      - sh: test -n "$VAULT_SSH_PRIVATE_KEY_PATH"
        msg: VAULT_SSH_PRIVATE_KEY_PATH must be set.
      - sh: test -n "$VAULT_SSH_PUBLIC_KEY_PATH"
        msg: VAULT_SSH_PUBLIC_KEY_PATH must be set.
      - sh: test "$VAULT_SSH_PRIVATE_KEY_PATH" != "$VAULT_SSH_PUBLIC_KEY_PATH"
        msg: Private and public key paths must differ.
      - sh: test "$VAULT_SSH_PRIVATE_KEY_PATH" != "${VAULT_SSH_PUBLIC_KEY_PATH%.pub}-cert.pub"
        msg: Private key path must differ from the derived certificate path.
      - sh: test -n "$VAULT_SSH_MOUNT"
        msg: VAULT_SSH_MOUNT must be set.
      - sh: command -v ssh-keygen >/dev/null 2>&1
        msg: ssh-keygen is required on PATH.
    cmds:
      - task: _ssh:keys:prepare
      - |
        {{.NIX_LOAD}}
        CERT_PATH="${VAULT_SSH_PUBLIC_KEY_PATH%.pub}-cert.pub"
        CERT_TEMP=$(mktemp "${CERT_PATH}.XXXXXX")
        trap 'rm -f "$CERT_TEMP"' EXIT
        vault write -address="$VAULT_ADDR" -field=signed_key \
          "${VAULT_SSH_MOUNT%/}/sign/$VAULT_SSH_ROLE" \
          "public_key=@$VAULT_SSH_PUBLIC_KEY_PATH" > "$CERT_TEMP"
        test -s "$CERT_TEMP"
        chmod 644 "$CERT_TEMP"
        mv "$CERT_TEMP" "$CERT_PATH"
  _ssh:keys:prepare:
    internal: true
    deps:
      - task: install
      - task: _ssh:keys:generate
  _ssh:keys:generate:
    internal: true
    set:
      - errexit
      - nounset
      - pipefail
    status:
      - test -s "$VAULT_SSH_PRIVATE_KEY_PATH" && test -s "$VAULT_SSH_PUBLIC_KEY_PATH"
    preconditions:
      - sh: test -f "$VAULT_SSH_PRIVATE_KEY_PATH" || test ! -e "$VAULT_SSH_PUBLIC_KEY_PATH"
        msg: Public key exists without a private key; refusing to overwrite it.
      - sh: test ! -e "$VAULT_SSH_PRIVATE_KEY_PATH" || test -s "$VAULT_SSH_PRIVATE_KEY_PATH"
        msg: Existing private key is empty; refusing to overwrite it.
      - sh: test ! -e "$VAULT_SSH_PUBLIC_KEY_PATH" || test -s "$VAULT_SSH_PUBLIC_KEY_PATH"
        msg: Existing public key is empty; refusing to overwrite it.
    cmds:
      - |
        mkdir -p "$(dirname "$VAULT_SSH_PRIVATE_KEY_PATH")" \
          "$(dirname "$VAULT_SSH_PUBLIC_KEY_PATH")"
        if [ ! -e "$VAULT_SSH_PRIVATE_KEY_PATH" ]; then
          KEY_DIR=$(mktemp -d)
          trap 'rm -rf "$KEY_DIR"' EXIT
          ssh-keygen -q -t ed25519 -N '' -f "$KEY_DIR/key"
          mv "$KEY_DIR/key" "$VAULT_SSH_PRIVATE_KEY_PATH"
          mv "$KEY_DIR/key.pub" "$VAULT_SSH_PUBLIC_KEY_PATH"
        else
          ssh-keygen -y -P '' -f "$VAULT_SSH_PRIVATE_KEY_PATH" > "$VAULT_SSH_PUBLIC_KEY_PATH"
        fi
        chmod 600 "$VAULT_SSH_PRIVATE_KEY_PATH"
        chmod 644 "$VAULT_SSH_PUBLIC_KEY_PATH"
  default:
    run: once
    desc: Show available Vault automation tasks
    summary: Display the list of available HashiCorp Vault-related tasks defined in this Taskfile.
    cmds:
      - task --list
  install:
    run: once
    desc: Install Vault CLI via Nix (Unix) or WinGet (Windows)
    summary: |
      Install Vault CLI on Linux and macOS via the user Nix profile, and on
      Windows via WinGet, when it is not already on PATH. Override
      VAULT_NIX_INSTALLABLE or VAULT_WINGET_INSTALLABLE to pin a
      different package or version.
    status:
      - command -v vault >/dev/null 2>&1
    cmds:
      - task: _install:unix
      - task: _install:windows
  _install:unix:
    internal: true
    platforms:
      - linux
      - darwin
    env:
      NIXPKGS_ALLOW_UNFREE: '1'
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: '{{.VAULT_NIX_INSTALLABLE}}'
          NIX_EXTRA_ARGS: --impure
  _install:windows:
    internal: true
    platforms:
      - windows
    cmds:
      - task: winget:install:package
        vars:
          WINGET_INSTALLABLE: '{{.VAULT_WINGET_INSTALLABLE}}'
  version:
    run: once
    desc: Show the active Vault CLI version
    summary: |
      Print the version reported by the vault binary resolved from PATH.
      Auto-installs the Vault CLI if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows
  healthy:
    run: once
    desc: Show Vault health as JSON (VAULT_ADDR=url)
    summary: |
      Fetch the raw health JSON from the Vault HTTP API at VAULT_ADDR/v1/sys/health
      and pretty-print it with Dasel. Returns HTTP 200 when active, 429 when standby,
      472 when in recovery mode, and 501 when uninitialized.
      This task only uses curl and Dasel — it does not require the Vault CLI.
    set:
      - errexit
      - nounset
      - pipefail
    deps:
      - task: dasel:install
    preconditions:
      - sh: command -v curl >/dev/null 2>&1
        msg: curl is required to query the Vault health endpoint.
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          curl -s
          "{{.VAULT_ADDR_TARGET}}/v1/sys/health"
          | dasel -i json -o json'
        platforms:
          - linux
          - darwin
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; {{.GO_LOAD}};
          curl.exe -s '{{.VAULT_ADDR_TARGET}}/v1/sys/health'
          | dasel -i json -o json; exit \$LASTEXITCODE"
        platforms:
          - windows
  login:root-token:
    run: once
    desc: Log in to Vault using a token directly (VAULT_ROOT_TOKEN=<token>)
    summary: |
      Authenticate with Vault using a root or service token passed directly
      via the ROOT_TOKEN variable. The token is read from the variable and
      piped to vault login via stdin so it does not appear in the process
      argument list. After login, subsequent vault commands use this token
      automatically via the token helper.
      Auto-installs the CLI if missing.
    set:
      - errexit
      - nounset
      - pipefail
    env:
      VAULT_LOGIN_ROOT_TOKEN: >-
        {{.VAULT_ROOT_TOKEN}}
    preconditions:
      - sh: test -n "$VAULT_LOGIN_ROOT_TOKEN"
        msg: ROOT_TOKEN must be set. Pass VAULT_ROOT_TOKEN=<token> on the command line.
    cmds:
      - task: install
      - |
        {{.NIX_LOAD}}
        printf '%s' "$VAULT_LOGIN_ROOT_TOKEN" \
          | vault login -address="{{.VAULT_ADDR_TARGET}}" -method=token -no-print -
  login:approle:
    run: once
    desc: Log in to Vault via AppRole (VAULT_ROLE_ID=<id> VAULT_SECRET_ID=<id>)
    summary: |
      Authenticate with Vault using the AppRole auth method. Requires a role_id
      and secret_id passed via the ROLE_ID and SECRET_ID task variables.
      The AppRole mount path defaults to "approle" and can be overridden with
      APPROLE_MOUNT. After login, subsequent vault commands use the resulting
      client token automatically via the token helper.
      Auto-installs the CLI if missing.
    set:
      - errexit
      - nounset
      - pipefail
    env:
      VAULT_LOGIN_ROLE_ID: '{{.VAULT_ROLE_ID}}'
      VAULT_LOGIN_SECRET_ID: >-
        {{.VAULT_SECRET_ID}}
      VAULT_LOGIN_APPROLE_MOUNT: >-
        {{.VAULT_APPROLE_MOUNT}}
    preconditions:
      - sh: test -n "$VAULT_LOGIN_ROLE_ID"
        msg: ROLE_ID must be set. Pass VAULT_ROLE_ID=<role-id> on the command line.
      - sh: test -n "$VAULT_LOGIN_SECRET_ID"
        msg: SECRET_ID must be set. Pass VAULT_SECRET_ID=<secret-id> on the command line.
    cmds:
      - task: install
      - |
        {{.NIX_LOAD}}
        printf '%s' "$VAULT_LOGIN_SECRET_ID" \
          | vault write \
            -address="{{.VAULT_ADDR_TARGET}}" \
            -field=token \
            "auth/${VAULT_LOGIN_APPROLE_MOUNT}/login" \
            role_id="$VAULT_LOGIN_ROLE_ID" \
            secret_id=- \
          | vault login \
            -address="{{.VAULT_ADDR_TARGET}}" \
            -method=token \
            -no-print \
            -
  kv:get:
    run: once
    desc: Read a KV v2 secret and print JSON to stdout (KV_MOUNT=<mount> SECRET_PATH=<path> [SECRET_VERSION=<n>])
    summary: |
      Read a KV v2 secret at SECRET_PATH under KV_MOUNT using the Vault CLI
      and print the result as JSON.
      This keeps the same interface:
        KV_MOUNT=<mount>
        SECRET_PATH=<path>
        SECRET_VERSION=<n optional>
      The VAULT_TOKEN environment variable must be set by the caller.
      Optionally pass SECRET_VERSION to pin to a specific KV version.
    set:
      - errexit
      - nounset
      - pipefail
    vars:
      KV_MOUNT: ''
      SECRET_PATH: ''
      SECRET_VERSION: ''
    env:
      KV_GET_MOUNT: '{{.KV_MOUNT}}'
      KV_GET_PATH: '{{.SECRET_PATH}}'
      KV_GET_VERSION: '{{.SECRET_VERSION}}'
      VAULT_ADDR: '{{.VAULT_ADDR_TARGET}}'
    preconditions:
      - sh: test -n "$KV_GET_MOUNT"
        msg: KV_MOUNT must be set. Pass KV_MOUNT=<mount> on the command line.
      - sh: test -n "$KV_GET_PATH"
        msg: SECRET_PATH must be set. Pass SECRET_PATH=<path> on the command line.
      - sh: test -n "${VAULT_TOKEN:-}"
        msg: VAULT_TOKEN environment variable must be set by the caller.
      - sh: test -n "${VAULT_ADDR:-}"
        msg: VAULT_ADDR must be set. Ensure VAULT_ADDR_TARGET is configured.
      - sh: command -v vault >/dev/null 2>&1
        msg: vault CLI is required to read the Vault KV endpoint.
    cmds:
      - |
        {{.NIX_LOAD}}
        MOUNT="${KV_GET_MOUNT#/}"
        MOUNT="${MOUNT%/}"
        SECRET_PATH="${KV_GET_PATH#/}"
        if [ -n "$KV_GET_VERSION" ]; then
          vault kv get -format=json -mount="$MOUNT" -version="$KV_GET_VERSION" "$SECRET_PATH"
        else
          vault kv get -format=json -mount="$MOUNT" "$SECRET_PATH"
        fi
  token:revoke:
    run: once
    desc: Revoke the current Vault token (VAULT_TOKEN must be set in environment)
    summary: |
      Run vault token revoke -self to revoke the token currently set in the
      VAULT_TOKEN environment variable. Auto-installs the CLI if missing.
    set:
      - errexit
      - nounset
      - pipefail
    preconditions:
      - sh: test -n "${VAULT_TOKEN:-}"
        msg: VAULT_TOKEN environment variable must be set.
    cmds:
      - task: install
      - cmd: bash -lc '{{.NIX_LOAD}}; vault token revoke -address="{{.VAULT_ADDR_TARGET}}" -self'
        platforms:
          - linux
          - darwin
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; vault token revoke -address='{{.VAULT_ADDR_TARGET}}' -self; exit \$LASTEXITCODE"
        platforms:
          - windows
  _version:unix:
    run: once
    internal: true
    desc: Show Vault CLI version on macOS or Linux
    summary: Print the Vault CLI version on macOS or Linux.
    platforms:
      - linux
      - darwin
    set:
      - errexit
      - nounset
      - pipefail
    cmds:
      - bash -lc '{{.NIX_LOAD}}; vault version'
  _version:windows:
    run: once
    internal: true
    desc: Show Vault CLI version on Windows
    summary: Print the Vault CLI version on Windows.
    platforms:
      - windows
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; if (Get-Command vault -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: The Vault CLI is not installed or not available in PATH.
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "{{.WINGET_LOAD}}; vault version; exit \$LASTEXITCODE"
