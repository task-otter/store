---
version: "3.5"

output:

  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:

  nix:
    taskfile: ../nix/Taskfile.yml
  winget:
    taskfile: ../winget/Taskfile.yml

vars:

  BUN_NIX_INSTALLABLE: '{{.BUN_NIX_INSTALLABLE | default "nixpkgs#bun"}}'
  BUN_WINGET_INSTALLABLE: '{{.BUN_WINGET_INSTALLABLE | default "Oven-sh.Bun"}}'

tasks:
  default:
    run: once
    desc: Show available Bun automation tasks
    summary: Display the list of available Bun-related tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install bun via Nix (Unix) or WinGet (Windows)
    summary: |
      Install bun on Linux and macOS via the user Nix profile, and on
      Windows via WinGet, when it is not already on PATH. Override
      BUN_NIX_INSTALLABLE or BUN_WINGET_INSTALLABLE to pin a
      different package or version.
    cmds:
      - task: _install:unix
      - task: _install:windows

  _install:unix:
    internal: true
    platforms: [linux, darwin]
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.BUN_NIX_INSTALLABLE}}"

  _install:windows:
    internal: true
    platforms: [windows]
    cmds:
      - task: winget:install:package
        vars:
          WINGET_INSTALLABLE: "{{.BUN_WINGET_INSTALLABLE}}"

  version:
    run: once
    desc: Show the active Bun version
    summary: |
      Print the version reported by the bun binary resolved from PATH.
      Auto-installs Bun if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  _version:unix:
    run: once
    internal: true
    desc: Show Bun version on macOS or Linux
    summary: Print the bun version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; bun --version'

  _version:windows:
    run: once
    internal: true
    desc: Show Bun version on Windows
    summary: Print the bun version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}};
          if (Get-Command bun -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: Bun is not installed or not available in PATH.
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "{{.WINGET_LOAD}}; bun --version; exit \$LASTEXITCODE"
