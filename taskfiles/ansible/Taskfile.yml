---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml

vars:
  ANSIBLE_NIX_INSTALLABLE: nixpkgs#ansible
  ANSIBLE_CONFIG: "ansible/ansible.cfg"
  ANSIBLE_PLAYBOOK: ""
  ANSIBLE_INVENTORY: ""
  ANSIBLE_PATTERN: "all"
  ANSIBLE_FILE: ""
  ANSIBLE_REQUIREMENTS: "requirements.yml"
  ANSIBLE_EXTRA_ARGS: ""

tasks:
  default:
    run: once
    desc: Show available Ansible automation tasks
    summary: Display the list of available Ansible-related tasks defined in this Taskfile.
    cmds:
      - task --list

  syntax:check:
    run: once
    desc: Check Ansible playbook syntax (ANSIBLE_PLAYBOOK=path)
    summary: |
      Run ansible-playbook --syntax-check to validate the playbook structure
      without executing any tasks. Pass INVENTORY to specify the inventory file.
      Auto-installs if missing.
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.ANSIBLE_NIX_INSTALLABLE}}"
    requires:
      vars:
        - ANSIBLE_PLAYBOOK
    preconditions:
      - sh: test -n "{{.ANSIBLE_PLAYBOOK}}"
        msg: PLAYBOOK is required. Pass ANSIBLE_PLAYBOOK=path/to/playbook.yml when running this task.
    cmds:
      - task: _syntax:check:unix

  run:
    run: once
    desc: Run an Ansible playbook (ANSIBLE_PLAYBOOK=path)
    summary: |
      Execute PLAYBOOK via ansible-playbook. Pass INVENTORY to specify the
      inventory file and ANSIBLE_EXTRA_ARGS for additional flags such as --check,
      --diff, or --tags. Auto-installs if missing.
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.ANSIBLE_NIX_INSTALLABLE}}"
    requires:
      vars:
        - ANSIBLE_PLAYBOOK
    preconditions:
      - sh: test -n "{{.ANSIBLE_PLAYBOOK}}"
        msg: PLAYBOOK is required. Pass ANSIBLE_PLAYBOOK=path/to/playbook.yml when running this task.
    cmds:
      - task: _run:unix

  ping:
    run: once
    desc: Test Ansible host connectivity (ANSIBLE_INVENTORY=path)
    summary: |
      Run the Ansible ping module against PATTERN (default all) using the
      specified INVENTORY. Confirms that Ansible can reach and authenticate
      to the target hosts. Auto-installs if missing.
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.ANSIBLE_NIX_INSTALLABLE}}"
    requires:
      vars:
        - ANSIBLE_INVENTORY
    preconditions:
      - sh: test -n "{{.ANSIBLE_INVENTORY}}"
        msg: INVENTORY is required. Pass ANSIBLE_INVENTORY=path/to/inventory when running this task.
    cmds:
      - task: _ping:unix

  list:hosts:
    run: once
    desc: List Ansible inventory hosts (ANSIBLE_INVENTORY=path)
    summary: |
      Print the hosts matching PATTERN (default all) from INVENTORY without
      executing any tasks. Useful for verifying inventory content.
      Auto-installs if missing.
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.ANSIBLE_NIX_INSTALLABLE}}"
    requires:
      vars:
        - ANSIBLE_INVENTORY
    preconditions:
      - sh: test -n "{{.ANSIBLE_INVENTORY}}"
        msg: INVENTORY is required. Pass ANSIBLE_INVENTORY=path/to/inventory when running this task.
    cmds:
      - task: _list:hosts:unix

  galaxy:install:
    run: once
    desc: Install Ansible roles and collections (ANSIBLE_REQUIREMENTS=path)
    summary: |
      Run ansible-galaxy install -r ANSIBLE_REQUIREMENTS (default requirements.yml)
      to install all declared roles and collections. Pass ANSIBLE_EXTRA_ARGS for
      additional flags. Auto-installs if missing.
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.ANSIBLE_NIX_INSTALLABLE}}"
    cmds:
      - task: _galaxy:install:unix

  vault:encrypt:
    run: once
    desc: Encrypt a file with Ansible Vault (ANSIBLE_FILE=path)
    summary: |
      Run ansible-vault encrypt on ANSIBLE_FILE. You will be prompted for the vault
      password. Pass ANSIBLE_EXTRA_ARGS for additional flags such as --vault-id.
      Auto-installs if missing.
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.ANSIBLE_NIX_INSTALLABLE}}"
    requires:
      vars:
        - ANSIBLE_FILE
    preconditions:
      - sh: test -n "{{.ANSIBLE_FILE}}"
        msg: ANSIBLE_FILE is required. Pass ANSIBLE_FILE=path/to/file when running this task.
    cmds:
      - task: _vault:unix
        vars:
          ARGS: 'encrypt "{{.ANSIBLE_FILE}}" {{.ANSIBLE_EXTRA_ARGS}}'

  vault:decrypt:
    run: once
    desc: Decrypt a file with Ansible Vault (ANSIBLE_FILE=path)
    summary: |
      Run ansible-vault decrypt on ANSIBLE_FILE. You will be prompted for the vault
      password. Pass ANSIBLE_EXTRA_ARGS for additional flags such as --vault-id.
      Auto-installs if missing.
    prompt:
      - This will decrypt and overwrite ANSIBLE_FILE with plaintext.
      - Continue?
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.ANSIBLE_NIX_INSTALLABLE}}"
    requires:
      vars:
        - ANSIBLE_FILE
    preconditions:
      - sh: test -n "{{.ANSIBLE_FILE}}"
        msg: ANSIBLE_FILE is required. Pass ANSIBLE_FILE=path/to/file when running this task.
    cmds:
      - task: _vault:unix
        vars:
          ARGS: 'decrypt "{{.ANSIBLE_FILE}}" {{.ANSIBLE_EXTRA_ARGS}}'

  _syntax:check:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    cmds:
      - |
        bash -lc '{{.NIX_LOAD}}; export ANSIBLE_CONFIG="{{.ANSIBLE_CONFIG}}";
        playbook="{{.ANSIBLE_PLAYBOOK}}"
        ansible-playbook --syntax-check "$playbook" \
          {{if .ANSIBLE_INVENTORY}}-i "{{.ANSIBLE_INVENTORY}}"{{end}} \
          {{.ANSIBLE_EXTRA_ARGS}} {{.CLI_ARGS}}'

  _run:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    cmds:
      - >-
        bash -lc '{{.NIX_LOAD}}; export ANSIBLE_CONFIG="{{.ANSIBLE_CONFIG}}";
        ansible-playbook
        "{{.ANSIBLE_PLAYBOOK}}"
        {{if .ANSIBLE_INVENTORY}}-i "{{.ANSIBLE_INVENTORY}}" {{end}}
        {{.ANSIBLE_EXTRA_ARGS}}'

  _ping:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    cmds:
      - >-
        bash -lc '{{.NIX_LOAD}}; export ANSIBLE_CONFIG="{{.ANSIBLE_CONFIG}}";
        ansible "{{.ANSIBLE_PATTERN}}" -m ping
        {{if .ANSIBLE_INVENTORY}}-i "{{.ANSIBLE_INVENTORY}}" {{end}}
        {{.ANSIBLE_EXTRA_ARGS}}'

  _list:hosts:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    cmds:
      - >-
        bash -lc '{{.NIX_LOAD}}; export ANSIBLE_CONFIG="{{.ANSIBLE_CONFIG}}";
        ansible "{{.ANSIBLE_PATTERN}}" --list-hosts
        {{if .ANSIBLE_INVENTORY}}-i "{{.ANSIBLE_INVENTORY}}" {{end}}
        {{.ANSIBLE_EXTRA_ARGS}}'

  _galaxy:install:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    cmds:
      - >-
        bash -lc '{{.NIX_LOAD}}; export ANSIBLE_CONFIG="{{.ANSIBLE_CONFIG}}";
        ansible-galaxy install -r "{{.ANSIBLE_REQUIREMENTS}}"
        {{.ANSIBLE_EXTRA_ARGS}}'

  _vault:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    requires:
      vars: [ARGS]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; export ANSIBLE_CONFIG="{{.ANSIBLE_CONFIG}}"; ansible-vault {{.ARGS}}'
