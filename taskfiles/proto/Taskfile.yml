---
version: "3.5"
output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false
silent: true
includes:
  nix:
    taskfile: ../nix/Taskfile.yml
vars:
  PROTO_NIX_INSTALLABLE: '{{.PROTO_NIX_INSTALLABLE | default "nixpkgs#protobuf nixpkgs#protoc-gen-go nixpkgs#protoc-gen-go-grpc"}}'
  PROTO_PATH: '{{.PROTO_PATH | default "."}}'
  PROTO_PATTERN: '{{.PROTO_PATTERN | default "*.proto"}}'
  GO_MODULE: '{{.GO_MODULE | default ""}}'
tasks:
  default:
    run: once
    desc: Show available protoc automation tasks
    summary: Display the list of available protobuf-related tasks defined in this Taskfile.
    cmds:
      - task --list
  install:
    run: once
    desc: Install protoc and the Go plugins via the Nix profile
    summary: |
      Install protoc, protoc-gen-go, and protoc-gen-go-grpc into the user Nix
      profile when they are not already available on PATH. Override the
      PROTO_NIX_INSTALLABLE variable to pin different packages or versions.
    status:
      - command -v protoc >/dev/null 2>&1
      - command -v protoc-gen-go >/dev/null 2>&1
      - command -v protoc-gen-go-grpc >/dev/null 2>&1
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.PROTO_NIX_INSTALLABLE}}"
  version:
    run: once
    desc: Show the active protoc version
    summary: |
      Print the version reported by the protoc binary resolved from PATH.
      Auto-installs protoc and the Go plugins if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows
  gen:
    run: once
    desc: Generate Go files from proto definitions
    summary: |
      Run protoc to generate Go and gRPC source files from all .proto files
      matching PROTO_PATTERN under PROTO_PATH. Auto-installs protoc and the
      Go plugins if they are not already present in PATH.

      Set GO_MODULE to the Go module path so protoc strips it from the
      go_package option and writes next to the sources instead of into a
      nested <module path>/ tree. GO_MODULE, PROTO_PATH, and PROTO_PATTERN are
      declared as top-level vars here, which outrank vars supplied by an
      inclusion: set them on the command line or from the environment.
    deps:
      - task: install
    cmds:
      - task: _gen:unix
        vars:
          PROTO_PATH: "{{.PROTO_PATH}}"
          PROTO_PATTERN: "{{.PROTO_PATTERN}}"
          GO_MODULE: "{{.GO_MODULE}}"
      - task: _gen:windows
        vars:
          PROTO_PATH: "{{.PROTO_PATH}}"
          PROTO_PATTERN: "{{.PROTO_PATTERN}}"
          GO_MODULE: "{{.GO_MODULE}}"
  ungen:
    run: once
    desc: Remove generated protobuf (.pb.go) files from the working tree
    summary: |
      Delete all *.pb.go files generated by protoc. Useful before a clean
      regeneration to ensure stale files are not left behind.
    cmds:
      - task: _ungen:unix
      - task: _ungen:windows
  _gen:unix:
    run: once
    internal: true
    platforms: [darwin, linux]
    set: [errexit, nounset, pipefail]
    env:
      GO_MODULE: "{{.RESOLVED_GO_MODULE}}"
    vars:
      RESOLVED_PROTO_PATH: '{{.PROTO_PATH}}'
      RESOLVED_PROTO_PATTERN: '{{.PROTO_PATTERN}}'
      RESOLVED_GO_MODULE: '{{.GO_MODULE}}'
    cmds:
      - |
        bash -lc '{{.NIX_LOAD}};
        module_opts=""
        if [ -n "${GO_MODULE:-}" ]; then
          module_opts="--go_opt=module=${GO_MODULE} --go-grpc_opt=module=${GO_MODULE}"
        fi
        if [ -z "$(find "{{.RESOLVED_PROTO_PATH}}" -type f \
          -name "{{.RESOLVED_PROTO_PATTERN}}" \
          ! -path "*/.git/*" -print -quit)" ]; then
          echo "No .proto files found under {{.RESOLVED_PROTO_PATH}} matching -name {{.RESOLVED_PROTO_PATTERN}}"
          exit 1
        fi
        find "{{.RESOLVED_PROTO_PATH}}" -type f -name "{{.RESOLVED_PROTO_PATTERN}}" ! -path "*/.git/*" \
          -exec protoc --proto_path="{{.RESOLVED_PROTO_PATH}}" \
          --go_out=. ${module_opts} \
          --go-grpc_out=. ${module_opts} \
          {} +'
  _gen:windows:
    run: once
    internal: true
    platforms: [windows]
    env:
      GO_MODULE: "{{.RESOLVED_GO_MODULE}}"
    vars:
      RESOLVED_PROTO_PATH: '{{.PROTO_PATH}}'
      RESOLVED_PROTO_PATTERN: '{{.PROTO_PATTERN}}'
      RESOLVED_GO_MODULE: '{{.GO_MODULE}}'
    cmds:
      # Windows PowerShell 5.1's `-Command -` executes redirected stdin one
      # line at a time, which can silently skip the multi-line pipeline below.
      # Write a script file so the whole block is parsed and executed together.
      - cmd: |
          script="${TEMP:-.}/taskotter-proto-gen-$RANDOM.ps1"
          trap 'rm -f "$script"' EXIT
          cat > "$script" <<'POWERSHELL'
          $ErrorActionPreference = 'Stop'
          $env:PSModulePath = Join-Path $PSHOME 'Modules'
          $moduleOpts = @()
          if ($env:GO_MODULE) {
            $moduleOpts = @(
              "--go_opt=module=$($env:GO_MODULE)",
              "--go-grpc_opt=module=$($env:GO_MODULE)"
            )
          }
          $separator = [IO.Path]::DirectorySeparatorChar.ToString()
          $gitDirectory = $separator + '.git' + $separator
          $protoRoot = (Resolve-Path -LiteralPath '{{.RESOLVED_PROTO_PATH}}').Path
          $protos = Get-ChildItem -LiteralPath $protoRoot -Recurse -Filter '{{.RESOLVED_PROTO_PATTERN}}' -File |
            Where-Object { $_.FullName.IndexOf($gitDirectory, [StringComparison]::OrdinalIgnoreCase) -lt 0 }
          if (-not $protos) { throw 'No .proto files found' }
          & protoc "--proto_path=$protoRoot" --go_out=. @moduleOpts --go-grpc_out=. @moduleOpts @(
            $protos | ForEach-Object { $_.FullName }
          )
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          POWERSHELL
          powershell -NoProfile -ExecutionPolicy Bypass -File "$script"
  _ungen:unix:
    run: once
    internal: true
    platforms: [darwin, linux]
    set: [errexit, nounset, pipefail]
    cmds:
      - find . -type f -name "*.pb.go" -delete
      - echo 'Generated protobuf files removed.'
  _ungen:windows:
    run: once
    internal: true
    platforms: [windows]
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "Get-ChildItem -Recurse -Filter *.pb.go | Remove-Item -Force"
      - echo Generated protobuf files removed.
  _version:unix:
    run: once
    internal: true
    desc: Show protoc version on macOS or Linux
    summary: Print the protoc version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; protoc --version'
  _version:windows:
    run: once
    internal: true
    desc: Show protoc version on Windows
    summary: Print the protoc version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Get-Command protoc -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: protoc is not installed or not available in PATH.
    cmds:
      - protoc --version
