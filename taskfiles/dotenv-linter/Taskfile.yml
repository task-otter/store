---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml

vars:
  DOTENV_LINTER_NIX_INSTALLABLE: '{{.DOTENV_LINTER_NIX_INSTALLABLE | default "nixpkgs#dotenv-linter"}}'
  DOTENV_LINTER_TARGETS: '{{.DOTENV_LINTER_TARGETS | default ".env"}}'
  DOTENV_LINTER_EXTRA_ARGS: '{{.DOTENV_LINTER_EXTRA_ARGS | default ""}}'

tasks:
  default:
    run: once
    desc: Show available dotenv-linter automation tasks
    summary: Display the list of available dotenv-linter-related tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install dotenv-linter via the Nix profile
    summary: |
      Install dotenv-linter into the user Nix profile when it is not already
      available on PATH. Override the DOTENV_LINTER_NIX_INSTALLABLE
      variable to pin a different package or version.
    status:
      - command -v dotenv-linter >/dev/null 2>&1
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.DOTENV_LINTER_NIX_INSTALLABLE}}"

  version:
    run: once
    desc: Show the active dotenv-linter version
    summary: |
      Print the version reported by the dotenv-linter binary resolved from PATH.
      Auto-installs dotenv-linter if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  ci:
    run: once
    desc: Lint dotenv files with dotenv-linter check (DOTENV_LINTER_TARGETS=path)
    summary: |
      Run dotenv-linter check against DOTENV_LINTER_TARGETS (default .env). Pass DOTENV_LINTER_EXTRA_ARGS
      for additional flags such as --skip or --recursive, or pass arguments
      after -- to forward them directly. Auto-installs dotenv-linter if
      missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    cmds:
      - task: _lint:unix
      - task: _lint:windows

  ci:fix:
    run: once
    desc: Fix dotenv lint issues with dotenv-linter (DOTENV_LINTER_TARGETS=path)
    summary: |
      Run dotenv-linter fix against DOTENV_LINTER_TARGETS (default .env) to apply automatic
      fixes. A backup of each changed file is created by the tool. Pass
      DOTENV_LINTER_EXTRA_ARGS for additional flags. Auto-installs dotenv-linter if missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    cmds:
      - task: _fix:unix
      - task: _fix:windows

  diff:
    run: once
    desc: Compare dotenv files with dotenv-linter diff (DOTENV_LINTER_TARGETS=files)
    summary: |
      Run dotenv-linter diff against DOTENV_LINTER_TARGETS (two or more .env files) to
      ensure their key sets match. Pass DOTENV_LINTER_EXTRA_ARGS for additional flags.
      Auto-installs dotenv-linter if missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    cmds:
      - task: _diff:unix
      - task: _diff:windows

  _lint:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: _lint:run:unix
        vars:
          DOTENV_LINTER_SUBCOMMAND: "check"

  _lint:windows:
    run: once
    internal: true
    platforms: [windows]
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: _lint:run:windows
        vars:
          DOTENV_LINTER_SUBCOMMAND: "check"

  _fix:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: _lint:run:unix
        vars:
          DOTENV_LINTER_SUBCOMMAND: "fix"

  _fix:windows:
    run: once
    internal: true
    platforms: [windows]
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: _lint:run:windows
        vars:
          DOTENV_LINTER_SUBCOMMAND: "fix"

  _lint:run:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        bash -lc '{{.NIX_LOAD}};
        targets="{{.DOTENV_LINTER_TARGETS}}"
        dotenv-linter {{.DOTENV_LINTER_SUBCOMMAND}} $targets \
          {{.DOTENV_LINTER_EXTRA_ARGS}} {{.CLI_ARGS}}'

  _lint:run:windows:
    run: once
    internal: true
    platforms: [windows]
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "$targets='{{.DOTENV_LINTER_TARGETS}}';
        dotenv-linter {{.DOTENV_LINTER_SUBCOMMAND}} $targets.Split(' ')
          {{.DOTENV_LINTER_EXTRA_ARGS}} {{.CLI_ARGS}};
        exit $LASTEXITCODE"

  _diff:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        bash -lc '{{.NIX_LOAD}};
        targets="{{.DOTENV_LINTER_TARGETS}}"
        options="{{.DOTENV_LINTER_EXTRA_ARGS}}"
        if [ -n "{{.CLI_ARGS}}" ]; then
          targets=""
          options=""
          for argument in {{.CLI_ARGS}}; do
            case "$argument" in
              -*) options="$options $argument" ;;
              *) targets="$targets $argument" ;;
            esac
          done
        fi
        dotenv-linter diff $options $targets'

  _diff:windows:
    run: once
    internal: true
    platforms: [windows]
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "$targets='{{.DOTENV_LINTER_TARGETS}}'.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries);
        $options='{{.DOTENV_LINTER_EXTRA_ARGS}}'.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries);
        if ('{{.CLI_ARGS}}') {
          $arguments='{{.CLI_ARGS}}'.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries);
          $targets=@($arguments | Where-Object { -not $_.StartsWith('-') });
          $options=@($arguments | Where-Object { $_.StartsWith('-') });
        };
        dotenv-linter diff @options @targets;
        exit $LASTEXITCODE"

  _version:unix:
    run: once
    internal: true
    desc: Show dotenv-linter version on macOS or Linux
    summary: Print the dotenv-linter version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; dotenv-linter --version'

  _version:windows:
    run: once
    internal: true
    desc: Show dotenv-linter version on Windows
    summary: Print the dotenv-linter version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Get-Command dotenv-linter -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: dotenv-linter is not installed or not available in PATH.
    cmds:
      - dotenv-linter --version
