---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml

vars:
  DOTENV_LINTER_NIX_INSTALLABLE: nixpkgs#dotenv-linter
  DOTENV_LINTER_TARGETS: ".env"
  DOTENV_LINTER_EXTRA_ARGS: ""

tasks:
  default:
    run: once
    desc: Show available dotenv-linter automation tasks
    summary: Display the list of available dotenv-linter-related tasks defined in this Taskfile.
    cmds:
      - task --list

  ci:
    run: once
    desc: Lint dotenv files with dotenv-linter check (DOTENV_LINTER_TARGETS=path)
    summary: |
      Run dotenv-linter check against DOTENV_LINTER_TARGETS (default .env). Pass DOTENV_LINTER_EXTRA_ARGS
      for additional flags such as --skip or --recursive, or pass arguments
      after -- to forward them directly. Auto-installs dotenv-linter if
      missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.DOTENV_LINTER_NIX_INSTALLABLE}}"
    cmds:
      - task: _lint:unix
      - task: _lint:windows

  ci:fix:
    run: once
    desc: Fix dotenv lint issues with dotenv-linter (DOTENV_LINTER_TARGETS=path)
    summary: |
      Run dotenv-linter fix against DOTENV_LINTER_TARGETS (default .env) to apply automatic
      fixes. A backup of each changed file is created by the tool. Pass
      DOTENV_LINTER_EXTRA_ARGS for additional flags. Auto-installs dotenv-linter if missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.DOTENV_LINTER_NIX_INSTALLABLE}}"
    cmds:
      - task: _fix:unix
      - task: _fix:windows

  diff:
    run: once
    desc: Compare dotenv files with dotenv-linter diff (DOTENV_LINTER_TARGETS=files)
    summary: |
      Run dotenv-linter diff against DOTENV_LINTER_TARGETS (two or more .env files) to
      ensure their key sets match. Pass DOTENV_LINTER_EXTRA_ARGS for additional flags.
      Auto-installs dotenv-linter if missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.DOTENV_LINTER_NIX_INSTALLABLE}}"
    cmds:
      - task: _diff:unix
      - task: _diff:windows

  _lint:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: _lint:run:unix
        vars:
          DOTENV_LINTER_SUBCOMMAND: "check"

  _lint:windows:
    run: once
    internal: true
    platforms: [windows]
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: _lint:run:windows
        vars:
          DOTENV_LINTER_SUBCOMMAND: "check"

  _fix:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: _lint:run:unix
        vars:
          DOTENV_LINTER_SUBCOMMAND: "fix"

  _fix:windows:
    run: once
    internal: true
    platforms: [windows]
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: _lint:run:windows
        vars:
          DOTENV_LINTER_SUBCOMMAND: "fix"

  _lint:run:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        bash -lc '{{.NIX_LOAD}};
        targets="{{if .DOTENV_LINTER_TARGETS_OVERRIDE}}{{.DOTENV_LINTER_TARGETS_OVERRIDE}}
        {{- else}}{{.DOTENV_LINTER_TARGETS}}{{end}}"
        dotenv-linter {{.DOTENV_LINTER_SUBCOMMAND}} $targets \
          {{if .DOTENV_LINTER_EXTRA_ARGS_OVERRIDE}}{{.DOTENV_LINTER_EXTRA_ARGS_OVERRIDE}}
          {{- else}}{{.DOTENV_LINTER_EXTRA_ARGS}}{{end}} {{.CLI_ARGS}}'

  _lint:run:windows:
    run: once
    internal: true
    platforms: [windows]
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "$targets='{{if .DOTENV_LINTER_TARGETS_OVERRIDE}}{{.DOTENV_LINTER_TARGETS_OVERRIDE}}
        {{- else}}{{.DOTENV_LINTER_TARGETS}}{{end}}';
        dotenv-linter {{.DOTENV_LINTER_SUBCOMMAND}} $targets.Split(' ')
          {{if .DOTENV_LINTER_EXTRA_ARGS_OVERRIDE}}{{.DOTENV_LINTER_EXTRA_ARGS_OVERRIDE}}
          {{- else}}{{.DOTENV_LINTER_EXTRA_ARGS}}{{end}} {{.CLI_ARGS}};
        exit $LASTEXITCODE"

  _diff:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        bash -lc '{{.NIX_LOAD}};
        targets="{{if .DOTENV_LINTER_TARGETS_OVERRIDE}}{{.DOTENV_LINTER_TARGETS_OVERRIDE}}
        {{- else}}{{.DOTENV_LINTER_TARGETS}}{{end}}"
        options="{{if .DOTENV_LINTER_EXTRA_ARGS_OVERRIDE}}{{.DOTENV_LINTER_EXTRA_ARGS_OVERRIDE}}
        {{- else}}{{.DOTENV_LINTER_EXTRA_ARGS}}{{end}}"
        if [ -n "{{.CLI_ARGS}}" ]; then
          targets=""
          options=""
          for argument in {{.CLI_ARGS}}; do
            case "$argument" in
              -*) options="$options $argument" ;;
              *) targets="$targets $argument" ;;
            esac
          done
        fi
        dotenv-linter diff $options $targets'

  _diff:windows:
    run: once
    internal: true
    platforms: [windows]
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "$targets='{{if .DOTENV_LINTER_TARGETS_OVERRIDE}}{{.DOTENV_LINTER_TARGETS_OVERRIDE}}
        {{- else}}{{.DOTENV_LINTER_TARGETS}}{{end}}'.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries);
        $options='{{if .DOTENV_LINTER_EXTRA_ARGS_OVERRIDE}}{{.DOTENV_LINTER_EXTRA_ARGS_OVERRIDE}}
        {{- else}}{{.DOTENV_LINTER_EXTRA_ARGS}}{{end}}'.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries);
        if ('{{.CLI_ARGS}}') {
          $arguments='{{.CLI_ARGS}}'.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries);
          $targets=@($arguments | Where-Object { -not $_.StartsWith('-') });
          $options=@($arguments | Where-Object { $_.StartsWith('-') });
        };
        dotenv-linter diff @options @targets;
        exit $LASTEXITCODE"
