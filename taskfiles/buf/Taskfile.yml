---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml

vars:
  BUF_AGAINST: '{{.BUF_AGAINST | default ".git#branch=main"}}'
  BUF_NIX_INSTALLABLE: '{{.BUF_NIX_INSTALLABLE | default "nixpkgs#buf"}}'
  BUF_CONFIG: '{{.BUF_CONFIG | default ""}}'
  BUF_EXTRA_ARGS: '{{.BUF_EXTRA_ARGS | default ""}}'
  BUF_INPUT: '{{.BUF_INPUT | default "."}}'

tasks:
  default:
    run: once
    desc: Show available Buf automation tasks
    summary: Display the list of available Buf-related tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install Buf via the Nix profile
    summary: |
      Install Buf into the user Nix profile when it is not already
      available on PATH. Override the BUF_NIX_INSTALLABLE
      variable to pin a different package or version.
    status:
      - command -v buf >/dev/null 2>&1
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.BUF_NIX_INSTALLABLE}}"

  version:
    run: once
    desc: Show the active Buf version
    summary: |
      Print the version reported by the buf binary resolved from PATH.
      Auto-installs Buf if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  lint:
    run: once
    desc: Lint proto files with Buf (BUF_INPUT=path)
    summary: |
      Run buf lint against INPUT (default: .). Pass BUF_CONFIG to use a custom
      buf.yaml via --config, and BUF_EXTRA_ARGS for additional flags such as
      --error-format. Pass CLI arguments after -- to override targets and
      options. Auto-installs Buf if missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    cmds:
      - task: _buf:unix
        vars:
          BUF_SUBCOMMAND: "lint"
          BUF_CONFIG_FLAG: >-
            {{if .BUF_CONFIG}}--config "{{.BUF_CONFIG}}"{{end}}
      - task: _buf:windows
        vars:
          BUF_SUBCOMMAND: "lint"
          BUF_CONFIG_FLAG: >-
            {{if .BUF_CONFIG}}--config "{{.BUF_CONFIG}}"{{end}}
      - echo "✅ buf lint passed"

  ci:
    run: once
    desc: Run buf fmt:check then lint
    cmds:
      - task: fmt:check
      - task: lint

  ci:fix:
    run: once
    desc: Format proto files in place with Buf (BUF_INPUT=path)
    summary: |
      Run buf format --write to reformat all .proto files under INPUT in
      place. Auto-installs Buf if missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    cmds:
      - task: _buf:unix
        vars:
          BUF_SUBCOMMAND: "format --write"
          BUF_CONFIG_FLAG: ""
      - task: _buf:windows
        vars:
          BUF_SUBCOMMAND: "format --write"
          BUF_CONFIG_FLAG: ""

  fmt:check:
    run: once
    desc: Check proto file formatting with Buf (BUF_INPUT=path)
    summary: |
      Run buf format --diff to report formatting issues without modifying files.
      Pass INPUT to check a specific directory or module. Use ci:fix to
      apply fixes. Auto-installs Buf if missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    cmds:
      - task: _buf:unix
        vars:
          BUF_SUBCOMMAND: "format --diff"
          BUF_CONFIG_FLAG: ""
      - task: _buf:windows
        vars:
          BUF_SUBCOMMAND: "format --diff"
          BUF_CONFIG_FLAG: ""
      - echo "✅ buf format check passed"

  _buf:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    cmds:
      - |
        {{.NIX_LOAD}}
        input='{{.BUF_INPUT}}'
        buf {{.BUF_SUBCOMMAND}} {{.BUF_CONFIG_FLAG}} \
          {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}"$input" \
          {{.BUF_EXTRA_ARGS}}{{end}}

  _buf:windows:
    run: once
    internal: true
    platforms: [windows]
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "$inputPath='{{.BUF_INPUT}}';
        buf {{.BUF_SUBCOMMAND}} {{.BUF_CONFIG_FLAG}}
          {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}$inputPath
          {{.BUF_EXTRA_ARGS}}{{end}};
        exit $LASTEXITCODE"

  breaking:
    run: once
    desc: Check proto files for breaking changes against AGAINST
    summary: |
      Run buf breaking to detect backwards-incompatible changes in INPUT
      compared to the AGAINST baseline (default: .git#branch=main). Pass a
      .git ref, a Buf module name, or a local directory as AGAINST. Pass CLI
      arguments after -- to override all variables directly. Auto-installs
      Buf if missing.
    deps:
      - task: install
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: _buf:unix
        vars:
          BUF_SUBCOMMAND: "breaking"
          BUF_CONFIG_FLAG: >-
            {{if not .CLI_ARGS}}--against
            "{{.BUF_AGAINST}}"{{end}}
      - task: _buf:windows
        vars:
          BUF_SUBCOMMAND: "breaking"
          BUF_CONFIG_FLAG: >-
            {{if not .CLI_ARGS}}--against
            "{{.BUF_AGAINST}}"{{end}}
      - echo "✅ buf breaking check passed"

  generate:
    run: once
    desc: Generate code from proto files with Buf (BUF_INPUT=path)
    summary: |
      Run buf generate to produce outputs defined in buf.gen.yaml. Requires a
      buf.gen.yaml in the project root or at the path given by CLI_ARGS.
      Auto-installs Buf if missing.
    deps:
      - task: install
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          buf generate
          {{if .CLI_ARGS}}{{.CLI_ARGS}}
          {{else}}
          "{{.BUF_INPUT}}"
          {{.BUF_EXTRA_ARGS}}{{end}}
          && echo "✅ buf generate passed" || { echo "❌ buf generate failed"; exit 1; }'
        platforms: [linux, darwin]
      - cmd: >-
          buf generate
          {{if .CLI_ARGS}}{{.CLI_ARGS}}
          {{else}}
          "{{.BUF_INPUT}}"
          {{.BUF_EXTRA_ARGS}}{{end}}
          && echo "✅ buf generate passed" || { echo "❌ buf generate failed"; exit 1; }
        platforms: [windows]

  _version:unix:
    run: once
    internal: true
    desc: Show Buf version on macOS or Linux
    summary: Print the Buf version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; buf --version'

  _version:windows:
    run: once
    internal: true
    desc: Show Buf version on Windows
    summary: Print the Buf version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Get-Command buf -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: Buf is not installed or not available in PATH.
    cmds:
      - buf --version
