---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml
  uv:
    taskfile: ../uv/Taskfile.yml

vars:
  JSONLINT_NIX_INSTALLABLE: '{{.JSONLINT_NIX_INSTALLABLE | default "nixpkgs#python3Packages.demjson3"}}'
  JSONLINT_UV_TOOL: '{{.JSONLINT_UV_TOOL | default "demjson3"}}'
  JSONLINT_TARGETS: '{{.JSONLINT_TARGETS | default "."}}'
  JSONLINT_EXTRA_ARGS: '{{.JSONLINT_EXTRA_ARGS | default ""}}'

tasks:
  default:
    run: once
    desc: Show available jsonlint automation tasks
    summary: Display the list of available jsonlint-related tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install jsonlint via Nix (Unix) or uv tool (Windows)
    summary: |
      Install jsonlint (demjson3) into the user Nix profile on Linux and
      macOS when it is not already on PATH. On Windows, installs via uv
      tool install (JSONLINT_UV_TOOL, default demjson3). Override
      JSONLINT_NIX_INSTALLABLE or JSONLINT_UV_TOOL to pin a different
      package or version.
    status:
      - command -v jsonlint >/dev/null 2>&1
    cmds:
      - task: _install:unix
      - task: _install:windows

  _install:unix:
    internal: true
    platforms: [linux, darwin]
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.JSONLINT_NIX_INSTALLABLE}}"

  _install:windows:
    internal: true
    platforms: [windows]
    cmds:
      - task: uv:tool:install
        vars:
          UV_TOOL: "{{.JSONLINT_UV_TOOL}}"

  version:
    run: once
    desc: Show the active jsonlint version
    summary: |
      Print the version reported by the jsonlint binary resolved from PATH.
      Auto-installs jsonlint if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  ci:
    run: once
    desc: Validate JSON files with jsonlint (JSONLINT_TARGETS=path)
    summary: |
      Validate the JSON files at JSONLINT_TARGETS (default .). A directory target is
      scanned recursively for *.json files; a file target is validated
      directly. Pass JSONLINT_EXTRA_ARGS for additional flags.
      Auto-installs jsonlint if missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          _t="{{if .JSONLINT_TARGETS}}{{.JSONLINT_TARGETS}}{{else}}.{{end}}";
          _files="$(mktemp)"; trap '"'"'rm -f "$_files"'"'"' EXIT;
          if [ -d "$_t" ]; then
          find "$_t" -name "*.json" -type f -print0 >"$_files";
          else printf "%s\000" "$_t" >"$_files"; fi;
          if [ -s "$_files" ]; then
          xargs -0 jsonlint
          {{.JSONLINT_EXTRA_ARGS}}
          <"$_files";
          else echo "No matching JSON files found under $_t"; fi
          && echo "✅ jsonlint passed" || { echo "❌ jsonlint failed"; exit 1; }'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; {{.UV_LOAD}};
          \$ErrorActionPreference = 'Stop';
          \$t = '{{if .JSONLINT_TARGETS}}{{.JSONLINT_TARGETS}}{{else}}.{{end}}';
          if (Test-Path -LiteralPath \$t -PathType Container) {
          \$files = Get-ChildItem -LiteralPath \$t -Recurse -Filter *.json -File
          } else {
          \$files = @(Get-Item -LiteralPath \$t) };
          \$paths = @(\$files | ForEach-Object FullName);
          if (-not \$paths) { Write-Host 'No matching JSON files found'; exit 0 };
          foreach (\$path in \$paths) {
          jsonlint {{.JSONLINT_EXTRA_ARGS}} \$path;
          if (\$LASTEXITCODE -ne 0) { exit \$LASTEXITCODE } };
          exit \$LASTEXITCODE"
        platforms: [windows]

  _version:unix:
    run: once
    internal: true
    desc: Show jsonlint version on macOS or Linux
    summary: Print the jsonlint version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; jsonlint --version'

  _version:windows:
    run: once
    internal: true
    desc: Show jsonlint version on Windows
    summary: Print the jsonlint version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; {{.UV_LOAD}};
          if (Get-Command jsonlint -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: jsonlint is not installed or not available in PATH.
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "{{.WINGET_LOAD}}; {{.UV_LOAD}}; jsonlint --version; exit \$LASTEXITCODE"
