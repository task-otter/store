---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml

vars:
  JQ_NIX_INSTALLABLE: '{{.JQ_NIX_INSTALLABLE | default "nixpkgs#jq"}}'

tasks:
  default:
    run: once
    desc: Show available jq automation tasks
    summary: Display the list of available jq-related tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install jq via the Nix profile
    summary: |
      Install jq into the user Nix profile when it is not already
      available on PATH. Override the JQ_NIX_INSTALLABLE
      variable to pin a different package or version.
    status:
      - command -v jq >/dev/null 2>&1
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.JQ_NIX_INSTALLABLE}}"

  version:
    run: once
    desc: Show the active jq version
    summary: |
      Print the version reported by the jq binary resolved from PATH.
      Auto-installs jq if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  _version:unix:
    run: once
    internal: true
    desc: Show jq version on macOS or Linux
    summary: Print the jq version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; jq --version'

  _version:windows:
    run: once
    internal: true
    desc: Show jq version on Windows
    summary: Print the jq version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Get-Command jq -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: jq is not installed or not available in PATH.
    cmds:
      - jq --version
