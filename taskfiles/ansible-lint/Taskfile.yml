---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml

vars:
  ANSIBLE_LINT_NIX_INSTALLABLE: nixpkgs#ansible-lint
  ANSIBLE_LINT_CONFIG: "ansible/ansible.cfg"
  ANSIBLE_LINT_TARGETS: "."
  ANSIBLE_LINT_EXTRA_ARGS: ""

tasks:
  default:
    run: once
    desc: Show available ansible-lint automation tasks
    summary: Display the list of available ansible-lint-related tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install ansible-lint via the Nix profile
    summary: |
      Install ansible-lint into the user Nix profile when it is not already
      available on PATH. Override the ANSIBLE_LINT_NIX_INSTALLABLE
      variable to pin a different package or version.
    status:
      - command -v ansible-lint >/dev/null 2>&1
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.ANSIBLE_LINT_NIX_INSTALLABLE}}"

  version:
    run: once
    desc: Show the active ansible-lint version
    summary: |
      Print the version reported by the ansible-lint binary resolved from PATH.
      Auto-installs ansible-lint if missing. macOS and Linux only.
    deps:
      - task: install
    cmds:
      - task: _version:unix

  ci:
    run: once
    desc: Lint Ansible YAML files with ansible-lint (ANSIBLE_LINT_TARGETS=path)
    summary: |
      Run ansible-lint against ANSIBLE_LINT_TARGETS (default .) to enforce best
      practices and YAML checks. Pass ANSIBLE_LINT_EXTRA_ARGS for additional flags.
      Auto-installs if missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    cmds:
      - task: _lint:unix
      - echo "✅ ansible-lint passed"

  ci:fix:
    run: once
    desc: Auto-fix Ansible YAML files with ansible-lint --fix (ANSIBLE_LINT_TARGETS=path)
    summary: |
      Run ansible-lint --fix against ANSIBLE_LINT_TARGETS (default .) to automatically
      resolve fixable lint violations. Pass ANSIBLE_LINT_EXTRA_ARGS for additional flags.
      Auto-installs if missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    cmds:
      - task: _lint:fix:unix
      - echo "✅ ansible-lint fixes applied"

  _lint:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    cmds:
      - task: _lint:run:unix
        vars:
          ANSIBLE_LINT_FIX_FLAG: ""

  _lint:fix:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    cmds:
      - task: _lint:run:unix
        vars:
          ANSIBLE_LINT_FIX_FLAG: "--fix"

  _lint:run:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    cmds:
      - |
        bash -lc '{{.NIX_LOAD}}; export ANSIBLE_CONFIG="{{.ANSIBLE_LINT_CONFIG}}";
        targets="{{if .ANSIBLE_LINT_TARGETS}}{{.ANSIBLE_LINT_TARGETS}}{{else}}.{{end}}"
        ansible-lint {{.ANSIBLE_LINT_FIX_FLAG}} $targets \
          {{.ANSIBLE_LINT_EXTRA_ARGS}}'

  _version:unix:
    run: once
    internal: true
    desc: Show ansible-lint version on macOS or Linux
    summary: Print the ansible-lint version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; ansible-lint --version'
