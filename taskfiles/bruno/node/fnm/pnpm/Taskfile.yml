---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  pnpm:
    taskfile: ../../../../pnpm/fnm/Taskfile.yml

vars:
  COLLECTION: "."
  ENV: ""
  EXTRA_ARGS: ""
  VERSION: ""

tasks:
  default:
    run: once
    desc: Show available Bruno tasks
    cmds:
      - task --list

  install:
    run: once
    desc: Install @usebruno/cli as a local devDependency
    summary: |
      Install @usebruno/cli as a local devDependency. Pass VERSION=x.y.z to
      pin a specific release instead of the package manager's default
      resolution.
    vars:
      RESOLVED_VERSION: '{{default .VERSION .VERSION_OVERRIDE}}'
    status:
      - >-
        node -e "const installed = require('./node_modules/@usebruno/cli/package.json');
        const requested = '{{.RESOLVED_VERSION}}';
        process.exit(!requested || installed.version === requested ? 0 : 1)"
    cmds:
      - task: pnpm:add
        vars:
          PACKAGES: '@usebruno/cli{{if .RESOLVED_VERSION}}@{{.RESOLVED_VERSION}}{{end}}'
          EXTRA_ARGS: '{{default .EXTRA_ARGS .EXTRA_ARGS_OVERRIDE}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}'

  install:undo:
    run: once
    desc: Remove the locally installed Bruno CLI devDependency
    summary: Remove @usebruno/cli from local devDependencies via the active package manager.
    prompt:
      - This will remove @usebruno/cli from local devDependencies.
      - Continue?
    cmds:
      - task: pnpm:remove
        vars:
          PACKAGES: "@usebruno/cli"
          EXTRA_ARGS: '{{default .EXTRA_ARGS .EXTRA_ARGS_OVERRIDE}}'

  upgrade:
    run: once
    desc: Upgrade the Bruno CLI to the latest release
    summary: Reinstall @usebruno/cli at the latest version as a local devDependency.
    cmds:
      - task: pnpm:add
        vars:
          PACKAGES: "@usebruno/cli@latest"
          EXTRA_ARGS: '{{default .EXTRA_ARGS .EXTRA_ARGS_OVERRIDE}}'

  # Shared implementation of run / ci, which differ only by --bail.
  _run:
    internal: true
    run: when_changed
    vars:
      RESOLVED_COLLECTION: '{{default .COLLECTION .COLLECTION_OVERRIDE}}'
      RESOLVED_ENV: '{{default .ENV .ENV_OVERRIDE}}'
    cmds:
      - task: pnpm:exec
        vars:
          BINARY: bru
          ARGS: >-
            run {{.RESOLVED_COLLECTION}}
            {{- if .RESOLVED_ENV}} --env "{{.RESOLVED_ENV}}"{{end}}
            {{- if .MODE_ARGS}} {{.MODE_ARGS}}{{end}}
          EXTRA_ARGS: '{{default .EXTRA_ARGS .EXTRA_ARGS_OVERRIDE}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}'

  run:
    run: once
    desc: Run a Bruno collection (COLLECTION=path)
    summary: |
      Run all requests in the Bruno collection at COLLECTION (default: current
      directory). Pass ENV to activate a named Bruno environment, and EXTRA_ARGS
      for additional bru flags. Pass CLI arguments after -- to override all
      variables directly.
    cmds:
      - task: _run
        vars:
          MODE_ARGS: ""

  ci:
    run: once
    desc: Run Bruno collection in CI mode with --bail (COLLECTION=path)
    summary: |
      Run all requests in the Bruno collection and stop immediately on the first
      failure via --bail. Pass ENV to activate a named Bruno environment.
      Intended for CI pipelines where a single failure should abort the run.
    cmds:
      - task: _run
        vars:
          MODE_ARGS: "--bail"

  version:
    run: once
    desc: Show the locally resolved Bruno CLI version
    cmds:
      - task: pnpm:exec
        vars:
          BINARY: bru
          ARGS: "--version"

  help:
    run: once
    desc: Show Bruno CLI help
    cmds:
      - task: pnpm:exec
        vars:
          BINARY: bru
          ARGS: "--help"
          EXTRA_ARGS: '{{default .EXTRA_ARGS .EXTRA_ARGS_OVERRIDE}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}'
