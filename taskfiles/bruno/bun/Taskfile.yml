---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  bun:
    taskfile: ../../bun/Taskfile.yml

vars:
  BRUNO_COLLECTION: "."
  BRUNO_ENV: ""
  BRUNO_EXTRA_ARGS: ""
  BRUNO_VERSION: ""

tasks:
  default:
    run: once
    desc: Show available Bruno tasks
    cmds:
      - task --list

  install:
    run: once
    desc: Install @usebruno/cli as a local devDependency
    summary: |
      Install @usebruno/cli as a local devDependency. Pass BRUNO_VERSION=x.y.z to
      pin a specific release instead of the package manager's default
      resolution.
    vars:
      RESOLVED_VERSION: '{{default .BRUNO_VERSION .BRUNO_VERSION_OVERRIDE}}'
    status:
      - >-
        node -e "const installed = require('./node_modules/@usebruno/cli/package.json');
        const requested = '{{.RESOLVED_VERSION}}';
        process.exit(!requested || installed.version === requested ? 0 : 1)"
    cmds:
      - task: _bun:unix
        vars:
          ARGS: >-
            add -d --silent @usebruno/cli{{if .RESOLVED_VERSION}}@{{.RESOLVED_VERSION}}{{end}}
            {{default .BRUNO_EXTRA_ARGS .BRUNO_EXTRA_ARGS_OVERRIDE}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
      - task: _bun:windows
        vars:
          ARGS: >-
            add -d --silent @usebruno/cli{{if .RESOLVED_VERSION}}@{{.RESOLVED_VERSION}}{{end}}
            {{default .BRUNO_EXTRA_ARGS .BRUNO_EXTRA_ARGS_OVERRIDE}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}

  install:undo:
    run: once
    desc: Remove the locally installed Bruno CLI devDependency
    summary: Remove @usebruno/cli from local devDependencies via the active package manager.
    prompt:
      - This will remove @usebruno/cli from local devDependencies.
      - Continue?
    cmds:
      - task: _bun:unix
        vars:
          ARGS: remove --silent @usebruno/cli {{default .BRUNO_EXTRA_ARGS .BRUNO_EXTRA_ARGS_OVERRIDE}}
      - task: _bun:windows
        vars:
          ARGS: remove --silent @usebruno/cli {{default .BRUNO_EXTRA_ARGS .BRUNO_EXTRA_ARGS_OVERRIDE}}

  upgrade:
    run: once
    desc: Upgrade the Bruno CLI to the latest release
    summary: Reinstall @usebruno/cli at the latest version as a local devDependency.
    cmds:
      - task: _bun:unix
        vars:
          ARGS: add -d --silent @usebruno/cli@latest {{default .BRUNO_EXTRA_ARGS .BRUNO_EXTRA_ARGS_OVERRIDE}}
      - task: _bun:windows
        vars:
          ARGS: add -d --silent @usebruno/cli@latest {{default .BRUNO_EXTRA_ARGS .BRUNO_EXTRA_ARGS_OVERRIDE}}

  # Shared implementation of run / ci, which differ only by --bail.
  _run:
    internal: true
    run: when_changed
    vars:
      RESOLVED_COLLECTION: '{{default .BRUNO_COLLECTION .BRUNO_COLLECTION_OVERRIDE}}'
      RESOLVED_ENV: '{{default .BRUNO_ENV .BRUNO_ENV_OVERRIDE}}'
    cmds:
      - task: _bun:unix
        vars:
          ARGS: >-
            x bru run {{.RESOLVED_COLLECTION}}
            {{- if .RESOLVED_ENV}} --env "{{.RESOLVED_ENV}}"{{end}}
            {{- if .MODE_ARGS}} {{.MODE_ARGS}}{{end}}
            {{default .BRUNO_EXTRA_ARGS .BRUNO_EXTRA_ARGS_OVERRIDE}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
      - task: _bun:windows
        vars:
          ARGS: >-
            x bru run {{.RESOLVED_COLLECTION}}
            {{- if .RESOLVED_ENV}} --env "{{.RESOLVED_ENV}}"{{end}}
            {{- if .MODE_ARGS}} {{.MODE_ARGS}}{{end}}
            {{default .BRUNO_EXTRA_ARGS .BRUNO_EXTRA_ARGS_OVERRIDE}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}

  run:
    run: once
    desc: Run a Bruno collection (BRUNO_COLLECTION=path)
    summary: |
      Run all requests in the Bruno collection at COLLECTION (default: current
      directory). Pass ENV to activate a named Bruno environment, and BRUNO_EXTRA_ARGS
      for additional bru flags. Pass CLI arguments after -- to override all
      variables directly.
    cmds:
      - task: _run
        vars:
          MODE_ARGS: ""

  ci:
    run: once
    desc: Run Bruno collection in CI mode with --bail (BRUNO_COLLECTION=path)
    summary: |
      Run all requests in the Bruno collection and stop immediately on the first
      failure via --bail. Pass ENV to activate a named Bruno environment.
      Intended for CI pipelines where a single failure should abort the run.
    cmds:
      - task: _run
        vars:
          MODE_ARGS: "--bail"

  version:
    run: once
    desc: Show the locally resolved Bruno CLI version
    cmds:
      - task: _bun:unix
        vars:
          ARGS: x bru --version
      - task: _bun:windows
        vars:
          ARGS: x bru --version

  help:
    run: once
    desc: Show Bruno CLI help
    cmds:
      - task: _bun:unix
        vars:
          ARGS: >-
            x bru --help
            {{default .BRUNO_EXTRA_ARGS .BRUNO_EXTRA_ARGS_OVERRIDE}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
      - task: _bun:windows
        vars:
          ARGS: >-
            x bru --help
            {{default .BRUNO_EXTRA_ARGS .BRUNO_EXTRA_ARGS_OVERRIDE}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}


  _bun:unix:
    run: when_changed
    internal: true
    platforms: [linux, darwin]
    dir: "{{.USER_WORKING_DIR}}"
    set: [errexit, nounset, pipefail]
    requires:
      vars: [ARGS]
    deps:
      - task: bun:install
    env:
      CI: "1"
    cmds:
      - >-
        BUN_INSTALL="${BUN_INSTALL:-$HOME/.bun}"
        PATH="$BUN_INSTALL/bin:$PATH"
        bun {{.ARGS}}

  _bun:windows:
    run: when_changed
    internal: true
    platforms: [windows]
    dir: "{{.USER_WORKING_DIR}}"
    requires:
      vars: [ARGS]
    deps:
      - task: bun:install
    env:
      CI: "1"
    cmds:
      - >-
        powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command
        "$ErrorActionPreference = 'Stop';
        $env:CI = '1';
        $bun = if (Get-Command bun -ErrorAction SilentlyContinue) { 'bun' }
        else { \"$env:USERPROFILE\.bun\bin\bun.exe\" }; & $bun {{.ARGS}}"
