---
version: "3.5"

output:

  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:

  nix:
    taskfile: ../nix/Taskfile.yml
  winget:
    taskfile: ../winget/Taskfile.yml

vars:

  NODEJS_NIX_INSTALLABLE: '{{.NODEJS_NIX_INSTALLABLE | default "nixpkgs#nodejs"}}'
  NODEJS_WINGET_INSTALLABLE: '{{.NODEJS_WINGET_INSTALLABLE | default "OpenJS.NodeJS"}}'

tasks:
  default:
    run: once
    desc: Show available Node.js automation tasks
    summary: Display the list of available Node.js-related tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install Node.js via Nix (Unix) or WinGet (Windows)
    summary: |
      Install Node.js on Linux and macOS via the user Nix profile, and on
      Windows via WinGet, when it is not already on PATH. Override
      NODEJS_NIX_INSTALLABLE or NODEJS_WINGET_INSTALLABLE to pin a
      different package or version.
    status:
      - command -v node >/dev/null 2>&1
    cmds:
      - task: _install:unix
      - task: _install:windows

  _install:unix:
    internal: true
    platforms: [linux, darwin]
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.NODEJS_NIX_INSTALLABLE}}"

  _install:windows:
    internal: true
    platforms: [windows]
    cmds:
      - task: winget:install:package
        vars:
          WINGET_INSTALLABLE: "{{.NODEJS_WINGET_INSTALLABLE}}"

  version:
    run: once
    desc: Show the active Node.js version
    summary: |
      Print the version reported by the node binary resolved from PATH.
      Auto-installs Node.js if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  _version:unix:
    run: once
    internal: true
    desc: Show Node.js version on macOS or Linux
    summary: Print the node version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; node --version'

  _version:windows:
    run: once
    internal: true
    desc: Show Node.js version on Windows
    summary: Print the node version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command "if (Get-Command node -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: Node.js is not installed or not available in PATH.
    cmds:
      - node --version
