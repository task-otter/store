---
version: "3.5"

output:

  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:

  nix:
    taskfile: ../nix/Taskfile.yml

vars:

  BRUNO_GUI_NIX_INSTALLABLE: '{{.BRUNO_GUI_NIX_INSTALLABLE | default "nixpkgs#bruno"}}'

  BRUNO_GUI_COLLECTION: '{{.BRUNO_GUI_COLLECTION | default ""}}'

  BRUNO_GUI_EXTRA_ARGS: '{{.BRUNO_GUI_EXTRA_ARGS | default ""}}'

tasks:
  default:
    run: once
    desc: Show available Bruno GUI tasks
    summary: Display the list of available Bruno desktop app tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install the Bruno desktop app via the Nix profile
    summary: |
      Install the Bruno desktop app into the user Nix profile when it is not already
      available on PATH. Override the BRUNO_GUI_NIX_INSTALLABLE
      variable to pin a different package or version.
    status:
      - command -v bruno >/dev/null 2>&1
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.BRUNO_GUI_NIX_INSTALLABLE}}"

  version:
    run: once
    desc: Show the active the Bruno desktop app version
    summary: |
      Print the version reported by the bruno binary resolved from PATH.
      Auto-installs the Bruno desktop app if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  open:
    run: once
    desc: Launch the Bruno desktop app (BRUNO_GUI_COLLECTION=path)
    summary: |
      Launch the Bruno desktop application. Pass BRUNO_GUI_COLLECTION to open a
      specific collection directory, and BRUNO_GUI_EXTRA_ARGS for additional
      flags. On macOS and Linux the app runs in the background so the task
      returns immediately. Auto-installs bruno if missing.
    dir: "{{.USER_WORKING_DIR}}"
    vars:
      RESOLVED_COLLECTION: '{{.BRUNO_GUI_COLLECTION}}'
    deps:
      - task: install
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}}; bruno{{if .RESOLVED_COLLECTION}} {{.RESOLVED_COLLECTION}}{{end}}
          {{.BRUNO_GUI_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}} &'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "Start-Process bruno{{if .RESOLVED_COLLECTION}} -ArgumentList '{{.RESOLVED_COLLECTION}}
          {{.BRUNO_GUI_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}'
          {{- else if or .BRUNO_GUI_EXTRA_ARGS .CLI_ARGS}}
          -ArgumentList '{{.BRUNO_GUI_EXTRA_ARGS}}
          {{- if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}'{{end}}"
        platforms: [windows]

  help:
    run: once
    desc: Show Bruno desktop app help
    summary: Display the built-in bruno help output. Auto-installs bruno if missing.
    deps:
      - task: install
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}}; bruno --help
          {{.BRUNO_GUI_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "bruno --help
          {{.BRUNO_GUI_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}"
        platforms: [windows]

  _version:unix:
    run: once
    internal: true
    desc: Show the Bruno desktop app version on macOS or Linux
    summary: Print the bruno version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; bruno --version'

  _version:windows:
    run: once
    internal: true
    desc: Show the Bruno desktop app version on Windows
    summary: Print the bruno version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command "if (Get-Command bruno -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: the Bruno desktop app is not installed or not available in PATH.
    cmds:
      - bruno --version
