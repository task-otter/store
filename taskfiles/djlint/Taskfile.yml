---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml

vars:
  DJLINT_NIX_INSTALLABLE: '{{.DJLINT_NIX_INSTALLABLE | default "nixpkgs#djlint"}}'
  DJLINT_TARGETS: '{{.DJLINT_TARGETS | default "."}}'
  DJLINT_EXTRA_ARGS: '{{.DJLINT_EXTRA_ARGS | default ""}}'

tasks:
  default:
    run: once
    desc: Show available djLint automation tasks
    summary: Display the list of available djLint-related tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install djLint via the Nix profile
    summary: |
      Install djLint into the user Nix profile when it is not already
      available on PATH. Override the DJLINT_NIX_INSTALLABLE
      variable to pin a different package or version.
    status:
      - command -v djlint >/dev/null 2>&1
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.DJLINT_NIX_INSTALLABLE}}"

  version:
    run: once
    desc: Show the active djLint version
    summary: |
      Print the version reported by the djlint binary resolved from PATH.
      Auto-installs djLint if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  ci:
    run: once
    desc: Run djLint fmt:check then lint
    cmds:
      - task: fmt:check
      - task: lint

  ci:fix:
    run: once
    desc: Format HTML templates with djLint (DJLINT_TARGETS=path)
    summary: |
      Run djlint --reformat against DJLINT_TARGETS (default .) to rewrite templates
      in place. Pass DJLINT_EXTRA_ARGS for additional flags.
      Auto-installs djLint if missing.
    cmds:
      - task: _run
        vars:
          MODE: "--reformat"

  lint:
    run: once
    desc: Lint HTML templates with djLint (DJLINT_TARGETS=path)
    summary: |
      Run djlint --lint against DJLINT_TARGETS (default .) to report template lint
      violations. Pass DJLINT_EXTRA_ARGS for additional flags such as
      --profile django. Auto-installs djLint if missing.
    cmds:
      - task: _run
        vars:
          MODE: "--lint"
          TAIL: ' && echo "✅ djlint passed" || { echo "❌ djlint failed"; exit 1; }'

  fmt:check:
    run: once
    desc: Check HTML template formatting with djLint (DJLINT_TARGETS=path)
    summary: |
      Run djlint --check against DJLINT_TARGETS (default .) to report the formatting
      changes --reformat would make, without modifying files. Exits non-zero
      when files would change, making it suitable for CI.
      Auto-installs djLint if missing.
    cmds:
      - task: _run
        vars:
          MODE: "--check"
          TAIL: ' && echo "✅ djlint formatting check passed" || { echo "❌ djlint formatting check failed"; exit 1; }'

  # Shared implementation of lint / ci:fix / fmt:check.
  _run:
    internal: true
    run: when_changed
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    vars:
      PATHS: '{{or .DJLINT_TARGETS "."}}'
      EXTRA: '{{.DJLINT_EXTRA_ARGS}}'
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          djlint
          {{.PATHS}} {{.MODE}}{{if .EXTRA}} {{.EXTRA}}{{end}}{{.TAIL}}'
        platforms: [linux, darwin]
      - cmd: >-
          djlint
          {{.PATHS}} {{.MODE}}{{if .EXTRA}} {{.EXTRA}}{{end}}
        platforms: [windows]

  _version:unix:
    run: once
    internal: true
    desc: Show djLint version on macOS or Linux
    summary: Print the djLint version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; djlint --version'

  _version:windows:
    run: once
    internal: true
    desc: Show djLint version on Windows
    summary: Print the djLint version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Get-Command djlint -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: djLint is not installed or not available in PATH.
    cmds:
      - djlint --version
