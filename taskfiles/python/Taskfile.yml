---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml
  winget:
    taskfile: ../winget/Taskfile.yml

vars:
  PYTHON_NIX_INSTALLABLE: '{{.PYTHON_NIX_INSTALLABLE | default "nixpkgs#python3"}}'
  PYTHON_WINGET_INSTALLABLE: '{{.PYTHON_WINGET_INSTALLABLE | default "Python.Python.3.12"}}'
  PYTHON_VENV: '{{.PYTHON_VENV | default ".venv"}}'
  PYTHON_REQUIREMENTS: '{{.PYTHON_REQUIREMENTS | default "requirements.txt"}}'
  PYTHON_FILE: '{{.PYTHON_FILE | default ""}}'
  PYTHON_ARGS: '{{.PYTHON_ARGS | default ""}}'
  PYTHON_EXTRA_ARGS: '{{.PYTHON_EXTRA_ARGS | default ""}}'

tasks:
  default:
    run: once
    desc: Show available Python automation tasks
    summary: Display the list of available Python-related tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install Python via Nix (Unix) or WinGet (Windows)
    summary: |
      Install Python on Linux and macOS via the user Nix profile, and on
      Windows via WinGet, when it is not already on PATH. Override
      PYTHON_NIX_INSTALLABLE or PYTHON_WINGET_INSTALLABLE to pin a
      different package or version.
    cmds:
      - task: _install:unix
      - task: _install:windows

  _install:unix:
    internal: true
    platforms: [linux, darwin]
    status:
      - command -v python3 >/dev/null 2>&1
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.PYTHON_NIX_INSTALLABLE}}"

  _install:windows:
    internal: true
    platforms: [windows]
    status:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "{{.WINGET_LOAD}}; python --version; exit \$LASTEXITCODE"
    cmds:
      - task: winget:install:package
        vars:
          WINGET_INSTALLABLE: "{{.PYTHON_WINGET_INSTALLABLE}}"

  version:
    run: once
    desc: Show the active Python version
    summary: |
      Print the version reported by the python3 binary resolved from PATH.
      Auto-installs Python if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  verify:
    run: once
    desc: Verify the Python installation and pip availability
    summary: |
      Print the active Python and pip versions to confirm both are installed
      and reachable. Useful for diagnosing setup issues after install.
      Auto-installs Python if missing.
    deps:
      - task: install
    cmds:
      - task: _verify:unix
      - task: _verify:windows

  venv:
    run: once
    desc: Create a Python virtual environment (PYTHON_VENV=path)
    summary: |
      Create a virtual environment at the path given by PYTHON_VENV (default .venv)
      using the python3 -m venv module. Run pip:install afterward to install
      project dependencies into the new environment.
    deps:
      - task: install
    cmds:
      - task: _venv:unix
      - task: _venv:windows

  pip:install:
    run: once
    desc: Install packages from a requirements file (PYTHON_REQUIREMENTS=path)
    summary: |
      Run python3 -m pip install -r PYTHON_REQUIREMENTS (default requirements.txt).
      Pass PYTHON_EXTRA_ARGS to forward additional flags such as --upgrade or
      --no-cache-dir. Does not require an active virtual environment.
    deps:
      - task: install
    cmds:
      - task: _pip:install:unix
      - task: _pip:install:windows

  run:
    run: once
    desc: Run a Python script (PYTHON_FILE=path)
    summary: |
      Execute PYTHON_FILE with python3 (Unix) or python (Windows).
      Pass PYTHON_ARGS to forward positional arguments to the script and
      PYTHON_EXTRA_ARGS for interpreter flags such as -u or -m.
    deps:
      - task: install
    requires:
      vars:
        - PYTHON_FILE
    preconditions:
      - sh: test -n "{{.PYTHON_FILE}}"
        msg: PYTHON_FILE is required. Pass PYTHON_FILE=path/to/script.py when running this task.
    cmds:
      - task: _run:unix
      - task: _run:windows

  _version:unix:
    run: once
    internal: true
    desc: Show Python version on macOS or Linux
    summary: Print the Python version on macOS or Linux.
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; python3 --version'

  _version:windows:
    run: once
    internal: true
    desc: Show Python version on Windows
    summary: Print the Python version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; python --version; exit \$LASTEXITCODE"
        msg: Python is not installed or not available in PATH.
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "{{.WINGET_LOAD}}; python --version; exit \$LASTEXITCODE"

  _verify:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; python3 --version'
      - bash -lc '{{.NIX_LOAD}}; python3 -m pip --version'

  _verify:windows:
    run: once
    internal: true
    platforms: [windows]
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "{{.WINGET_LOAD}}; python --version; exit \$LASTEXITCODE"
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "{{.WINGET_LOAD}}; python -m pip --version; exit \$LASTEXITCODE"

  _venv:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    cmds:
      - echo 'Creating virtual environment at {{.PYTHON_VENV}}...'
      - bash -lc '{{.NIX_LOAD}}; python3 -m venv "{{.PYTHON_VENV}}"'
      - echo 'Virtual environment ready.'

  _venv:windows:
    run: once
    internal: true
    platforms: [windows]
    cmds:
      - echo Creating virtual environment at {{.PYTHON_VENV}}...
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "{{.WINGET_LOAD}}; python -m venv '{{.PYTHON_VENV}}'; exit \$LASTEXITCODE"
      - echo Virtual environment ready.

  _pip:install:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; python3 -m pip install -r "{{.PYTHON_REQUIREMENTS}}" {{.PYTHON_EXTRA_ARGS}}'

  _pip:install:windows:
    run: once
    internal: true
    platforms: [windows]
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "{{.WINGET_LOAD}}; python -m pip install -r '{{.PYTHON_REQUIREMENTS}}' {{.PYTHON_EXTRA_ARGS}};
        exit \$LASTEXITCODE"

  _run:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    cmds:
      - >-
        bash -lc '{{.NIX_LOAD}};
        python3 "{{.PYTHON_FILE}}"
        {{.PYTHON_ARGS}}
        {{.PYTHON_EXTRA_ARGS}}'

  _run:windows:
    run: once
    internal: true
    platforms: [windows]
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "{{.WINGET_LOAD}}; python '{{.PYTHON_FILE}}' {{.PYTHON_ARGS}} {{.PYTHON_EXTRA_ARGS}}; exit \$LASTEXITCODE"
