---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml

vars:
  PYTHON_NIX_INSTALLABLE: nixpkgs#python3
  PYTHON_VENV: ".venv"
  PYTHON_REQUIREMENTS: "requirements.txt"
  PYTHON_FILE: ""
  PYTHON_ARGS: ""
  PYTHON_EXTRA_ARGS: ""

tasks:
  default:
    run: once
    desc: Show available Python automation tasks
    summary: Display the list of available Python-related tasks defined in this Taskfile.
    cmds:
      - task --list

  verify:
    run: once
    desc: Verify the Python installation and pip availability
    summary: |
      Print the active Python and pip versions to confirm both are installed
      and reachable. Useful for diagnosing setup issues after install.
      Auto-installs Python if missing.
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.PYTHON_NIX_INSTALLABLE}}"
    cmds:
      - task: _verify:unix
      - task: _verify:windows

  venv:
    run: once
    desc: Create a Python virtual environment (PYTHON_VENV=path)
    summary: |
      Create a virtual environment at the path given by PYTHON_VENV (default .venv)
      using the python3 -m venv module. Run pip:install afterward to install
      project dependencies into the new environment.
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.PYTHON_NIX_INSTALLABLE}}"
    cmds:
      - task: _venv:unix
      - task: _venv:windows

  pip:install:
    run: once
    desc: Install packages from a requirements file (PYTHON_REQUIREMENTS=path)
    summary: |
      Run python3 -m pip install -r PYTHON_REQUIREMENTS (default requirements.txt).
      Pass PYTHON_EXTRA_ARGS to forward additional flags such as --upgrade or
      --no-cache-dir. Does not require an active virtual environment.
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.PYTHON_NIX_INSTALLABLE}}"
    cmds:
      - task: _pip:install:unix
      - task: _pip:install:windows

  run:
    run: once
    desc: Run a Python script (PYTHON_FILE=path)
    summary: |
      Execute PYTHON_FILE with python3 (Unix) or python (Windows).
      Pass PYTHON_ARGS to forward positional arguments to the script and
      PYTHON_EXTRA_ARGS for interpreter flags such as -u or -m.
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.PYTHON_NIX_INSTALLABLE}}"
    requires:
      vars:
        - PYTHON_FILE
    preconditions:
      - sh: test -n "{{.PYTHON_FILE}}"
        msg: PYTHON_FILE is required. Pass PYTHON_FILE=path/to/script.py when running this task.
    cmds:
      - task: _run:unix
      - task: _run:windows

  _verify:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; python3 --version'
      - bash -lc '{{.NIX_LOAD}}; python3 -m pip --version'

  _verify:windows:
    run: once
    internal: true
    platforms: [windows]
    cmds:
      - python --version
      - python -m pip --version

  _venv:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    cmds:
      - echo 'Creating virtual environment at {{.PYTHON_VENV}}...'
      - bash -lc '{{.NIX_LOAD}}; python3 -m venv "{{.PYTHON_VENV}}"'
      - echo 'Virtual environment ready.'

  _venv:windows:
    run: once
    internal: true
    platforms: [windows]
    cmds:
      - echo Creating virtual environment at {{.PYTHON_VENV}}...
      - python -m venv "{{.PYTHON_VENV}}"
      - echo Virtual environment ready.

  _pip:install:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; python3 -m pip install -r "{{.PYTHON_REQUIREMENTS}}" {{.PYTHON_EXTRA_ARGS}}'

  _pip:install:windows:
    run: once
    internal: true
    platforms: [windows]
    cmds:
      - python -m pip install -r "{{.PYTHON_REQUIREMENTS}}" {{.PYTHON_EXTRA_ARGS}}

  _run:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    cmds:
      - >-
        bash -lc '{{.NIX_LOAD}};
        python3 "{{.PYTHON_FILE}}"
        {{.PYTHON_ARGS}}
        {{.PYTHON_EXTRA_ARGS}}'

  _run:windows:
    run: once
    internal: true
    platforms: [windows]
    cmds:
      - >-
        python "{{.PYTHON_FILE}}"
        {{.PYTHON_ARGS}}
        {{.PYTHON_EXTRA_ARGS}}
