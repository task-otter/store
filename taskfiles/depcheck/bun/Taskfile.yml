---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  bun:
    taskfile: ../../bun/Taskfile.yml

vars:
  DEPCHECK_LINT_SKIP_PATTERN: ""
  DEPCHECK_PROJECT_PATH: ""
  DEPCHECK_DEFAULT_PROJECT_PATH: "."
  TARGETS: ""
  DEPCHECK_IGNORE_PACKAGES: ""
  EXTRA_ARGS: ""
  VERSION: ""

tasks:
  default:
    run: once
    desc: Show available Depcheck tasks
    cmds:
      - task --list

  install:
    run: once
    desc: Install Depcheck as a local devDependency
    summary: |
      Install depcheck as a local devDependency. Pass VERSION=x.y.z to pin a
      specific release instead of the package manager's default resolution.
    vars:
      RESOLVED_VERSION: '{{default .VERSION .VERSION_OVERRIDE}}'
    status:
      - >-
        node -e "const installed = require('./node_modules/depcheck/package.json');
        const requested = '{{.RESOLVED_VERSION}}';
        process.exit(!requested || installed.version === requested ? 0 : 1)"
    cmds:
      - task: _bun:unix
        vars:
          ARGS: >-
            add -d --silent depcheck{{if .RESOLVED_VERSION}}@{{.RESOLVED_VERSION}}{{end}}
            {{default .EXTRA_ARGS .EXTRA_ARGS_OVERRIDE}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
      - task: _bun:windows
        vars:
          ARGS: >-
            add -d --silent depcheck{{if .RESOLVED_VERSION}}@{{.RESOLVED_VERSION}}{{end}}
            {{default .EXTRA_ARGS .EXTRA_ARGS_OVERRIDE}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}

  install:undo:
    run: once
    desc: Remove the locally installed Depcheck devDependency
    summary: Remove depcheck from local devDependencies via the active package manager.
    prompt:
      - This will remove depcheck from local devDependencies.
      - Continue?
    cmds:
      - task: _bun:unix
        vars:
          ARGS: remove --silent depcheck {{default .EXTRA_ARGS .EXTRA_ARGS_OVERRIDE}}
      - task: _bun:windows
        vars:
          ARGS: remove --silent depcheck {{default .EXTRA_ARGS .EXTRA_ARGS_OVERRIDE}}

  upgrade:
    run: once
    desc: Upgrade Depcheck to the latest release
    summary: Reinstall depcheck at the latest version as a local devDependency.
    cmds:
      - task: _bun:unix
        vars:
          ARGS: add -d --silent depcheck@latest {{default .EXTRA_ARGS .EXTRA_ARGS_OVERRIDE}}
      - task: _bun:windows
        vars:
          ARGS: add -d --silent depcheck@latest {{default .EXTRA_ARGS .EXTRA_ARGS_OVERRIDE}}

  # Shared implementation of lint / json / ignores / skip-missing. Each override
  # is resolved exactly once here; callers supply only the trailing mode flag.
  _run:
    internal: true
    run: when_changed
    vars:
      RESOLVED_SKIP: '{{default .DEPCHECK_LINT_SKIP_PATTERN .DEPCHECK_LINT_SKIP_PATTERN_OVERRIDE}}'
      RESOLVED_PATH: >-
        {{or .DEPCHECK_PROJECT_PATH_OVERRIDE .DEPCHECK_TARGETS_OVERRIDE
        .DEPCHECK_PROJECT_PATH .TARGETS .DEPCHECK_DEFAULT_PROJECT_PATH}}
    cmds:
      - task: _bun:unix
        vars:
          ARGS: >-
            x depcheck
            {{if .RESOLVED_SKIP}}--ignore-patterns="{{.RESOLVED_SKIP}}" {{end}}
            {{- .RESOLVED_PATH}}
            {{- if .MODE_ARGS}} {{.MODE_ARGS}}{{end}}
            {{default .EXTRA_ARGS .EXTRA_ARGS_OVERRIDE}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
      - task: _bun:windows
        vars:
          ARGS: >-
            x depcheck
            {{if .RESOLVED_SKIP}}--ignore-patterns="{{.RESOLVED_SKIP}}" {{end}}
            {{- .RESOLVED_PATH}}
            {{- if .MODE_ARGS}} {{.MODE_ARGS}}{{end}}
            {{default .EXTRA_ARGS .EXTRA_ARGS_OVERRIDE}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}

  lint:
    run: once
    desc: Run Depcheck
    summary: Depcheck reports unused and missing dependencies; review findings before removing packages.
    cmds:
      - task: _run
        vars:
          MODE_ARGS: ""
      - echo "✅ depcheck passed"

  json:
    run: once
    desc: Run Depcheck and print JSON output
    cmds:
      - task: _run
        vars:
          MODE_ARGS: "--json"

  ignores:
    run: once
    desc: Run Depcheck while ignoring packages from DEPCHECK_IGNORE_PACKAGES
    summary: Set DEPCHECK_IGNORE_PACKAGES as a comma-separated list, for example DEPCHECK_IGNORE_PACKAGES="@types/*,eslint-*".
    cmds:
      - task: _run
        vars:
          MODE_ARGS: '--ignores="{{default .DEPCHECK_IGNORE_PACKAGES .DEPCHECK_IGNORE_PACKAGES_OVERRIDE}}"'

  skip-missing:
    run: once
    desc: Run Depcheck while ignoring missing dependency reports
    cmds:
      - task: _run
        vars:
          MODE_ARGS: "--skip-missing=true"

  ci:
    run: once
    desc: Run Depcheck with CI failure on dependency findings
    summary: Depcheck exits non-zero when unused or missing dependencies are found.
    cmds:
      - task: lint
      - echo "✅ depcheck ci passed"

  version:
    run: once
    desc: Show the locally resolved Depcheck version
    cmds:
      - task: _bun:unix
        vars:
          ARGS: x depcheck --version
      - task: _bun:windows
        vars:
          ARGS: x depcheck --version

  help:
    run: once
    desc: Show Depcheck CLI help
    cmds:
      - task: _bun:unix
        vars:
          ARGS: >-
            x depcheck --help
            {{default .EXTRA_ARGS .EXTRA_ARGS_OVERRIDE}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
      - task: _bun:windows
        vars:
          ARGS: >-
            x depcheck --help
            {{default .EXTRA_ARGS .EXTRA_ARGS_OVERRIDE}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}


  _bun:unix:
    run: when_changed
    internal: true
    platforms: [linux, darwin]
    dir: "{{.USER_WORKING_DIR}}"
    set: [errexit, nounset, pipefail]
    requires:
      vars: [ARGS]
    deps:
      - task: bun:install
    env:
      CI: "1"
    cmds:
      - >-
        BUN_INSTALL="${BUN_INSTALL:-$HOME/.bun}"
        PATH="$BUN_INSTALL/bin:$PATH"
        bun {{.ARGS}}

  _bun:windows:
    run: when_changed
    internal: true
    platforms: [windows]
    dir: "{{.USER_WORKING_DIR}}"
    requires:
      vars: [ARGS]
    deps:
      - task: bun:install
    env:
      CI: "1"
    cmds:
      - >-
        powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command
        "$ErrorActionPreference = 'Stop';
        $env:CI = '1';
        $bun = if (Get-Command bun -ErrorAction SilentlyContinue) { 'bun' }
        else { \"$env:USERPROFILE\.bun\bin\bun.exe\" }; & $bun {{.ARGS}}"
