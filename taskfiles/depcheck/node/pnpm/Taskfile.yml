---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  pnpm:
    taskfile: ../../../pnpm/Taskfile.yml

vars:
  DEPCHECK_PROJECT_PATH: '{{.DEPCHECK_PROJECT_PATH | default ""}}'
  DEPCHECK_DEFAULT_PROJECT_PATH: '{{.DEPCHECK_DEFAULT_PROJECT_PATH | default "."}}'
  DEPCHECK_TARGETS: '{{.DEPCHECK_TARGETS | default ""}}'
  DEPCHECK_IGNORE_PACKAGES: '{{.DEPCHECK_IGNORE_PACKAGES | default ""}}'
  DEPCHECK_EXTRA_ARGS: '{{.DEPCHECK_EXTRA_ARGS | default ""}}'
  DEPCHECK_VERSION: '{{.DEPCHECK_VERSION | default ""}}'

tasks:
  default:
    run: once
    desc: Show available Depcheck tasks
    cmds:
      - task --list

  install:
    run: once
    dir: "{{.USER_WORKING_DIR}}"
    desc: Install Depcheck as a local devDependency
    summary: |
      Install depcheck as a local devDependency. Pass DEPCHECK_VERSION=x.y.z to pin a
      specific release instead of the package manager's default resolution.
    vars:
      RESOLVED_VERSION: '{{.DEPCHECK_VERSION}}'
    status:
      - >-
        node -e "const installed = require('./node_modules/depcheck/package.json');
        const requested = '{{.RESOLVED_VERSION}}';
        process.exit(!requested || installed.version === requested ? 0 : 1)"
    cmds:
      - task: pnpm:add
        vars:
          PACKAGES: 'depcheck{{if .RESOLVED_VERSION}}@{{.RESOLVED_VERSION}}{{end}}'
          EXTRA_ARGS: >-
            {{.DEPCHECK_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}

  install:undo:
    run: once
    desc: Remove the locally installed Depcheck devDependency
    summary: Remove depcheck from local devDependencies via the active package manager.
    prompt:
      - This will remove depcheck from local devDependencies.
      - Continue?
    cmds:
      - task: pnpm:remove
        vars:
          PACKAGES: depcheck
          EXTRA_ARGS: '{{.DEPCHECK_EXTRA_ARGS}}'

  upgrade:
    run: once
    desc: Upgrade Depcheck to the latest release
    summary: Reinstall depcheck at the latest version as a local devDependency.
    cmds:
      - task: pnpm:add
        vars:
          PACKAGES: depcheck@latest
          EXTRA_ARGS: '{{.DEPCHECK_EXTRA_ARGS}}'

  # Shared implementation of lint / json / ignores / skip-missing. Each override
  # is resolved exactly once here; callers supply only the trailing mode flag.
  _run:
    internal: true
    run: when_changed
    vars:
      RESOLVED_PATH: >-
        {{or .DEPCHECK_PROJECT_PATH .DEPCHECK_TARGETS .DEPCHECK_DEFAULT_PROJECT_PATH}}
    cmds:
      - task: pnpm:exec
        vars:
          BINARY: depcheck
          ARGS: >-
            {{- .RESOLVED_PATH}}
            {{- if .MODE_ARGS}} {{.MODE_ARGS}}{{end}}
          EXTRA_ARGS: >-
            {{.DEPCHECK_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}

  json:
    run: once
    desc: Run Depcheck and print JSON output
    cmds:
      - task: _run
        vars:
          MODE_ARGS: "--json"

  ignores:
    run: once
    desc: Run Depcheck while ignoring packages from DEPCHECK_IGNORE_PACKAGES
    summary: >-
      Set DEPCHECK_IGNORE_PACKAGES as a comma-separated list, for example
      DEPCHECK_IGNORE_PACKAGES="@types/*,eslint-*".
    cmds:
      - task: _run
        vars:
          MODE_ARGS: '--ignores="{{.DEPCHECK_IGNORE_PACKAGES}}"'

  skip-missing:
    run: once
    desc: Run Depcheck while ignoring missing dependency reports
    cmds:
      - task: _run
        vars:
          MODE_ARGS: "--skip-missing=true"

  ci:
    run: once
    desc: Run Depcheck with CI failure on dependency findings
    summary: Depcheck exits non-zero when unused or missing dependencies are found.
    cmds:
      - task: _run
        vars:
          MODE_ARGS: ""
      - echo "✅ depcheck ci passed"

  version:
    run: once
    desc: Show the locally resolved Depcheck version
    cmds:
      - task: pnpm:exec
        vars:
          BINARY: depcheck
          ARGS: "--version"

  help:
    run: once
    desc: Show Depcheck CLI help
    cmds:
      - task: pnpm:exec
        vars:
          BINARY: depcheck
          ARGS: "--help"
          EXTRA_ARGS: >-
            {{.DEPCHECK_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
