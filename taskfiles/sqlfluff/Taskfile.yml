---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml

vars:
  SQLFLUFF_NIX_INSTALLABLE: '{{.SQLFLUFF_NIX_INSTALLABLE | default "nixpkgs#sqlfluff"}}'
  SQLFLUFF_TARGETS: '{{.SQLFLUFF_TARGETS | default "."}}'
  SQLFLUFF_CONFIG: '{{.SQLFLUFF_CONFIG | default ""}}'
  SQLFLUFF_DIALECT: '{{.SQLFLUFF_DIALECT | default ""}}'
  SQLFLUFF_EXTRA_ARGS: '{{.SQLFLUFF_EXTRA_ARGS | default ""}}'

tasks:
  default:
    run: once
    desc: Show available sqlfluff automation tasks
    summary: Display the list of available sqlfluff-related tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install sqlfluff via the Nix profile
    summary: |
      Install sqlfluff into the user Nix profile when it is not already
      available on PATH. Override the SQLFLUFF_NIX_INSTALLABLE
      variable to pin a different package or version.
    status:
      - command -v sqlfluff >/dev/null 2>&1
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.SQLFLUFF_NIX_INSTALLABLE}}"

  version:
    run: once
    desc: Show the active sqlfluff version
    summary: |
      Print the version reported by the sqlfluff binary resolved from PATH.
      Auto-installs sqlfluff if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  ci:
    run: once
    desc: Lint SQL files with sqlfluff (SQLFLUFF_TARGETS=path)
    summary: |
      Run sqlfluff lint against SQLFLUFF_TARGETS (default .). Pass
      SQLFLUFF_CONFIG to use a custom config file via --config,
      SQLFLUFF_DIALECT to set the SQL dialect, and SQLFLUFF_EXTRA_ARGS for
      additional flags. Auto-installs sqlfluff if missing.
    deps:
      - task: install
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - >-
        bash -lc '{{.NIX_LOAD}};
        sqlfluff lint
        {{if .CLI_ARGS}}{{.CLI_ARGS}}
        {{else}}
        {{if .SQLFLUFF_DIALECT}}--dialect {{.SQLFLUFF_DIALECT}} {{end}}
        {{.SQLFLUFF_TARGETS}}
        {{.SQLFLUFF_EXTRA_ARGS}}{{end}}
        {{if .SQLFLUFF_CONFIG}}--config "{{.SQLFLUFF_CONFIG}}"{{end}}
        && echo "✅ sqlfluff passed" || { echo "❌ sqlfluff failed"; exit 1; }'

  ci:fix:
    run: once
    desc: Auto-fix SQL files with sqlfluff (SQLFLUFF_TARGETS=path)
    summary: |
      Run sqlfluff fix against SQLFLUFF_TARGETS (default .) to automatically
      fix lint violations. Pass SQLFLUFF_CONFIG, SQLFLUFF_DIALECT, and
      SQLFLUFF_EXTRA_ARGS as needed. Auto-installs sqlfluff if missing.
    deps:
      - task: install
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - >-
        bash -lc '{{.NIX_LOAD}};
        sqlfluff fix
        {{if .CLI_ARGS}}{{.CLI_ARGS}}
        {{else}}
        {{if .SQLFLUFF_DIALECT}}--dialect {{.SQLFLUFF_DIALECT}} {{end}}
        {{.SQLFLUFF_TARGETS}}
        {{.SQLFLUFF_EXTRA_ARGS}}{{end}}
        {{if .SQLFLUFF_CONFIG}}--config "{{.SQLFLUFF_CONFIG}}"{{end}}
        && echo "✅ sqlfluff fixes applied"'

  parse:
    run: once
    desc: Parse SQL files and print the parse tree (SQLFLUFF_TARGETS=path)
    summary: |
      Run sqlfluff parse against SQLFLUFF_TARGETS (default .) and print the
      parse tree. Useful for debugging dialect issues or understanding how
      sqlfluff interprets a query. Pass SQLFLUFF_CONFIG, SQLFLUFF_DIALECT, and
      SQLFLUFF_EXTRA_ARGS as needed. Auto-installs sqlfluff if missing.
    deps:
      - task: install
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - >-
        bash -lc '{{.NIX_LOAD}};
        sqlfluff parse
        {{if .CLI_ARGS}}{{.CLI_ARGS}}
        {{else}}
        {{if .SQLFLUFF_DIALECT}}--dialect {{.SQLFLUFF_DIALECT}} {{end}}
        {{.SQLFLUFF_TARGETS}}
        {{.SQLFLUFF_EXTRA_ARGS}}{{end}}
        {{if .SQLFLUFF_CONFIG}}--config "{{.SQLFLUFF_CONFIG}}"{{end}}'

  config:init:
    run: once
    dir: "{{.USER_WORKING_DIR}}"
    desc: Create a default .sqlfluff configuration file
    summary: |
      Write a sensible default .sqlfluff file in the current directory.
      Sets the dialect to ansi, max line length to 120, and 4-space
      indentation. Skipped if .sqlfluff already exists.
    status:
      - test -f .sqlfluff
    cmds:
      - "printf '[sqlfluff]\\n' > .sqlfluff"
      - "printf 'dialect = ansi\\n' >> .sqlfluff"
      - "printf 'max_line_length = 120\\n' >> .sqlfluff"
      - "printf '\\n' >> .sqlfluff"
      - "printf '[sqlfluff:indentation]\\n' >> .sqlfluff"
      - "printf 'indent_unit = space\\n' >> .sqlfluff"
      - "printf 'tab_space_size = 4\\n' >> .sqlfluff"
      - echo 'Created .sqlfluff with default configuration.'

  _version:unix:
    run: once
    internal: true
    desc: Show sqlfluff version on macOS or Linux
    summary: Print the sqlfluff version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; sqlfluff --version'

  _version:windows:
    run: once
    internal: true
    desc: Show sqlfluff version on Windows
    summary: Print the sqlfluff version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Get-Command sqlfluff -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: sqlfluff is not installed or not available in PATH.
    cmds:
      - sqlfluff --version
