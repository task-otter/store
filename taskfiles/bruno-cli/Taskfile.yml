---
version: "3.5"

output:

  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:

  nix:
    taskfile: ../nix/Taskfile.yml

vars:

  BRUNO_CLI_NIX_INSTALLABLE: nixpkgs#bruno-cli

  BRUNO_CLI_COLLECTION: "."

  BRUNO_CLI_ENV: ""

  BRUNO_CLI_EXTRA_ARGS: ""

tasks:
  default:
    run: once
    desc: Show available Bruno CLI tasks
    summary: Display the list of available Bruno CLI-related tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install the Bruno CLI via the Nix profile
    summary: |
      Install the Bruno CLI into the user Nix profile when it is not already
      available on PATH. Override the BRUNO_CLI_NIX_INSTALLABLE
      variable to pin a different package or version.
    status:
      - command -v bru >/dev/null 2>&1
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.BRUNO_CLI_NIX_INSTALLABLE}}"

  version:
    run: once
    desc: Show the active the Bruno CLI version
    summary: |
      Print the version reported by the bru binary resolved from PATH.
      Auto-installs the Bruno CLI if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  _run:
    internal: true
    run: when_changed
    dir: "{{.USER_WORKING_DIR}}"
    vars:
      RESOLVED_COLLECTION: '{{.BRUNO_CLI_COLLECTION}}'
      RESOLVED_ENV: '{{.BRUNO_CLI_ENV}}'
    deps:
      - task: install
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}}; bru run {{.RESOLVED_COLLECTION}}
          {{- if .RESOLVED_ENV}} --env "{{.RESOLVED_ENV}}"{{end}}
          {{- if .MODE_ARGS}} {{.MODE_ARGS}}{{end}}
          {{.BRUNO_CLI_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "bru run {{.RESOLVED_COLLECTION}}
          {{if .RESOLVED_ENV}}--env '{{.RESOLVED_ENV}}'{{end}}
          {{if .MODE_ARGS}}{{.MODE_ARGS}}{{end}}
          {{.BRUNO_CLI_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}"
        platforms: [windows]

  run:
    run: once
    desc: Run a Bruno collection (BRUNO_CLI_COLLECTION=path)
    summary: |
      Run all requests in the Bruno collection at BRUNO_CLI_COLLECTION (default:
      current directory). Pass BRUNO_CLI_ENV to activate a named Bruno environment,
      and BRUNO_CLI_EXTRA_ARGS for additional bru flags. Pass CLI arguments after
      -- to override all variables directly. Auto-installs bru if missing.
    cmds:
      - task: _run
        vars:
          MODE_ARGS: ""

  ci:
    run: once
    desc: Run Bruno collection in CI mode with --bail (BRUNO_CLI_COLLECTION=path)
    summary: |
      Run all requests in the Bruno collection and stop immediately on the first
      failure via --bail. Pass BRUNO_CLI_ENV to activate a named Bruno environment.
      Intended for CI pipelines where a single failure should abort the run.
      Auto-installs bru if missing.
    cmds:
      - task: _run
        vars:
          MODE_ARGS: "--bail"

  help:
    run: once
    desc: Show Bruno CLI help
    summary: Display the built-in bru help output. Auto-installs bru if missing.
    deps:
      - task: install
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}}; bru --help
          {{.BRUNO_CLI_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "bru --help
          {{.BRUNO_CLI_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}"
        platforms: [windows]

  _version:unix:
    run: once
    internal: true
    desc: Show the Bruno CLI version on macOS or Linux
    summary: Print the bru version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; bru --version'

  _version:windows:
    run: once
    internal: true
    desc: Show the Bruno CLI version on Windows
    summary: Print the bru version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command "if (Get-Command bru -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: the Bruno CLI is not installed or not available in PATH.
    cmds:
      - bru --version
