---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  yarn:
    taskfile: ../../../yarn/Taskfile.yml

vars:
  SPECTRAL_LINT_SKIP_PATTERN: ""
  SPECTRAL_TARGETS: ""
  SPECTRAL_RULESET: ""
  SPECTRAL_EXTRA_ARGS: ""
  SPECTRAL_VERSION: ""

tasks:
  default:
    run: once
    desc: Show available Spectral tasks
    cmds:
      - task --list

  install:
    run: once
    dir: "{{.USER_WORKING_DIR}}"
    desc: Install Spectral as a local devDependency
    summary: |
      Install @stoplight/spectral-cli as a local devDependency. Pass
      SPECTRAL_VERSION=x.y.z to pin a specific release instead of the package
      manager's default resolution.
    vars:
      RESOLVED_VERSION: '{{default .SPECTRAL_VERSION .SPECTRAL_VERSION_OVERRIDE}}'
    status:
      - >-
        node -e "const installed = require('./node_modules/@stoplight/spectral-cli/package.json');
        const requested = '{{.RESOLVED_VERSION}}';
        process.exit(!requested || installed.version === requested ? 0 : 1)"
    cmds:
      - task: yarn:add
        vars:
          PACKAGES: >-
            @stoplight/spectral-cli{{if .RESOLVED_VERSION}}@{{.RESOLVED_VERSION}}{{end}}
          EXTRA_ARGS: >-
            {{default .SPECTRAL_EXTRA_ARGS .SPECTRAL_EXTRA_ARGS_OVERRIDE}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}

  install:undo:
    run: once
    desc: Remove the locally installed Spectral devDependency
    summary: Remove @stoplight/spectral-cli from local devDependencies via the active package manager.
    prompt:
      - This will remove @stoplight/spectral-cli from local devDependencies.
      - Continue?
    cmds:
      - task: yarn:remove
        vars:
          PACKAGES: "@stoplight/spectral-cli"
          EXTRA_ARGS: '{{default .SPECTRAL_EXTRA_ARGS .SPECTRAL_EXTRA_ARGS_OVERRIDE}}'

  upgrade:
    run: once
    desc: Upgrade Spectral to the latest release
    summary: Reinstall @stoplight/spectral-cli at the latest version as a local devDependency.
    cmds:
      - task: yarn:add
        vars:
          PACKAGES: "@stoplight/spectral-cli@latest"
          EXTRA_ARGS: '{{default .SPECTRAL_EXTRA_ARGS .SPECTRAL_EXTRA_ARGS_OVERRIDE}}'

  config:init:
    run: once
    desc: Create a default .spectral.yaml ruleset file
    summary: |
      Write a .spectral.yaml ruleset extending the built-in spectral:oas
      OpenAPI rules in the current directory. Skipped if .spectral.yaml
      already exists.
    dir: "{{.USER_WORKING_DIR}}"
    status:
      - test -f .spectral.yaml
    cmds:
      - 'printf ''extends: ["spectral:oas"]\n'' > .spectral.yaml'
      - echo 'Created .spectral.yaml extending spectral:oas.'

  ci:
    run: once
    desc: Lint API documents with Spectral (SPECTRAL_TARGETS=path)
    summary: |
      Run spectral lint against the API documents at SPECTRAL_TARGETS. Pass RULESET to
      use a specific ruleset file via --ruleset, and SPECTRAL_EXTRA_ARGS for additional
      flags. Auto-installs Spectral if missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    vars:
      RESOLVED_TARGETS: '{{default .SPECTRAL_TARGETS .SPECTRAL_TARGETS_OVERRIDE}}'
      RESOLVED_SKIP: '{{default .SPECTRAL_LINT_SKIP_PATTERN .SPECTRAL_LINT_SKIP_PATTERN_OVERRIDE}}'
      RESOLVED_RULESET: '{{default .SPECTRAL_RULESET .SPECTRAL_RULESET_OVERRIDE}}'
    cmds:
      - task: yarn:exec
        vars:
          BINARY: spectral
          ARGS: >-
            lint {{.RESOLVED_TARGETS}}
            {{- if .RESOLVED_SKIP}} "!{{.RESOLVED_SKIP}}"{{end}}
            {{- if .RESOLVED_RULESET}} --ruleset "{{.RESOLVED_RULESET}}"{{end}}
          EXTRA_ARGS: >-
            {{default .SPECTRAL_EXTRA_ARGS .SPECTRAL_EXTRA_ARGS_OVERRIDE}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
      - echo "✅ spectral passed"

  help:
    run: once
    desc: Show the Spectral CLI help
    deps:
      - task: install
    cmds:
      - task: yarn:exec
        vars:
          BINARY: spectral
          ARGS: "--help"

  version:
    run: once
    desc: Show the locally resolved Spectral version
    deps:
      - task: install
    cmds:
      - task: yarn:exec
        vars:
          BINARY: spectral
          ARGS: "--version"
