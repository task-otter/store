---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml

vars:
  RUMDL_TARGETS: "."
  RUMDL_EXTRA_ARGS: ""
  RUMDL_NIX_INSTALLABLE: nixpkgs#rumdl

tasks:
  default:
    run: once
    desc: Show available rumdl automation tasks
    summary: Display the list of available rumdl-related tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install rumdl via the Nix profile
    summary: |
      Install rumdl into the user Nix profile when it is not already
      available on PATH. Override the RUMDL_NIX_INSTALLABLE
      variable to pin a different package or version.
    status:
      - command -v rumdl >/dev/null 2>&1
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.RUMDL_NIX_INSTALLABLE}}"

  version:
    run: once
    desc: Show the active rumdl version
    summary: |
      Print the version reported by the rumdl binary resolved from PATH.
      Auto-installs rumdl if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  _version:unix:
    run: once
    internal: true
    desc: Show rumdl version on macOS or Linux
    summary: Print the rumdl version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; rumdl --version'

  _version:windows:
    run: once
    internal: true
    desc: Show rumdl version on Windows
    summary: Print the rumdl version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Get-Command rumdl -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: rumdl is not installed or not available in PATH.
    cmds:
      - rumdl --version

  # Shared implementation of lint / lint:fix / fmt. Each override is resolved exactly
  # once here; callers supply the subcommand and any trailing shell reporting.
  _run:
    internal: true
    run: when_changed
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    vars:
      PATHS: '{{or .RUMDL_TARGETS "."}}'
      EXTRA: '{{.RUMDL_EXTRA_ARGS}}'
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          rumdl {{.SUBCMD}}
          {{.PATHS}}{{if .EXTRA}} {{.EXTRA}}{{end}}{{.TAIL}}'
        platforms: [linux, darwin]
      - cmd: >-
          rumdl {{.SUBCMD}}
          {{.PATHS}}{{if .EXTRA}} {{.EXTRA}}{{end}}
        platforms: [windows]

  ci:
    run: once
    desc: Lint Markdown files with rumdl (RUMDL_TARGETS=path)
    summary: |
      Run rumdl check against RUMDL_TARGETS (default .). Pass RUMDL_EXTRA_ARGS for
      additional flags. Auto-installs rumdl if missing.
    cmds:
      - task: _run
        vars:
          SUBCMD: check
          TAIL: ' && echo "✅ rumdl passed" || { echo "❌ rumdl failed"; exit 1; }'

  lint:fix:
    run: once
    desc: Fix Markdown lint issues with rumdl (RUMDL_TARGETS=path)
    summary: |
      Run rumdl check --fix against RUMDL_TARGETS (default .) to apply automatic
      fixes for fixable lint violations. Exits non-zero when unfixable
      violations remain. Pass RUMDL_EXTRA_ARGS for additional flags.
      Auto-installs rumdl if missing.
    cmds:
      - task: _run
        vars:
          SUBCMD: check --fix

  ci:fix:
    run: once
    desc: Run fmt then lint:fix for CI
    summary: |
      Run fmt then lint:fix. Applies formatting and automatic lint fixes
      suitable for CI autofix workflows.
    cmds:
      - task: fmt
      - task: lint:fix

  fmt:
    run: once
    desc: Format Markdown files with rumdl (RUMDL_TARGETS=path)
    summary: |
      Run rumdl fmt against RUMDL_TARGETS (default .). Unlike lint:fix, fmt uses
      formatter-style exit codes and exits zero after successful formatting
      even if unfixable violations remain. Pass RUMDL_EXTRA_ARGS for additional
      flags. Auto-installs rumdl if missing.
    cmds:
      - task: _run
        vars:
          SUBCMD: fmt
