---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  bun:
    taskfile: ../../bun/Taskfile.yml

vars:
  ESLINT_TARGETS: ""
  ESLINT_DEFAULT_TARGETS: "src/**/*.{js,jsx,ts,tsx}"
  ESLINT_CONFIG: ""
  ESLINT_CACHE: ""
  ESLINT_DEFAULT_CACHE: "true"
  ESLINT_EXTRA_ARGS: ""
  ESLINT_VERSION: ""

tasks:
  default:
    run: once
    desc: Show available ESLint tasks
    cmds:
      - task --list

  install:
    run: once
    dir: "{{.USER_WORKING_DIR}}"
    desc: Install ESLint as a local devDependency
    summary: |
      Install eslint as a local devDependency. Pass ESLINT_VERSION=x.y.z to pin a
      specific release instead of the package manager's default resolution.
    vars:
      RESOLVED_VERSION: '{{default .ESLINT_VERSION .ESLINT_VERSION_OVERRIDE}}'
      RESOLVED_EXTRA_ARGS: '{{default .ESLINT_EXTRA_ARGS .ESLINT_EXTRA_ARGS_OVERRIDE}}'
    status:
      - >-
        node -e "const installed = require('./node_modules/eslint/package.json');
        const requested = '{{.RESOLVED_VERSION}}';
        process.exit(!requested || installed.version === requested ? 0 : 1)"
    cmds:
      - task: _bun:unix
        vars:
          ARGS: >-
            add -d --silent eslint{{if .RESOLVED_VERSION}}@{{.RESOLVED_VERSION}}{{end}}
            {{.RESOLVED_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
      - task: _bun:windows
        vars:
          ARGS: >-
            add -d --silent eslint{{if .RESOLVED_VERSION}}@{{.RESOLVED_VERSION}}{{end}}
            {{.RESOLVED_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}

  install:undo:
    run: once
    desc: Remove the locally installed ESLint devDependency
    summary: Remove eslint from local devDependencies via the active package manager.
    prompt:
      - This will remove eslint from local devDependencies.
      - Continue?
    cmds:
      - task: _bun:unix
        vars:
          ARGS: remove --silent eslint {{default .ESLINT_EXTRA_ARGS .ESLINT_EXTRA_ARGS_OVERRIDE}}
      - task: _bun:windows
        vars:
          ARGS: remove --silent eslint {{default .ESLINT_EXTRA_ARGS .ESLINT_EXTRA_ARGS_OVERRIDE}}

  upgrade:
    run: once
    desc: Upgrade ESLint to the latest release
    summary: Reinstall eslint at the latest version as a local devDependency.
    cmds:
      - task: _bun:unix
        vars:
          ARGS: >-
            add -d --silent eslint@latest
            {{default .ESLINT_EXTRA_ARGS .ESLINT_EXTRA_ARGS_OVERRIDE}}
      - task: _bun:windows
        vars:
          ARGS: >-
            add -d --silent eslint@latest
            {{default .ESLINT_EXTRA_ARGS .ESLINT_EXTRA_ARGS_OVERRIDE}}

  config:init:
    run: once
    dir: "{{.USER_WORKING_DIR}}"
    desc: Create a starter ESLint flat config when none exists
    summary: |
      Write a minimal eslint.config.mjs with recommended defaults.
      Non-interactive — does not run the eslint --init wizard.
      Skipped if a recognized ESLint config file already exists in the
      current directory (eslint.config.js/mjs/cjs or .eslintrc.*).
    status:
      - >-
        test -f eslint.config.js ||
        test -f eslint.config.mjs ||
        test -f eslint.config.cjs ||
        test -f .eslintrc.js ||
        test -f .eslintrc.cjs ||
        test -f .eslintrc.json ||
        test -f .eslintrc.yml ||
        test -f .eslintrc.yaml
    cmds:
      - |
        printf '%s\n' \
          '/** @type {import("eslint").Linter.Config[]} */' \
          'export default [' \
          '  {' \
          '    languageOptions: {' \
          '      ecmaVersion: "latest",' \
          '      sourceType: "module",' \
          '    },' \
          '  },' \
          '];' > eslint.config.mjs
      - echo 'Created eslint.config.mjs.'
  # Shared implementation of lint / ci:fix / ci. Each override is resolved
  # exactly once here; the three public tasks differ only by MODE_ARGS.

  _run:
    internal: true
    run: when_changed
    vars:
      RESOLVED_CONFIG: '{{default .ESLINT_CONFIG .ESLINT_CONFIG_OVERRIDE}}'
      RESOLVED_CACHE: '{{or .ESLINT_CACHE_OVERRIDE .ESLINT_CACHE .ESLINT_DEFAULT_CACHE}}'
      RESOLVED_TARGETS: '{{or .ESLINT_TARGETS_OVERRIDE .ESLINT_TARGETS .ESLINT_DEFAULT_TARGETS}}'
      RESOLVED_EXTRA_ARGS: '{{default .ESLINT_EXTRA_ARGS .ESLINT_EXTRA_ARGS_OVERRIDE}}'
    cmds:
      - task: _bun:unix
        vars:
          ARGS: >-
            x eslint
            {{if .RESOLVED_CONFIG}}--config "{{.RESOLVED_CONFIG}}" {{end}}
            {{- if eq .RESOLVED_CACHE "true"}}--cache --cache-location .cache/eslint/ {{end}}
            {{- if .MODE_ARGS}}{{.MODE_ARGS}} {{end}}
            {{- .RESOLVED_TARGETS}}
            {{.RESOLVED_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
      - task: _bun:windows
        vars:
          ARGS: >-
            x eslint
            {{if .RESOLVED_CONFIG}}--config "{{.RESOLVED_CONFIG}}" {{end}}
            {{- if eq .RESOLVED_CACHE "true"}}--cache --cache-location .cache/eslint/ {{end}}
            {{- if .MODE_ARGS}}{{.MODE_ARGS}} {{end}}
            {{- .RESOLVED_TARGETS}}
            {{.RESOLVED_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}

  ci:fix:
    run: once
    desc: Lint targets with ESLint and apply fixes
    cmds:
      - task: _run
        vars:
          MODE_ARGS: "--fix"
      - echo "✅ eslint fixes applied"

  ci:
    run: once
    desc: Run ESLint with zero-warning CI enforcement
    cmds:
      - task: _run
        vars:
          MODE_ARGS: "--max-warnings=0"
      - echo "✅ eslint passed"

  cache:clean:
    run: once
    desc: Remove the ESLint cache directory
    cmds:
      - if [ -d .cache/eslint ]; then rm -rf .cache/eslint; fi

  version:
    run: once
    desc: Show the locally resolved ESLint version
    cmds:
      - task: _bun:unix
        vars:
          ARGS: x eslint --version
      - task: _bun:windows
        vars:
          ARGS: x eslint --version

  help:
    run: once
    desc: Show ESLint CLI help
    cmds:
      - task: _bun:unix
        vars:
          ARGS: >-
            x eslint --help
            {{default .ESLINT_EXTRA_ARGS .ESLINT_EXTRA_ARGS_OVERRIDE}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
      - task: _bun:windows
        vars:
          ARGS: >-
            x eslint --help
            {{default .ESLINT_EXTRA_ARGS .ESLINT_EXTRA_ARGS_OVERRIDE}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}


  _bun:unix:
    run: when_changed
    internal: true
    platforms: [linux, darwin]
    dir: "{{.USER_WORKING_DIR}}"
    set: [errexit, nounset, pipefail]
    requires:
      vars: [ARGS]
    deps:
      - task: bun:_ensure
    env:
      CI: "1"
    cmds:
      - >-
        BUN_INSTALL="${BUN_INSTALL:-$HOME/.bun}"
        PATH="$BUN_INSTALL/bin:$PATH"
        bun {{.ARGS}}

  _bun:windows:
    run: when_changed
    internal: true
    platforms: [windows]
    dir: "{{.USER_WORKING_DIR}}"
    requires:
      vars: [ARGS]
    deps:
      - task: bun:_ensure
    env:
      CI: "1"
    cmds:
      - >-
        powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command
        "$ErrorActionPreference = 'Stop';
        $env:CI = '1';
        $bun = if (Get-Command bun -ErrorAction SilentlyContinue) { 'bun' }
        else { \"$env:USERPROFILE\.bun\bin\bun.exe\" }; & $bun {{.ARGS}}"
