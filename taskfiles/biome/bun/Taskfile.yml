---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  bun:
    taskfile: ../../bun/Taskfile.yml

vars:
  BIOME_TARGETS: ""
  BIOME_DEFAULT_TARGETS: "."
  BIOME_CONFIG: ""
  BIOME_EXTRA_ARGS: ""
  BIOME_VERSION: ""

tasks:
  default:
    run: once
    desc: Show available Biome tasks
    cmds:
      - task --list

  install:
    run: once
    dir: "{{.USER_WORKING_DIR}}"
    desc: Install Biome as a local devDependency
    summary: |
      Install @biomejs/biome as a local devDependency. Pass BIOME_VERSION=x.y.z to
      pin a specific release instead of the package manager's default
      resolution.
    status:
      - >-
        node -e "const installed = require('./node_modules/@biomejs/biome/package.json');
        const requested = '{{.RESOLVED_VERSION}}';
        process.exit(!requested || installed.version === requested ? 0 : 1)"
    vars:
      RESOLVED_VERSION: '{{.BIOME_VERSION}}'
    cmds:
      - task: _bun:unix
        vars:
          ARGS: >-
            add -d --silent @biomejs/biome{{if .RESOLVED_VERSION}}@{{.RESOLVED_VERSION}}{{end}}
            {{.BIOME_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
      - task: _bun:windows
        vars:
          ARGS: >-
            add -d --silent @biomejs/biome{{if .RESOLVED_VERSION}}@{{.RESOLVED_VERSION}}{{end}}
            {{.BIOME_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}

  install:undo:
    run: once
    desc: Remove the locally installed Biome devDependency
    summary: Remove @biomejs/biome from local devDependencies via the active package manager.
    prompt:
      - This will remove @biomejs/biome from local devDependencies.
      - Continue?
    cmds:
      - task: _bun:unix
        vars:
          ARGS: remove --silent @biomejs/biome {{.BIOME_EXTRA_ARGS}}
      - task: _bun:windows
        vars:
          ARGS: remove --silent @biomejs/biome {{.BIOME_EXTRA_ARGS}}

  upgrade:
    run: once
    desc: Upgrade Biome to the latest release
    summary: Reinstall @biomejs/biome at the latest version as a local devDependency.
    cmds:
      - task: _bun:unix
        vars:
          ARGS: >-
            add -d --silent @biomejs/biome@latest
            {{.BIOME_EXTRA_ARGS}}
      - task: _bun:windows
        vars:
          ARGS: >-
            add -d --silent @biomejs/biome@latest
            {{.BIOME_EXTRA_ARGS}}

  config:init:
    run: once
    dir: "{{.USER_WORKING_DIR}}"
    desc: Create a biome.json config file in the current directory
    summary: |
      Run biome init to generate a biome.json config file with recommended
      defaults. Skipped if biome.json or biome.jsonc already exists.
    status:
      - test -f biome.json || test -f biome.jsonc
    cmds:
      - task: _bun:unix
        vars:
          ARGS: >-
            x biome init
            {{.BIOME_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
      - task: _bun:windows
        vars:
          ARGS: >-
            x biome init
            {{.BIOME_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}

  # Shared implementation of lint / lint:fix / fmt / fmt:check / ci.
  _run:
    internal: true
    run: when_changed
    vars:
      RESOLVED_CONFIG: '{{.BIOME_CONFIG}}'
      RESOLVED_TARGETS: '{{or .BIOME_TARGETS .BIOME_DEFAULT_TARGETS}}'
    cmds:
      - task: _bun:unix
        vars:
          ARGS: >-
            x biome
            {{.SUBCMD}}
            {{- if .RESOLVED_CONFIG}} --config-path "{{.RESOLVED_CONFIG}}"{{end}}
            {{- if .RESOLVED_TARGETS}} {{.RESOLVED_TARGETS}}{{end}}
            {{.BIOME_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
      - task: _bun:windows
        vars:
          ARGS: >-
            x biome
            {{.SUBCMD}}
            {{- if .RESOLVED_CONFIG}} --config-path "{{.RESOLVED_CONFIG}}"{{end}}
            {{- if .RESOLVED_TARGETS}} {{.RESOLVED_TARGETS}}{{end}}
            {{.BIOME_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}

  lint:
    run: once
    desc: Run Biome check
    cmds:
      - task: _run
        vars:
          SUBCMD: check
      - echo "✅ biome passed"

  lint:fix:
    run: once
    desc: Run Biome check and write safe fixes
    cmds:
      - task: _run
        vars:
          SUBCMD: check --write
      - echo "✅ biome fixes applied"

  fmt:check:
    run: once
    desc: Check formatting with Biome
    cmds:
      - task: _run
        vars:
          SUBCMD: format

  fmt:
    run: once
    desc: Format files with Biome
    cmds:
      - task: _run
        vars:
          SUBCMD: format --write
      - echo "✅ biome fixes applied"

  ci:
    run: once
    desc: Run Biome fmt:check then lint
    cmds:
      - task: fmt:check
      - task: lint

  ci:fix:
    run: once
    desc: Run fmt then lint:fix for CI
    summary: |
      Run fmt then lint:fix. Applies formatting and automatic lint fixes
      suitable for CI autofix workflows.
    cmds:
      - task: fmt
      - task: lint:fix

  cache:clean:
    run: once
    desc: Remove common Biome cache directories if present
    cmds:
      - if [ -d .cache/biome ]; then rm -rf .cache/biome; fi
      - if [ -d node_modules/.cache/biome ]; then rm -rf node_modules/.cache/biome; fi

  version:
    run: once
    desc: Show the locally resolved Biome version
    cmds:
      - task: _bun:unix
        vars:
          ARGS: x biome --version
      - task: _bun:windows
        vars:
          ARGS: x biome --version

  help:
    run: once
    desc: Show Biome CLI help
    cmds:
      - task: _bun:unix
        vars:
          ARGS: >-
            x biome --help
            {{.BIOME_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
      - task: _bun:windows
        vars:
          ARGS: >-
            x biome --help
            {{.BIOME_EXTRA_ARGS}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}

  _bun:unix:
    run: when_changed
    internal: true
    platforms: [linux, darwin]
    dir: "{{.USER_WORKING_DIR}}"
    set: [errexit, nounset, pipefail]
    requires:
      vars: [ARGS]
    deps:
      - task: bun:install
    env:
      CI: "1"
    cmds:
      - >-
        BUN_INSTALL="${BUN_INSTALL:-$HOME/.bun}"
        PATH="$BUN_INSTALL/bin:$PATH"
        bun {{.ARGS}}

  _bun:windows:
    run: when_changed
    internal: true
    platforms: [windows]
    dir: "{{.USER_WORKING_DIR}}"
    requires:
      vars: [ARGS]
    deps:
      - task: bun:install
    env:
      CI: "1"
    cmds:
      - >-
        powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command
        "$ErrorActionPreference = 'Stop';
        $env:CI = '1';
        $bun = if (Get-Command bun -ErrorAction SilentlyContinue) { 'bun' }
        else { \"$env:USERPROFILE\.bun\bin\bun.exe\" }; & $bun {{.ARGS}}"
