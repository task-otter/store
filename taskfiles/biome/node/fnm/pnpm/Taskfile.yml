---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  pnpm:
    taskfile: ../../../../pnpm/fnm/Taskfile.yml

vars:
  BIOME_LINT_SKIP_PATTERN: ""
  BIOME_FMT_SKIP_PATTERN: ""
  TARGETS: ""
  BIOME_DEFAULT_TARGETS: "."
  CONFIG: ""
  EXTRA_ARGS: ""
  VERSION: ""
  BIOME_INTERNAL_LINT_SKIP_PATTERN: >-
    {{if .BIOME_LINT_SKIP_PATTERN_OVERRIDE}}{{.BIOME_LINT_SKIP_PATTERN_OVERRIDE}}
    {{- else}}{{.BIOME_LINT_SKIP_PATTERN}}{{end}}
  BIOME_INTERNAL_FMT_SKIP_PATTERN: >-
    {{if .BIOME_FMT_SKIP_PATTERN_OVERRIDE}}{{.BIOME_FMT_SKIP_PATTERN_OVERRIDE}}
    {{- else}}{{.BIOME_FMT_SKIP_PATTERN}}{{end}}
  BIOME_INTERNAL_COMBINED_SKIP_PATTERN: >-
    {{if .BIOME_INTERNAL_LINT_SKIP_PATTERN}}{{.BIOME_INTERNAL_LINT_SKIP_PATTERN}}
    {{- else}}{{.BIOME_INTERNAL_FMT_SKIP_PATTERN}}{{end}}
  BIOME_INTERNAL_CONFIG: >-
    {{if .CONFIG_OVERRIDE}}{{.CONFIG_OVERRIDE}}
    {{- else}}{{.CONFIG}}{{end}}
  BIOME_INTERNAL_SKIP_CONFIG: ".taskotter-biome-pnpm-fnm-skip.json"

tasks:
  default:
    run: once
    desc: Show available Biome tasks
    cmds:
      - task --list

  install:
    run: once
    desc: Install Biome as a local devDependency
    summary: |
      Install @biomejs/biome as a local devDependency. Pass VERSION=x.y.z to
      pin a specific release instead of the package manager's default
      resolution.
    status:
      - >-
        node -e "const installed = require('./node_modules/@biomejs/biome/package.json');
        const requested = '{{if .VERSION_OVERRIDE}}{{.VERSION_OVERRIDE}}{{else}}{{.VERSION}}{{end}}';
        process.exit(!requested || installed.version === requested ? 0 : 1)"
    cmds:
      - task: pnpm:add
        vars:
          PACKAGES: >-
            @biomejs/biome{{if .VERSION_OVERRIDE}}@{{.VERSION_OVERRIDE}}
            {{- else if .VERSION}}@{{.VERSION}}{{end}}
          EXTRA_ARGS: >-
            {{if .EXTRA_ARGS_OVERRIDE}}{{.EXTRA_ARGS_OVERRIDE}}
            {{- else}}{{.EXTRA_ARGS}}{{end}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}

  install:undo:
    run: once
    desc: Remove the locally installed Biome devDependency
    summary: Remove @biomejs/biome from local devDependencies via the active package manager.
    prompt:
      - This will remove @biomejs/biome from local devDependencies.
      - Continue?
    cmds:
      - task: pnpm:remove
        vars:
          PACKAGES: "@biomejs/biome"
          EXTRA_ARGS: "{{if .EXTRA_ARGS_OVERRIDE}}{{.EXTRA_ARGS_OVERRIDE}}{{else}}{{.EXTRA_ARGS}}{{end}}"

  upgrade:
    run: once
    desc: Upgrade Biome to the latest release
    summary: Reinstall @biomejs/biome at the latest version as a local devDependency.
    cmds:
      - task: pnpm:add
        vars:
          PACKAGES: "@biomejs/biome@latest"
          EXTRA_ARGS: "{{if .EXTRA_ARGS_OVERRIDE}}{{.EXTRA_ARGS_OVERRIDE}}{{else}}{{.EXTRA_ARGS}}{{end}}"

  init:
    run: once
    desc: Alias for biome:config:init
    cmds:
      - task: config:init

  config:init:
    run: once
    desc: Create a biome.json config file in the current directory
    summary: |
      Run biome init to generate a biome.json config file with recommended
      defaults. Skipped if biome.json or biome.jsonc already exists.
    status:
      - test -f biome.json || test -f biome.jsonc
    cmds:
      - task: pnpm:exec
        vars:
          BINARY: biome
          ARGS: init
          EXTRA_ARGS: >-
            {{if .EXTRA_ARGS_OVERRIDE}}{{.EXTRA_ARGS_OVERRIDE}}
            {{- else}}{{.EXTRA_ARGS}}{{end}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}

  config:skip:
    desc: Write a Biome config overlay that excludes the skip patterns
    summary: |
      Generate a Biome config that extends the project config and negates
      BIOME_LINT_SKIP_PATTERN and BIOME_FMT_SKIP_PATTERN. Every lint, format,
      check, and ci task runs this first. Pass SKIP_SCOPE=lint or SKIP_SCOPE=fmt
      to negate only one of the two; the default covers both. The overlay is
      rewritten on every run and is not removed afterwards, so add it to
      .gitignore. Running with no skip pattern set deletes it.
    dir: "{{.USER_WORKING_DIR}}"
    set: [errexit, nounset, pipefail]
    env:
      BIOME_SKIP_PATTERN: >-
        {{if eq (default "all" .SKIP_SCOPE) "fmt"}}{{.BIOME_INTERNAL_FMT_SKIP_PATTERN}}
        {{- else}}{{.BIOME_INTERNAL_LINT_SKIP_PATTERN}}{{end}}
      BIOME_SKIP_ADDITIONAL_PATTERN: >-
        {{if eq (default "all" .SKIP_SCOPE) "all"}}{{.BIOME_INTERNAL_FMT_SKIP_PATTERN}}{{end}}
      BIOME_SKIP_SOURCE_CONFIG: "{{.BIOME_INTERNAL_CONFIG}}"
      BIOME_SKIP_OUTPUT: "{{.BIOME_INTERNAL_SKIP_CONFIG}}"
    cmds:
      - cmd: |
          pattern="$BIOME_SKIP_PATTERN"
          source_config="$BIOME_SKIP_SOURCE_CONFIG"
          output="$BIOME_SKIP_OUTPUT"
          additional_pattern="$BIOME_SKIP_ADDITIONAL_PATTERN"

          # Nothing to skip: drop the overlay a previous run left behind so the
          # next task falls back to the project config instead of a stale one.
          if [[ -z "$pattern" && -z "$additional_pattern" ]]; then
            rm -f "$output"
            exit 0
          fi

          json_escape() {
            local value="$1"
            value="${value//\\/\\\\}"
            value="${value//\"/\\\"}"
            value="${value//$'\n'/\\n}"
            printf '%s' "$value"
          }

          discover_config() {
            local candidate
            for candidate in "$@"; do
              if [[ -f "$candidate" ]]; then
                printf '%s' "$candidate"
                return
              fi
            done
          }

          if [[ -z "$source_config" ]]; then
            source_config="$(discover_config biome.json biome.jsonc || true)"
          fi

          includes="\"**\""
          if [[ -n "$pattern" ]]; then
            includes+=",\"!$(json_escape "$pattern")\""
          fi
          if [[ -n "$additional_pattern" && "$additional_pattern" != "$pattern" ]]; then
            includes+=",\"!$(json_escape "$additional_pattern")\""
          fi

          if [[ -n "$source_config" ]]; then
            printf '{"extends":["%s"],"files":{"includes":[%s]}}\n' \
              "$(json_escape "$source_config")" "$includes" >"$output"
          else
            printf '{"files":{"includes":[%s]}}\n' "$includes" >"$output"
          fi
        platforms: [linux, darwin]
      - cmd: |
          powershell -NoProfile -ExecutionPolicy Bypass -Command - <<'POWERSHELL'
          $ErrorActionPreference = 'Stop'
          $pattern = $env:BIOME_SKIP_PATTERN
          $sourceConfig = $env:BIOME_SKIP_SOURCE_CONFIG
          $output = $env:BIOME_SKIP_OUTPUT
          $additionalPattern = $env:BIOME_SKIP_ADDITIONAL_PATTERN

          if ([string]::IsNullOrWhiteSpace($pattern) -and
              [string]::IsNullOrWhiteSpace($additionalPattern)) {
              Remove-Item -LiteralPath $output -Force -ErrorAction SilentlyContinue
              exit 0
          }

          if ([string]::IsNullOrWhiteSpace($sourceConfig)) {
              foreach ($candidate in @('biome.json', 'biome.jsonc')) {
                  if (Test-Path -LiteralPath $candidate -PathType Leaf) {
                      $sourceConfig = $candidate
                      break
                  }
              }
          }

          $config = [ordered]@{}
          if (-not [string]::IsNullOrWhiteSpace($sourceConfig)) {
              $config.extends = @($sourceConfig.Replace('\', '/'))
          }
          $includes = @('**')
          if (-not [string]::IsNullOrWhiteSpace($pattern)) {
              $includes += '!' + $pattern.Replace('\', '/')
          }
          if (-not [string]::IsNullOrWhiteSpace($additionalPattern) -and
              $additionalPattern -ne $pattern) {
              $includes += '!' + $additionalPattern.Replace('\', '/')
          }
          $config.files = [ordered]@{ includes = $includes }
          $config | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $output -Encoding UTF8
          POWERSHELL
        platforms: [windows]

  check:
    run: once
    desc: Run Biome check
    cmds:
      - task: config:skip
        vars:
          SKIP_SCOPE: all
      - task: pnpm:exec
        vars:
          BINARY: biome
          ARGS: >-
            check
            {{if .BIOME_INTERNAL_COMBINED_SKIP_PATTERN}}--config-path
            "{{.BIOME_INTERNAL_SKIP_CONFIG}}"
            {{else if .CONFIG_OVERRIDE}}--config-path "{{.CONFIG_OVERRIDE}}"
            {{else}}{{if .CONFIG}}--config-path "{{.CONFIG}}" {{end}}{{end}}
            {{if .BIOME_TARGETS_OVERRIDE}}{{.BIOME_TARGETS_OVERRIDE}}
            {{else}}{{if .TARGETS}}{{.TARGETS}}
            {{else}}{{.BIOME_DEFAULT_TARGETS}}{{end}}{{end}}
          EXTRA_ARGS: >-
            {{if .EXTRA_ARGS_OVERRIDE}}{{.EXTRA_ARGS_OVERRIDE}}
            {{else}}{{if .EXTRA_ARGS}}{{.EXTRA_ARGS}}{{end}}{{end}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
      - echo "✅ biome passed"

  check:write:
    run: once
    desc: Run Biome check and write safe fixes
    cmds:
      - task: config:skip
        vars:
          SKIP_SCOPE: all
      - task: pnpm:exec
        vars:
          BINARY: biome
          ARGS: >-
            check --write
            {{if .BIOME_INTERNAL_COMBINED_SKIP_PATTERN}}--config-path
            "{{.BIOME_INTERNAL_SKIP_CONFIG}}"
            {{else if .CONFIG_OVERRIDE}}--config-path "{{.CONFIG_OVERRIDE}}"
            {{else}}{{if .CONFIG}}--config-path "{{.CONFIG}}" {{end}}{{end}}
            {{if .BIOME_TARGETS_OVERRIDE}}{{.BIOME_TARGETS_OVERRIDE}}
            {{else}}{{if .TARGETS}}{{.TARGETS}}
            {{else}}{{.BIOME_DEFAULT_TARGETS}}{{end}}{{end}}
          EXTRA_ARGS: >-
            {{if .EXTRA_ARGS_OVERRIDE}}{{.EXTRA_ARGS_OVERRIDE}}
            {{else}}{{if .EXTRA_ARGS}}{{.EXTRA_ARGS}}{{end}}{{end}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
      - echo "✅ biome fixes applied"

  fix:
    run: once
    desc: Alias for biome:check:write
    cmds:
      - task: check:write

  lint:
    run: once
    desc: Run Biome lint
    cmds:
      - task: config:skip
        vars:
          SKIP_SCOPE: lint
      - task: pnpm:exec
        vars:
          BINARY: biome
          ARGS: >-
            lint
            {{if .BIOME_INTERNAL_LINT_SKIP_PATTERN}}--config-path
            "{{.BIOME_INTERNAL_SKIP_CONFIG}}"
            {{else if .CONFIG_OVERRIDE}}--config-path "{{.CONFIG_OVERRIDE}}"
            {{else}}{{if .CONFIG}}--config-path "{{.CONFIG}}" {{end}}{{end}}
            {{if .BIOME_TARGETS_OVERRIDE}}{{.BIOME_TARGETS_OVERRIDE}}
            {{else}}{{if .TARGETS}}{{.TARGETS}}
            {{else}}{{.BIOME_DEFAULT_TARGETS}}{{end}}{{end}}
          EXTRA_ARGS: >-
            {{if .EXTRA_ARGS_OVERRIDE}}{{.EXTRA_ARGS_OVERRIDE}}
            {{else}}{{if .EXTRA_ARGS}}{{.EXTRA_ARGS}}{{end}}{{end}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
      - echo "✅ biome passed"

  lint:fix:
    run: once
    desc: Run Biome lint and write fixes
    cmds:
      - task: config:skip
        vars:
          SKIP_SCOPE: lint
      - task: pnpm:exec
        vars:
          BINARY: biome
          ARGS: >-
            lint --write
            {{if .BIOME_INTERNAL_LINT_SKIP_PATTERN}}--config-path
            "{{.BIOME_INTERNAL_SKIP_CONFIG}}"
            {{else if .CONFIG_OVERRIDE}}--config-path "{{.CONFIG_OVERRIDE}}"
            {{else}}{{if .CONFIG}}--config-path "{{.CONFIG}}" {{end}}{{end}}
            {{if .BIOME_TARGETS_OVERRIDE}}{{.BIOME_TARGETS_OVERRIDE}}
            {{else}}{{if .TARGETS}}{{.TARGETS}}
            {{else}}{{.BIOME_DEFAULT_TARGETS}}{{end}}{{end}}
          EXTRA_ARGS: >-
            {{if .EXTRA_ARGS_OVERRIDE}}{{.EXTRA_ARGS_OVERRIDE}}
            {{else}}{{if .EXTRA_ARGS}}{{.EXTRA_ARGS}}{{end}}{{end}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
      - echo "✅ biome fixes applied"

  fmt:check:
    run: once
    desc: Check formatting with Biome
    cmds:
      - task: config:skip
        vars:
          SKIP_SCOPE: fmt
      - task: pnpm:exec
        vars:
          BINARY: biome
          ARGS: >-
            format
            {{if .BIOME_INTERNAL_FMT_SKIP_PATTERN}}--config-path
            "{{.BIOME_INTERNAL_SKIP_CONFIG}}"
            {{else if .CONFIG_OVERRIDE}}--config-path "{{.CONFIG_OVERRIDE}}"
            {{else}}{{if .CONFIG}}--config-path "{{.CONFIG}}" {{end}}{{end}}
            {{if .BIOME_TARGETS_OVERRIDE}}{{.BIOME_TARGETS_OVERRIDE}}
            {{else}}{{if .TARGETS}}{{.TARGETS}}
            {{else}}{{.BIOME_DEFAULT_TARGETS}}{{end}}{{end}}
          EXTRA_ARGS: >-
            {{if .EXTRA_ARGS_OVERRIDE}}{{.EXTRA_ARGS_OVERRIDE}}
            {{else}}{{if .EXTRA_ARGS}}{{.EXTRA_ARGS}}{{end}}{{end}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}

  fmt:
    run: once
    desc: Format files with Biome
    cmds:
      - task: config:skip
        vars:
          SKIP_SCOPE: fmt
      - task: pnpm:exec
        vars:
          BINARY: biome
          ARGS: >-
            format --write
            {{if .BIOME_INTERNAL_FMT_SKIP_PATTERN}}--config-path
            "{{.BIOME_INTERNAL_SKIP_CONFIG}}"
            {{else if .CONFIG_OVERRIDE}}--config-path "{{.CONFIG_OVERRIDE}}"
            {{else}}{{if .CONFIG}}--config-path "{{.CONFIG}}" {{end}}{{end}}
            {{if .BIOME_TARGETS_OVERRIDE}}{{.BIOME_TARGETS_OVERRIDE}}
            {{else}}{{if .TARGETS}}{{.TARGETS}}
            {{else}}{{.BIOME_DEFAULT_TARGETS}}{{end}}{{end}}
          EXTRA_ARGS: >-
            {{if .EXTRA_ARGS_OVERRIDE}}{{.EXTRA_ARGS_OVERRIDE}}
            {{else}}{{if .EXTRA_ARGS}}{{.EXTRA_ARGS}}{{end}}{{end}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
      - echo "✅ biome fixes applied"

  ci:
    run: once
    desc: Run Biome CI checks
    cmds:
      - task: config:skip
        vars:
          SKIP_SCOPE: all
      - task: pnpm:exec
        vars:
          BINARY: biome
          ARGS: >-
            ci
            {{if .BIOME_INTERNAL_COMBINED_SKIP_PATTERN}}--config-path
            "{{.BIOME_INTERNAL_SKIP_CONFIG}}"
            {{else if .CONFIG_OVERRIDE}}--config-path "{{.CONFIG_OVERRIDE}}"
            {{else}}{{if .CONFIG}}--config-path "{{.CONFIG}}" {{end}}{{end}}
            {{if .BIOME_TARGETS_OVERRIDE}}{{.BIOME_TARGETS_OVERRIDE}}
            {{else}}{{if .TARGETS}}{{.TARGETS}}
            {{else}}{{.BIOME_DEFAULT_TARGETS}}{{end}}{{end}}
          EXTRA_ARGS: >-
            {{if .EXTRA_ARGS_OVERRIDE}}{{.EXTRA_ARGS_OVERRIDE}}
            {{else}}{{if .EXTRA_ARGS}}{{.EXTRA_ARGS}}{{end}}{{end}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
      - echo "✅ biome passed"

  cache:clean:
    run: once
    desc: Remove common Biome cache directories if present
    cmds:
      - if [ -d .cache/biome ]; then rm -rf .cache/biome; fi
      - if [ -d node_modules/.cache/biome ]; then rm -rf node_modules/.cache/biome; fi

  version:
    run: once
    desc: Show the locally resolved Biome version
    cmds:
      - task: pnpm:exec
        vars:
          BINARY: biome
          ARGS: "--version"

  help:
    run: once
    desc: Show Biome CLI help
    cmds:
      - task: pnpm:exec
        vars:
          BINARY: biome
          ARGS: "--help"
          EXTRA_ARGS: >-
            {{if .EXTRA_ARGS_OVERRIDE}}{{.EXTRA_ARGS_OVERRIDE}}
            {{- else}}{{.EXTRA_ARGS}}{{end}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}
