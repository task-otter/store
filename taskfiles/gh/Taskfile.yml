        platforms: [windows]

  _repo:clone:unix:
    run: once
    internal: true
    desc: Clone a repository on macOS or Linux
    summary: |
      When GH_PAT_TOKEN is set, embeds the token in the HTTPS URL for reliable
      authentication against private repos not owned by the caller.
      Falls back to gh repo clone when GH_PAT_TOKEN is absent.
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    env:
      GH_PAT: "{{.GH_PAT_TOKEN}}"
    cmds:
      - |
        {{.NIX_LOAD}}
        TARGET="{{if .OWNER}}{{.OWNER}}/{{end}}{{.REPO}}"
        DEST="{{if ne .GH_CLONE_DIR "."}}{{.GH_CLONE_DIR}}{{end}}"
        if [ -n "$GH_PAT" ]; then
          git clone "https://${GH_PAT}@github.com/${TARGET}.git"${DEST:+ "$DEST"}
        else
          gh repo clone "$TARGET"${DEST:+ "$DEST"}
        fi

  _repo:clone:windows:
    run: once
    internal: true
    desc: Clone a repository on Windows
    summary: |
      When GH_PAT_TOKEN is set, embeds the token in the HTTPS URL for reliable
      authentication against private repos not owned by the caller.
      Falls back to gh repo clone when GH_PAT_TOKEN is absent.
    platforms: [windows]
    env:
      GH_PAT: "{{.GH_PAT_TOKEN}}"
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "{{.WINGET_LOAD}}; \$target = '{{if .OWNER}}{{.OWNER}}/{{end}}{{.REPO}}';
        \$dest = '{{if ne .GH_CLONE_DIR "."}}{{.GH_CLONE_DIR}}{{end}}';
        \$args = @(\$dest) | Where-Object { \$_ };
        if (\$env:GH_PAT) { git clone \"https://\$env:GH_PAT@github.com/\$target.git\" @args }
        else { gh repo clone \$target @args }; exit \$LASTEXITCODE"

  _api:post:unix:
    run: once
    internal: true
    desc: POST to the GitHub API on macOS or Linux by piping DATA via stdin
    summary: Pipe DATA to gh api --method POST via printf on macOS or Linux.
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    env:
      GH_DATA: "{{.GH_DATA}}"
    cmds:
      - |
        {{.NIX_LOAD}}
        printf '%s' "$GH_DATA" | gh api --method POST {{.ENDPOINT}} --input -

  _api:post:windows:
    run: once
    internal: true
    desc: POST to the GitHub API on Windows by piping DATA via stdin
    summary: Pipe DATA to gh api --method POST via PowerShell on Windows.
    platforms: [windows]
    env:
      GH_DATA: "{{.GH_DATA}}"
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "{{.WINGET_LOAD}}; \$env:GH_DATA | gh api --method POST {{.ENDPOINT}} --input -; exit \$LASTEXITCODE"

  _api:patch:unix:
    run: once
    internal: true
    desc: PATCH the GitHub API on macOS or Linux by piping DATA via stdin
    summary: Pipe DATA to gh api --method PATCH via printf on macOS or Linux.
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    env:
      GH_DATA: "{{.GH_DATA}}"
    cmds:
      - |
        {{.NIX_LOAD}}
        printf '%s' "$GH_DATA" | gh api --method PATCH {{.ENDPOINT}} --input -

  _api:patch:windows:
    run: once
