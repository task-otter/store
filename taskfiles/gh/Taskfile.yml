---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml
  winget:
    taskfile: ../winget/Taskfile.yml

  jq: ../jq/Taskfile.yml

vars:
  GH_VISIBILITY: '{{.GH_VISIBILITY | default "public"}}'
  GH_BASE: '{{.GH_BASE | default "main"}}'
  GH_MERGE_METHOD: '{{.GH_MERGE_METHOD | default "merge"}}'
  GH_CLONE_DIR: '{{.GH_CLONE_DIR | default "."}}'
  GH_DOWNLOAD_DIR: '{{.GH_DOWNLOAD_DIR | default "."}}'
  GH_DATA: '{{.GH_DATA | default "{}"}}'
  GH_PAT_TOKEN: '{{.GH_PAT_TOKEN | default ""}}'
  GH_NIX_INSTALLABLE: '{{.GH_NIX_INSTALLABLE | default "nixpkgs#gh"}}'
  GH_WINGET_INSTALLABLE: '{{.GH_WINGET_INSTALLABLE | default "GitHub.cli"}}'

env:
  GH_TOKEN: "{{.GH_PAT_TOKEN}}"

tasks:
  default:
    run: once
    desc: Show available GitHub CLI automation tasks
    summary: Display the list of available gh-related tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install the GitHub CLI via Nix (Unix) or WinGet (Windows)
    summary: |
      Install gh on Linux and macOS via the user Nix profile, and on
      Windows via WinGet, when it is not already on PATH. Override
      GH_NIX_INSTALLABLE or GH_WINGET_INSTALLABLE to pin a
      different package or version.
    status:
      - command -v gh >/dev/null 2>&1
    cmds:
      - task: _install:unix
      - task: _install:windows

  _install:unix:
    internal: true
    platforms: [linux, darwin]
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.GH_NIX_INSTALLABLE}}"

  _install:windows:
    internal: true
    platforms: [windows]
    cmds:
      - task: winget:install:package
        vars:
          WINGET_INSTALLABLE: "{{.GH_WINGET_INSTALLABLE}}"

  version:
    run: once
    desc: Show the active GitHub CLI version
    summary: |
      Print the version reported by the gh binary resolved from PATH.
      Auto-installs the GitHub CLI if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  doctor:
    run: once
    desc: Run the GitHub CLI self-diagnostic check
    summary: |
      Run `gh doctor` to check your gh configuration, authentication,
      and network connectivity to GitHub.
    deps:
      - task: install
    cmds:
      - task: _doctor:unix
      - task: _doctor:windows

  which:
    run: once
    desc: Show the path to the GitHub CLI binary
    summary: Print the filesystem path of the gh binary resolved from PATH.
    deps:
      - task: install
    cmds:
      - task: _which:unix
      - task: _which:windows

  verify:
    run: once
    desc: Verify the GitHub CLI installation and authentication status
    summary: |
      Check that gh is installed, confirm `gh --version` runs cleanly,
      and report the current authentication status via `gh auth status`.
      Prints a clear message if the user is not yet authenticated.
    deps:
      - task: install
    cmds:
      - task: _verify:unix
      - task: _verify:windows

  help:
    run: once
    desc: Show the GitHub CLI built-in help
    summary: Display the built-in gh help output via `gh help`.
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh help'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh help; exit \$LASTEXITCODE"
        platforms: [windows]

  auth:login:
    run: once
    interactive: true
    desc: Authenticate with GitHub interactively
    summary: |
      Start an interactive GitHub authentication flow via `gh auth login`.
      Prompts for hostname, protocol, and authentication method.
      This task is interactive and requires a terminal.
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh auth login'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh auth login; exit \$LASTEXITCODE"
        platforms: [windows]

  auth:login:web:
    run: once
    interactive: true
    desc: Authenticate with GitHub using the web browser
    summary: |
      Authenticate with GitHub by opening a browser window for OAuth.
      Uses `gh auth login --web`. This task is interactive.
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh auth login --web'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh auth login --web; exit \$LASTEXITCODE"
        platforms: [windows]

  auth:login:ssh:
    run: once
    interactive: true
    desc: Authenticate with GitHub using SSH protocol
    summary: |
      Authenticate with GitHub using the SSH git protocol.
      Uses `gh auth login --git-protocol ssh`. This task is interactive.
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh auth login --git-protocol ssh'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh auth login --git-protocol ssh; exit \$LASTEXITCODE"
        platforms: [windows]

  auth:status:
    run: once
    desc: Show the current GitHub authentication status
    summary: |
      Display the current GitHub authentication status for all configured
      hosts via `gh auth status`.
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh auth status'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh auth status; exit \$LASTEXITCODE"
        platforms: [windows]

  auth:refresh:
    run: once
    interactive: true
    desc: Refresh the GitHub CLI authentication token
    summary: |
      Refresh the stored GitHub CLI credentials to extend their validity
      via `gh auth refresh`. This task is interactive.
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh auth refresh'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh auth refresh; exit \$LASTEXITCODE"
        platforms: [windows]

  auth:logout:
    run: once
    desc: Log out from GitHub and remove stored credentials
    summary: |
      Remove locally stored GitHub credentials via `gh auth logout`.
      You will need to re-authenticate with `task auth:login` afterwards.
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh auth logout'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh auth logout; exit \$LASTEXITCODE"
        platforms: [windows]

  auth:setup-git:
    run: once
    desc: Configure git to use the GitHub CLI as a credential helper
    summary: |
      Configure git to delegate GitHub authentication to gh via
      `gh auth setup-git`. This enables seamless HTTPS git operations.
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh auth setup-git'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh auth setup-git; exit \$LASTEXITCODE"
        platforms: [windows]

  repo:view:
    run: once
    desc: View a GitHub repository in the terminal or browser
    summary: |
      View repository details in the terminal. If REPO is set, views that
      specific repository (with optional OWNER prefix). Otherwise views the
      repository in the current working directory.
      Example: OWNER=github REPO=cli
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh repo view {{if .OWNER}}{{.OWNER}}/{{end}}{{.REPO}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh repo view {{if .OWNER}}{{.OWNER}}/{{end}}{{.REPO}}; exit \$LASTEXITCODE"
        platforms: [windows]

  repo:create:
    run: once
    desc: Create a new GitHub repository
    summary: |
      Create a new GitHub repository. Requires REPO to be set.
      VISIBILITY defaults to "public". Set DESCRIPTION for an optional description.
      Example: REPO=my-project GH_VISIBILITY=private DESCRIPTION="My project"
    requires:
      vars:
        - REPO
    deps:
      - task: install
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          gh repo create
          {{if .OWNER}}{{.OWNER}}/{{end}}{{.REPO}}
          --{{default "public" .GH_VISIBILITY}}
          {{if .DESCRIPTION}}--description "{{.DESCRIPTION}}"{{end}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}};
          gh repo create {{if .OWNER}}{{.OWNER}}/{{end}}{{.REPO}} --{{default "public" .GH_VISIBILITY}} {{if
          .DESCRIPTION}}--description '{{.DESCRIPTION}}'{{end}}
          ; exit \$LASTEXITCODE"
        platforms: [windows]

  repo:clone:
    run: once
    desc: Clone a GitHub repository to the local machine
    summary: |
      Clone a GitHub repository. Requires REPO to be set.
      Set OWNER to clone from a specific user or organisation.
      Set CLONE_DIR to specify the destination directory (defaults to ".").
      Set GH_PAT_TOKEN to access private repositories not owned by you — the
      token is embedded directly in the HTTPS clone URL for reliable CI auth.
      Requires OWNER when GH_PAT_TOKEN is set.
      Example: OWNER=github REPO=cli GH_CLONE_DIR=~/src/gh
      Private: OWNER=myorg REPO=private-repo GH_PAT_TOKEN=ghp_xxx
    requires:
      vars:
        - REPO
    deps:
      - task: install
    cmds:
      - task: _repo:clone:unix
      - task: _repo:clone:windows

  repo:fork:
    run: once
    desc: Fork a GitHub repository to your account
    summary: |
      Fork a GitHub repository. If REPO is set, forks that specific repo;
      otherwise forks the repository in the current working directory.
      Set GH_PAT_TOKEN to fork private repositories not owned by you.
      Example: OWNER=github REPO=cli
      Private: OWNER=myorg REPO=private-repo GH_PAT_TOKEN=ghp_xxx
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh repo fork {{if .OWNER}}{{.OWNER}}/{{end}}{{.REPO}} --clone'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh repo fork {{if .OWNER}}{{.OWNER}}/{{end}}{{.REPO}} --clone; exit \$LASTEXITCODE"
        platforms: [windows]

  repo:list:
    run: once
    desc: List GitHub repositories for the authenticated user or an owner
    summary: |
      List repositories for the authenticated user. Set OWNER to list
      repositories for a specific user or organisation instead.
      Example: OWNER=github
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh repo list {{.OWNER}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh repo list {{.OWNER}}; exit \$LASTEXITCODE"
        platforms: [windows]

  repo:sync:
    run: once
    desc: Sync the current repository branch with the upstream source
    summary: |
      Sync the current branch with its upstream source via `gh repo sync`.
      Optionally set BRANCH to sync a specific branch.
      Example: BRANCH=main
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh repo sync {{if .BRANCH}}--branch {{.BRANCH}}{{end}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh repo sync {{if .BRANCH}}--branch {{.BRANCH}}{{end}}; exit \$LASTEXITCODE"
        platforms: [windows]

  repo:archive:
    run: once
    desc: Archive a GitHub repository
    summary: |
      Archive a GitHub repository, making it read-only. Requires REPO.
      Set OWNER to target a specific user or organisation.
      Example: OWNER=myorg REPO=legacy-project
    requires:
      vars:
        - REPO
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh repo archive {{if .OWNER}}{{.OWNER}}/{{end}}{{.REPO}} --yes'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh repo archive {{if .OWNER}}{{.OWNER}}/{{end}}{{.REPO}} --yes; exit \$LASTEXITCODE"
        platforms: [windows]

  repo:delete:danger:
    run: once
    desc: Permanently delete a GitHub repository
    summary: |
      Permanently delete a GitHub repository. Requires REPO.
      All code, issues, pull requests, and history will be lost.
      This action is irreversible.
      Example: OWNER=myorg REPO=old-project
    requires:
      vars:
        - REPO
    prompt:
      - "This will permanently delete the repository {{if .OWNER}}{{.OWNER}}/{{end}}{{.REPO}}."
      - All code, issues, pull requests, and history will be permanently lost.
      - This action cannot be undone. Are you sure you want to continue?
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh repo delete {{if .OWNER}}{{.OWNER}}/{{end}}{{.REPO}} --yes'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh repo delete {{if .OWNER}}{{.OWNER}}/{{end}}{{.REPO}} --yes; exit \$LASTEXITCODE"
        platforms: [windows]

  pr:list:
    run: once
    desc: List open pull requests in the current repository
    summary: List open pull requests for the current repository via `gh pr list`.
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh pr list'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh pr list; exit \$LASTEXITCODE"
        platforms: [windows]

  pr:status:
    run: once
    desc: Show pull request status for the current branch
    summary: Display the status of pull requests related to the current branch via `gh pr status`.
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh pr status'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh pr status; exit \$LASTEXITCODE"
        platforms: [windows]

  pr:view:
    run: once
    desc: View a pull request in the terminal or browser
    summary: |
      View the pull request for the current branch, or the PR specified by
      PR_NUMBER. Example: PR_NUMBER=42
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh pr view {{.PR_NUMBER}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh pr view {{.PR_NUMBER}}; exit \$LASTEXITCODE"
        platforms: [windows]

  pr:create:
    run: once
    desc: Create a new pull request for the current branch
    summary: |
      Create a pull request interactively. Optionally set PR_TITLE, PR_BODY,
      BASE (default: main), and HEAD to pre-fill fields.
      Example: PR_TITLE="Add feature" GH_BASE=main
    deps:
      - task: install
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          gh pr create
          {{if .PR_TITLE}}--title "{{.PR_TITLE}}"{{end}}
          {{if .PR_BODY}}--body "{{.PR_BODY}}"{{end}}
          {{if .GH_BASE}}--base {{.GH_BASE}}{{end}}
          {{if .HEAD}}--head {{.HEAD}}{{end}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}};
          gh pr create {{if .PR_TITLE}}--title '{{.PR_TITLE}}'{{end}} {{if .PR_BODY}}--body '{{.PR_BODY}}'{{end}}
          {{if .GH_BASE}}--base {{.GH_BASE}}{{end}} {{if .HEAD}}--head {{.HEAD}}{{end}}
          ; exit \$LASTEXITCODE"
        platforms: [windows]

  pr:checkout:
    run: once
    desc: Check out a pull request branch locally
    summary: |
      Check out the branch for the pull request specified by PR_NUMBER.
      Requires PR_NUMBER. Example: PR_NUMBER=42
    requires:
      vars:
        - PR_NUMBER
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh pr checkout {{.PR_NUMBER}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh pr checkout {{.PR_NUMBER}}; exit \$LASTEXITCODE"
        platforms: [windows]

  pr:diff:
    run: once
    desc: Show the diff for a pull request
    summary: |
      Show the diff for the current branch's PR, or for PR_NUMBER.
      Example: PR_NUMBER=42
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh pr diff {{.PR_NUMBER}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh pr diff {{.PR_NUMBER}}; exit \$LASTEXITCODE"
        platforms: [windows]

  pr:review:
    run: once
    desc: Add a review to a pull request
    summary: |
      Open an interactive review for the current branch's PR, or for PR_NUMBER.
      Example: PR_NUMBER=42
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh pr review {{.PR_NUMBER}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh pr review {{.PR_NUMBER}}; exit \$LASTEXITCODE"
        platforms: [windows]

  pr:merge:
    run: once
    desc: Merge a pull request
    summary: |
      Merge the pull request specified by PR_NUMBER. MERGE_METHOD controls
      the merge strategy: merge (default), squash, or rebase.
      Requires PR_NUMBER. Example: PR_NUMBER=42 GH_MERGE_METHOD=squash
    requires:
      vars:
        - PR_NUMBER
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh pr merge {{.PR_NUMBER}} --{{default "merge" .GH_MERGE_METHOD}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh pr merge {{.PR_NUMBER}} --{{default "merge" .GH_MERGE_METHOD}}; exit \$LASTEXITCODE"
        platforms: [windows]

  pr:close:
    run: once
    desc: Close a pull request without merging
    summary: |
      Close the pull request specified by PR_NUMBER without merging.
      Requires PR_NUMBER. Example: PR_NUMBER=42
    requires:
      vars:
        - PR_NUMBER
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh pr close {{.PR_NUMBER}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh pr close {{.PR_NUMBER}}; exit \$LASTEXITCODE"
        platforms: [windows]

  pr:ready:
    run: once
    desc: Mark a draft pull request as ready for review
    summary: |
      Convert a draft PR to ready-for-review state.
      Optionally set PR_NUMBER; otherwise uses the current branch's PR.
      Example: PR_NUMBER=42
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh pr ready {{.PR_NUMBER}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh pr ready {{.PR_NUMBER}}; exit \$LASTEXITCODE"
        platforms: [windows]

  pr:comment:
    run: once
    desc: Add a comment to a pull request
    summary: |
      Post a comment on the pull request specified by PR_NUMBER.
      Requires PR_NUMBER and PR_BODY. Example: PR_NUMBER=42 PR_BODY="LGTM!"
    requires:
      vars:
        - PR_NUMBER
        - PR_BODY
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh pr comment {{.PR_NUMBER}} --body "{{.PR_BODY}}"'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh pr comment {{.PR_NUMBER}} --body '{{.PR_BODY}}'; exit \$LASTEXITCODE"
        platforms: [windows]

  issue:list:
    run: once
    desc: List open issues in the current repository
    summary: List open issues for the current repository via `gh issue list`.
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh issue list'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh issue list; exit \$LASTEXITCODE"
        platforms: [windows]

  issue:view:
    run: once
    desc: View an issue in the terminal or browser
    summary: |
      View the issue specified by ISSUE_NUMBER.
      Requires ISSUE_NUMBER. Example: ISSUE_NUMBER=10
    requires:
      vars:
        - ISSUE_NUMBER
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh issue view {{.ISSUE_NUMBER}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh issue view {{.ISSUE_NUMBER}}; exit \$LASTEXITCODE"
        platforms: [windows]

  issue:create:
    run: once
    desc: Create a new issue in the current repository
    summary: |
      Create an issue interactively. Optionally set ISSUE_TITLE and ISSUE_BODY
      to pre-fill fields. Example: ISSUE_TITLE="Bug report" ISSUE_BODY="..."
    deps:
      - task: install
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          gh issue create
          {{if .ISSUE_TITLE}}--title "{{.ISSUE_TITLE}}"{{end}}
          {{if .ISSUE_BODY}}--body "{{.ISSUE_BODY}}"{{end}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}};
          gh issue create {{if .ISSUE_TITLE}}--title '{{.ISSUE_TITLE}}'{{end}} {{if .ISSUE_BODY}}--body
          '{{.ISSUE_BODY}}'{{end}}
          ; exit \$LASTEXITCODE"
        platforms: [windows]

  issue:comment:
    run: once
    desc: Add a comment to an issue
    summary: |
      Post a comment on the issue specified by ISSUE_NUMBER.
      Requires ISSUE_NUMBER and ISSUE_BODY.
      Example: ISSUE_NUMBER=10 ISSUE_BODY="Thanks for the report!"
    requires:
      vars:
        - ISSUE_NUMBER
        - ISSUE_BODY
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh issue comment {{.ISSUE_NUMBER}} --body "{{.ISSUE_BODY}}"'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh issue comment {{.ISSUE_NUMBER}} --body '{{.ISSUE_BODY}}'; exit \$LASTEXITCODE"
        platforms: [windows]

  issue:close:
    run: once
    desc: Close an issue
    summary: |
      Close the issue specified by ISSUE_NUMBER.
      Requires ISSUE_NUMBER. Example: ISSUE_NUMBER=10
    requires:
      vars:
        - ISSUE_NUMBER
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh issue close {{.ISSUE_NUMBER}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh issue close {{.ISSUE_NUMBER}}; exit \$LASTEXITCODE"
        platforms: [windows]

  issue:reopen:
    run: once
    desc: Reopen a previously closed issue
    summary: |
      Reopen the issue specified by ISSUE_NUMBER.
      Requires ISSUE_NUMBER. Example: ISSUE_NUMBER=10
    requires:
      vars:
        - ISSUE_NUMBER
    deps:
      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh issue reopen {{.ISSUE_NUMBER}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
