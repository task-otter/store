  _version:windows:
    run: once
    internal: true
    desc: Show the gh version on Windows
    summary: Print the gh version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; if (Get-Command gh -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: The GitHub CLI is not installed or not available in PATH.
    cmds:
      - >-
