    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; command -v gh'

  _which:windows:
    run: once
    internal: true
    desc: Show the path to the gh binary on Windows
    summary: Print the filesystem path of the gh binary on Windows.
    platforms: [windows]
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "{{.WINGET_LOAD}}; (Get-Command gh).Source; exit \$LASTEXITCODE"

  _verify:unix:
    run: once
    internal: true
    desc: Verify gh installation and auth status on macOS or Linux
    summary: |
      Confirm gh is installed and gh --version works, then report the current
      authentication status. Prints a clear message if not authenticated.
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    cmds:
      - |
        {{.NIX_LOAD}}
        echo '=== gh binary ==='
        command -v gh
        echo ''
        echo '=== gh version ==='
        gh --version
        echo ''
        echo '=== gh auth status ==='
        gh auth status || echo 'Not authenticated. Run: task auth:login'

  _verify:windows:
    run: once
    internal: true
    desc: Verify gh installation and auth status on Windows
    summary: |
      Confirm gh is installed and gh --version works on Windows, then report
      the current authentication status.
    platforms: [windows]
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "{{.WINGET_LOAD}}; Write-Host '=== gh binary ==='; (Get-Command gh).Source;
        Write-Host ''; Write-Host '=== gh version ==='; gh --version;
        Write-Host ''; Write-Host '=== gh auth status ===';
        try { gh auth status }
        catch { Write-Host 'Not authenticated. Run: task auth:login' }; exit \$LASTEXITCODE"

  _secret:set:unix:
    run: once
    internal: true
    desc: Set a GitHub Actions secret on macOS or Linux via stdin
    summary: |
      Pipe the secret value via stdin to avoid exposure in the process list.
      Reads SECRET_VALUE from the task environment.
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    env:
      GH_SECRET_VALUE: "{{.SECRET_VALUE}}"
    cmds:
      - >-
        {{.NIX_LOAD}};
        printf '%s' "$GH_SECRET_VALUE" | gh secret set {{.SECRET_NAME}} --body -
        {{if .ENVIRONMENT}}--env {{.ENVIRONMENT}}{{end}}

  _secret:set:windows:
    run: once
    internal: true
    desc: Set a GitHub Actions secret on Windows via stdin
    summary: |
      Pipe the secret value via PowerShell stdin to avoid exposure in the
      process list. Reads SECRET_VALUE from the task environment.
    platforms: [windows]
    env:
