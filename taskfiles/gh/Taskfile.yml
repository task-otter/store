      - task: install
    cmds:
      - cmd: bash -lc '{{.NIX_LOAD}}; gh api --method DELETE {{.ENDPOINT}}'
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "{{.WINGET_LOAD}}; gh api --method DELETE {{.ENDPOINT}}; exit \$LASTEXITCODE"
