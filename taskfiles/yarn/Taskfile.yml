---
version: "3.5"

output:

  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:

  nodejs:
    taskfile: ../nodejs/Taskfile.yml

  nix:
    taskfile: ../nix/Taskfile.yml

vars:

  YARN_NIX_INSTALLABLE: nixpkgs#yarn

tasks:
  install:tool:
    run: once
    desc: Install Yarn via the Nix profile
    summary: |
      Install Yarn into the user Nix profile when it is not already
      available on PATH. Override the YARN_NIX_INSTALLABLE
      variable to pin a different package or version.
    status:
      - bash -lc '{{.NIX_LOAD}}; command -v yarn >/dev/null 2>&1'
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.YARN_NIX_INSTALLABLE}}"

  version:tool:
    run: once
    desc: Show the active Yarn version
    summary: |
      Print the version reported by the yarn binary resolved from PATH.
      Auto-installs Yarn if missing.
    deps:
      - task: install:tool
    cmds:
      - task: _version:tool:unix
      - task: _version:tool:windows

  default:
    run: once
    desc: Show available Yarn automation tasks
    summary: Display the list of available Yarn-related tasks defined in this Taskfile.
    cmds:
      - task --list

  version:
    run: once
    desc: Show the active Node.js and Yarn versions
    summary: Print the Node.js and Yarn versions after loading the selected Node.js runtime.
    cmds:
      - task: _version:unix
      - task: _version:windows

  install:
    run: once
    desc: Install project dependencies with yarn install
    summary: Install dependencies from package.json using the Yarn version available to the project.
    cmds:
      - task: _yarn:unix
        vars: { ARGS: install --silent }
      - task: _yarn:windows
        vars: { ARGS: install --silent }

  install:clean:
    run: once
    desc: Clean install project dependencies from the lockfile
    summary: Run yarn install --immutable (install:clean) and fail if Yarn would modify yarn.lock.
    cmds:
      - task: _install:clean:unix
      - task: _install:clean:windows

  ci:fix:
    run: once
    desc: Format source files with Yarn
    summary: Execute the format script defined in package.json through yarn run format.
    cmds:
      - task: _yarn:unix
        vars: { ARGS: run format }
      - task: _yarn:windows
        vars: { ARGS: run format }

  add:
    run: once
    desc: Install packages as local devDependencies with Yarn (PACKAGES=<pkgs>)
    summary: |
      Install PACKAGES as local devDependencies via yarn add -D.
      Pass EXTRA_ARGS for additional Yarn flags.
    requires:
      vars: [PACKAGES]
    cmds:
      - task: _yarn:unix
        vars:
          ARGS: "add -D --silent {{.PACKAGES}} {{.EXTRA_ARGS}}"
      - task: _yarn:windows
        vars:
          ARGS: "add -D --silent {{.PACKAGES}} {{.EXTRA_ARGS}}"

  remove:
    run: once
    desc: Remove local packages with Yarn (PACKAGES=<pkgs>)
    summary: |
      Remove PACKAGES from the local project via yarn remove.
      Pass EXTRA_ARGS for additional Yarn flags.
    requires:
      vars: [PACKAGES]
    cmds:
      - task: _yarn:unix
        vars:
          ARGS: "remove --silent {{.PACKAGES}} {{.EXTRA_ARGS}}"
      - task: _yarn:windows
        vars:
          ARGS: "remove --silent {{.PACKAGES}} {{.EXTRA_ARGS}}"

  install:undo:
    run: once
    desc: Explain how to remove yarn from the Nix profile
    summary: |
      yarn is installed via nix profile. Remove with nix profile remove or
      override YARN_NIX_INSTALLABLE.
    cmds:
      - echo 'yarn is installed via nix profile.'
      - "echo 'Remove with nix profile remove or reinstall via YARN_NIX_INSTALLABLE.'"

  upgrade:
    run: once
    desc: Upgrade yarn via the Nix profile
    summary: Reinstall yarn using YARN_NIX_INSTALLABLE (default nixpkgs#yarn).
    cmds:
      - task: install:tool

  exec:
    run: once
    desc: Execute a global binary via Yarn (BINARY=<name>)
    requires:
      vars: [BINARY]
    cmds:
      - task: _exec:unix
        vars:
          BINARY: "{{.BINARY}}"
          ARGS: "{{.ARGS}}"
          EXTRA_ARGS: "{{.EXTRA_ARGS}}"
      - task: _exec:windows
        vars:
          BINARY: "{{.BINARY}}"
          ARGS: "{{.ARGS}}"
          EXTRA_ARGS: "{{.EXTRA_ARGS}}"

  run:
    run: once
    desc: Run a package.json script with Yarn
    summary: Run SCRIPT through yarn run and forward arguments passed after -- to that script.
    requires:
      vars: [SCRIPT]
    cmds:
      - task: _run:unix
        vars:
          SCRIPT: "{{.SCRIPT}}"
          CLI_ARGS: "{{.CLI_ARGS}}"
      - task: _run:windows
        vars:
          SCRIPT: "{{.SCRIPT}}"
          CLI_ARGS: "{{.CLI_ARGS}}"

  dev:
    run: once
    desc: Start the development script with Yarn
    summary: Execute the dev script defined in package.json through yarn run dev.
    cmds:
      - task: _yarn:unix
        vars: { ARGS: run dev }
      - task: _yarn:windows
        vars: { ARGS: run dev }

  test:
    run: once
    desc: Run the project test script with Yarn
    summary: Execute the test script defined in package.json through yarn test.
    cmds:
      - task: _yarn:unix
        vars: { ARGS: test }
      - task: _yarn:windows
        vars: { ARGS: test }

  build:
    run: once
    desc: Build the project with Yarn
    summary: Execute the build script defined in package.json through yarn run build.
    cmds:
      - task: _yarn:unix
        vars: { ARGS: run build }
      - task: _yarn:windows
        vars: { ARGS: run build }

  lint:
    run: once
    desc: Lint the project with Yarn
    summary: Execute the lint script defined in package.json through yarn run lint.
    cmds:
      - task: _yarn:unix
        vars: { ARGS: run lint }
      - task: _yarn:windows
        vars: { ARGS: run lint }

  typecheck:
    run: once
    desc: Type check the project with Yarn
    summary: Execute the typecheck script defined in package.json through yarn run typecheck.
    cmds:
      - task: _yarn:unix
        vars: { ARGS: run typecheck }
      - task: _yarn:windows
        vars: { ARGS: run typecheck }

  update:
    run: once
    desc: Update dependencies with yarn up
    summary: Run yarn up against all dependency patterns to update project resolutions with modern Yarn.
    cmds:
      - task: _yarn:unix
        vars: { ARGS: "up '*'" }
      - task: _yarn:windows
        vars: { ARGS: "up '*'" }

  audit:
    run: once
    desc: Run a Yarn vulnerability audit
    summary: Run yarn npm audit and propagate vulnerability findings for CI enforcement.
    cmds:
      - task: _yarn:unix
        vars: { ARGS: npm audit }
      - task: _yarn:windows
        vars: { ARGS: npm audit }

  audit:report:
    run: once
    desc: Report Yarn audit findings without failing
    summary: Run yarn npm audit for local review while ignoring its vulnerability exit code.
    cmds:
      - task: _yarn:unix
        vars: { ARGS: npm audit }
        ignore_error: true
      - task: _yarn:windows
        vars: { ARGS: npm audit }
        ignore_error: true

  audit:json:
    run: once
    desc: Output Yarn audit findings as JSON
    summary: Run yarn npm audit --json for tooling and propagate the Yarn audit exit code.
    cmds:
      - task: _yarn:unix
        vars: { ARGS: npm audit --json }
      - task: _yarn:windows
        vars: { ARGS: npm audit --json }

  cache:clean:
    run: once
    desc: Clear the Yarn cache
    summary: Run yarn cache clean to remove Yarn cache entries available to the active project.
    cmds:
      - task: _yarn:unix
        vars: { ARGS: cache clean }
      - task: _yarn:windows
        vars: { ARGS: cache clean }

  clean:
    run: once
    desc: Remove the node_modules directory
    summary: Delete node_modules when the project uses a node_modules Yarn linker.
    prompt:
      - This will delete the node_modules directory.
      - Continue?
    cmds:
      - task: _clean:unix
      - task: _clean:windows

  clean:all:
    run: once
    desc: Remove node_modules and yarn.lock
    summary: Delete node_modules and yarn.lock so a later Yarn install regenerates the lockfile.
    prompt:
      - "WARNING: This will permanently delete node_modules AND yarn.lock."
      - Continue?
    cmds:
      - task: _clean:all:unix
      - task: _clean:all:windows

  _yarn:unix:
    run: when_changed
    internal: true
    platforms: [linux, darwin]
    dir: "{{.USER_WORKING_DIR}}"
    set: [errexit, nounset, pipefail]
    requires:
      vars:
        - ARGS
    env:
      CI: "1"
    deps:
      - task: nodejs:install
      - task: install:tool
    preconditions:
      - sh: 'test -f "{{.USER_WORKING_DIR}}/package.json"'
        msg: "package.json not found. Run this task from the project root."
    cmds:
      - bash -lc '{{.NIX_LOAD}}; yarn {{.ARGS}}'

  _yarn:windows:
    run: when_changed
    internal: true
    platforms: [windows]
    dir: "{{.USER_WORKING_DIR}}"
    requires:
      vars:
        - ARGS
    env:
      CI: "1"
    deps:
      - task: nodejs:install
      - task: install:tool
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Test-Path '{{.USER_WORKING_DIR}}/package.json') { exit 0 } else { exit 1 }"
        msg: "package.json not found. Run this task from the project root."
    cmds:
      - >-
        powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command
        "$ErrorActionPreference = 'Stop'; $env:CI = '1'; yarn {{.ARGS}}"

  _install:clean:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    preconditions:
      - sh: 'test -f "{{.USER_WORKING_DIR}}/yarn.lock"'
        msg: "yarn.lock not found. yarn install:clean requires a lockfile."
    cmds:
      - task: _yarn:unix
        vars: { ARGS: install --immutable --silent }

  _install:clean:windows:
    run: once
    internal: true
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Test-Path '{{.USER_WORKING_DIR}}\yarn.lock') { exit 0 } else { exit 1 }"
        msg: "yarn.lock not found. yarn install:clean requires a lockfile."
    cmds:
      - task: _yarn:windows
        vars: { ARGS: install --immutable --silent }

  _run:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    env:
      SCRIPT: "{{.SCRIPT}}"
    preconditions:
      - sh: 'printf "%s" "$SCRIPT" | grep -qE "^[A-Za-z0-9:_-]+$"'
        msg: 'SCRIPT "{{.SCRIPT}}" contains invalid characters.'
    cmds:
      - task: _yarn:unix
        vars:
          ARGS: "run {{.SCRIPT}}{{if .CLI_ARGS}} -- {{.CLI_ARGS}}{{end}}"

  _run:windows:
    run: once
    internal: true
    platforms: [windows]
    env:
      SCRIPT: "{{.SCRIPT}}"
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if ($env:SCRIPT -match '^[A-Za-z0-9:_-]+$') { exit 0 } else { exit 1 }"
        msg: 'SCRIPT "{{.SCRIPT}}" contains invalid characters.'
    cmds:
      - task: _yarn:windows
        vars:
          ARGS: "run {{.SCRIPT}}{{if .CLI_ARGS}} -- {{.CLI_ARGS}}{{end}}"

  _version:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    set: [errexit, nounset, pipefail]
    deps:
      - task: nodejs:install
      - task: install:tool
    cmds:
      - bash -lc '{{.NIX_LOAD}}; node --version; yarn --version'

  _version:windows:
    run: once
    internal: true
    platforms: [windows]
    deps:
      - task: nodejs:install
      - task: install:tool
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -Command "node --version; yarn --version"

  _clean:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    dir: "{{.USER_WORKING_DIR}}"
    status: ["test ! -d node_modules"]
    cmds:
      - rm -rf node_modules

  _clean:windows:
    run: once
    internal: true
    platforms: [windows]
    dir: "{{.USER_WORKING_DIR}}"
    status:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "if (Test-Path 'node_modules') { exit 1 } else { exit 0 }"
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -Command "Remove-Item -Recurse -Force 'node_modules'"

  _exec:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    dir: "{{.USER_WORKING_DIR}}"
    set: [errexit, nounset, pipefail]
    requires:
      vars: [BINARY]
    cmds:
      - bash -c "{{.BINARY}} {{.ARGS}} {{.EXTRA_ARGS}}"

  _exec:windows:
    run: once
    internal: true
    platforms: [windows]
    dir: "{{.USER_WORKING_DIR}}"
    requires:
      vars: [BINARY]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -Command "& {{.BINARY}} {{.ARGS}} {{.EXTRA_ARGS}}"

  _clean:all:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - rm -rf node_modules
      - rm -f yarn.lock

  _clean:all:windows:
    run: once
    internal: true
    platforms: [windows]
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "if (Test-Path 'node_modules') { Remove-Item -Recurse -Force 'node_modules' };
        if (Test-Path 'yarn.lock') { Remove-Item -Force 'yarn.lock' }"

  _version:tool:unix:
    run: once
    internal: true
    desc: Show Yarn version on macOS or Linux
    summary: Print the yarn version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; yarn --version'

  _version:tool:windows:
    run: once
    internal: true
    desc: Show Yarn version on Windows
    summary: Print the yarn version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command "if (Get-Command yarn -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: Yarn is not installed or not available in PATH.
    cmds:
      - yarn --version
