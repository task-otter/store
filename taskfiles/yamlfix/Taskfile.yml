---
version: "3.5"
output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false
silent: true
includes:
  nix:
    taskfile: ../nix/Taskfile.yml
vars:
  YAMLFIX_FMT_SKIP_PATTERN: ""
  YAMLFIX_NIX_INSTALLABLE: nixpkgs#yamlfix
  YAMLFIX_TARGETS: "."
  YAMLFIX_EXTRA_ARGS: ""
tasks:
  default:
    run: once
    desc: Show available yamlfix automation tasks
    summary: Display the list of available yamlfix-related tasks defined in this Taskfile.
    cmds:
      - task --list
  ci:fix:
    run: once
    dir: "{{.USER_WORKING_DIR}}"
    desc: Auto-fix YAML files with yamlfix (YAMLFIX_TARGETS=path)
    summary: |
      Run yamlfix against YAML files found under YAMLFIX_TARGETS (default .). Excludes
      Taskfile.yml files whose Go template syntax is incompatible with yamlfix.
      Pass YAMLFIX_EXTRA_ARGS for additional flags. Auto-installs yamlfix if missing.
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.YAMLFIX_NIX_INSTALLABLE}}"
    vars:
      YAMLFIX_TARGETS: "."
      YAMLFIX_EXTRA_ARGS: ""
    cmds:
      - >-
        bash -lc '{{.NIX_LOAD}}; _t="{{if .YAMLFIX_TARGETS_OVERRIDE}}{{.YAMLFIX_TARGETS_OVERRIDE}}{{else if
        .YAMLFIX_TARGETS}}{{.YAMLFIX_TARGETS}}{{else}}.{{end}}"; [ -d "$_t" ] || _t="."; find "$_t" \( -name "*.yml"
        -o -name "*.yaml"
        \) ! -name "Taskfile.yml" ! -name "Taskfile.yaml" -print0 | xargs -0 yamlfix {{if
        .YAMLFIX_FMT_SKIP_PATTERN_OVERRIDE}}--exclude "{{.YAMLFIX_FMT_SKIP_PATTERN_OVERRIDE}}" {{else if
        .YAMLFIX_FMT_SKIP_PATTERN}}--exclude "{{.YAMLFIX_FMT_SKIP_PATTERN}}" {{end}} {{if
        .YAMLFIX_EXTRA_ARGS_OVERRIDE}}{{.YAMLFIX_EXTRA_ARGS_OVERRIDE}}{{else}}{{.YAMLFIX_EXTRA_ARGS}}{{end}}'
