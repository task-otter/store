---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  pnpm:
    taskfile: ../../../pnpm/Taskfile.yml

vars:
  KNIP_LINT_SKIP_PATTERN: ""
  KNIP_EXTRA_ARGS: ""
  KNIP_CONFIG: ""
  KNIP_VERSION: ""
  KNIP_INTERNAL_SKIP_CONFIG: ".taskotter-knip-pnpm-skip.json"
  KNIP_INTERNAL_JS_RUNTIME: "node"

tasks:
  default:
    run: once
    desc: Show available Knip tasks
    cmds:
      - task --list

  install:
    run: once
    dir: "{{.USER_WORKING_DIR}}"
    desc: Install Knip as a local devDependency
    summary: |
      Install knip as a local devDependency. Pass KNIP_VERSION=x.y.z to pin a
      specific release instead of the package manager's default resolution.
    status:
      - >-
        node -e "const installed = require('./node_modules/knip/package.json');
        const requested = '{{.RESOLVED_VERSION}}';
        process.exit(!requested || installed.version === requested ? 0 : 1)"
    vars:
      RESOLVED_VERSION: '{{default .KNIP_VERSION .KNIP_VERSION_OVERRIDE}}'
    cmds:
      - task: pnpm:add
        vars:
          PACKAGES: 'knip{{if .RESOLVED_VERSION}}@{{.RESOLVED_VERSION}}{{end}}'
          EXTRA_ARGS: '{{default .KNIP_EXTRA_ARGS .KNIP_EXTRA_ARGS_OVERRIDE}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}'

  install:undo:
    run: once
    desc: Remove the locally installed Knip devDependency
    summary: Remove knip from local devDependencies via the active package manager.
    prompt:
      - This will remove knip from local devDependencies.
      - Continue?
    cmds:
      - task: pnpm:remove
        vars:
          PACKAGES: knip
          EXTRA_ARGS: '{{default .KNIP_EXTRA_ARGS .KNIP_EXTRA_ARGS_OVERRIDE}}'

  upgrade:
    run: once
    desc: Upgrade Knip to the latest release
    summary: Reinstall knip at the latest version as a local devDependency.
    cmds:
      - task: pnpm:add
        vars:
          PACKAGES: knip@latest
          EXTRA_ARGS: '{{default .KNIP_EXTRA_ARGS .KNIP_EXTRA_ARGS_OVERRIDE}}'

  config:init:
    run: once
    dir: "{{.USER_WORKING_DIR}}"
    desc: Create a starter knip.json configuration file
    summary: |
      Knip has no scaffolding command, so this writes a minimal knip.json that
      references the Knip JSON schema. Knip auto-detects entry points and
      project files by default; edit knip.json to customize. Skipped when a
      knip.json or knip.jsonc already exists.
    status:
      - test -f knip.json || test -f knip.jsonc
    cmds:
      - >-
        printf '%s\n' '{' '  "$schema": "https://unpkg.com/knip@5/schema.json"' '}' > knip.json
      - echo "✅ created knip.json"

  config:skip:
    desc: Write a Knip config overlay that ignores the skip pattern
    summary: |
      Generate a Knip config that merges the project config with
      KNIP_LINT_SKIP_PATTERN appended to its ignore array. Every analysis task
      runs this first. The overlay is rewritten on every run and is not removed
      afterwards, so add it to .gitignore. Running with no skip pattern set
      deletes it. Dynamic JS/TS Knip configs cannot be merged and are rejected.
    dir: "{{.USER_WORKING_DIR}}"
    set: [errexit, nounset, pipefail]
    vars:
      RESOLVED_SKIP: '{{default .KNIP_LINT_SKIP_PATTERN .KNIP_LINT_SKIP_PATTERN_OVERRIDE}}'
      RESOLVED_CONFIG: '{{default .KNIP_CONFIG .KNIP_CONFIG_OVERRIDE}}'
    env:
      KNIP_SKIP_PATTERN: "{{.RESOLVED_SKIP}}"
      KNIP_SKIP_SOURCE_CONFIG: "{{.RESOLVED_CONFIG}}"
      KNIP_SKIP_OUTPUT: "{{.KNIP_INTERNAL_SKIP_CONFIG}}"
      KNIP_SKIP_JS_RUNTIME: "{{.KNIP_INTERNAL_JS_RUNTIME}}"
    cmds:
      - cmd: |
          pattern="$KNIP_SKIP_PATTERN"
          source_config="$KNIP_SKIP_SOURCE_CONFIG"
          output="$KNIP_SKIP_OUTPUT"

          # Nothing to skip: drop the overlay a previous run left behind so the
          # next task falls back to the project config instead of a stale one.
          if [[ -z "$pattern" ]]; then
            rm -f "$output"
            exit 0
          fi

          discover_config() {
            local candidate
            for candidate in "$@"; do
              if [[ -f "$candidate" ]]; then
                printf '%s' "$candidate"
                return
              fi
            done
          }

          if [[ -z "$source_config" ]]; then
            source_config="$(discover_config \
              knip.json knip.jsonc .knip.json .knip.jsonc \
              knip.ts knip.js knip.config.ts knip.config.js \
              knip.config.mjs knip.config.cjs package.json || true)"
          fi
          case "${source_config##*.}" in
            js|mjs|cjs|ts)
              printf '%s\n' \
                'KNIP_LINT_SKIP_PATTERN cannot be merged with a dynamic JS/TS Knip config.' \
                'Add the skip pattern to the config ignore array or use JSON/JSONC.' >&2
              exit 2
              ;;
          esac
          export KNIP_SKIP_SOURCE_CONFIG="$source_config"
          "$KNIP_SKIP_JS_RUNTIME" -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const parseJsonc = source => {
              let output = "", inString = false, escaped = false;
              let lineComment = false, blockComment = false;
              for (let index = 0; index < source.length; index += 1) {
                const character = source[index], next = source[index + 1];
                if (lineComment) {
                  if (character === "\n") { lineComment = false; output += character; }
                  continue;
                }
                if (blockComment) {
                  if (character === "*" && next === "/") { blockComment = false; index += 1; }
                  continue;
                }
                if (!inString && character === "/" && next === "/") { lineComment = true; index += 1; continue; }
                if (!inString && character === "/" && next === "*") { blockComment = true; index += 1; continue; }
                output += character;
                if (inString) {
                  if (escaped) escaped = false;
                  else if (character === "\\") escaped = true;
                  else if (character === "\"") inString = false;
                } else if (character === "\"") inString = true;
              }
              return JSON.parse(output.replace(/,\s*([}\]])/g, "$1"));
            };
            const sourcePath = process.env.KNIP_SKIP_SOURCE_CONFIG;
            let config = {};
            if (sourcePath) {
              const parsed = parseJsonc(fs.readFileSync(sourcePath, "utf8"));
              config = path.basename(sourcePath) === "package.json" ? (parsed.knip ?? {}) : parsed;
            }
            const pattern = process.env.KNIP_SKIP_PATTERN.replaceAll("\\", "/");
            config = { ...config, ignore: [...(config.ignore ?? []), pattern] };
            fs.writeFileSync(process.env.KNIP_SKIP_OUTPUT, JSON.stringify(config, null, 2) + "\n");
          '
        platforms: [linux, darwin]
      - cmd: |
          powershell -NoProfile -ExecutionPolicy Bypass -Command - <<'POWERSHELL'
          $ErrorActionPreference = 'Stop'
          $pattern = $env:KNIP_SKIP_PATTERN
          $sourceConfig = $env:KNIP_SKIP_SOURCE_CONFIG
          $output = $env:KNIP_SKIP_OUTPUT

          if ([string]::IsNullOrWhiteSpace($pattern)) {
              Remove-Item -LiteralPath $output -Force -ErrorAction SilentlyContinue
              exit 0
          }

          function Find-Config([string[]]$candidates) {
              foreach ($candidate in $candidates) {
                  if (Test-Path -LiteralPath $candidate -PathType Leaf) { return $candidate }
              }
              return ''
          }

          if ([string]::IsNullOrWhiteSpace($sourceConfig)) {
              $sourceConfig = Find-Config @(
                  'knip.json', 'knip.jsonc', '.knip.json', '.knip.jsonc',
                  'knip.ts', 'knip.js', 'knip.config.ts', 'knip.config.js',
                  'knip.config.mjs', 'knip.config.cjs', 'package.json'
              )
          }
          if ($sourceConfig -match '\.(?:[cm]?js|ts)$') {
              Write-Error (
                  'KNIP_LINT_SKIP_PATTERN cannot be merged with a dynamic JS/TS Knip config. ' +
                  'Add the skip pattern to the config ignore array or use JSON/JSONC.'
              )
              exit 2
          }
          $env:KNIP_SKIP_SOURCE_CONFIG = $sourceConfig
          $code = @'
          const fs = require("node:fs");
          const path = require("node:path");
          const parseJsonc = source => {
            let output = "", inString = false, escaped = false;
            let lineComment = false, blockComment = false;
            for (let index = 0; index < source.length; index += 1) {
              const character = source[index], next = source[index + 1];
              if (lineComment) {
                if (character === "\n") { lineComment = false; output += character; }
                continue;
              }
              if (blockComment) {
                if (character === "*" && next === "/") { blockComment = false; index += 1; }
                continue;
              }
              if (!inString && character === "/" && next === "/") {
                lineComment = true; index += 1; continue;
              }
              if (!inString && character === "/" && next === "*") {
                blockComment = true; index += 1; continue;
              }
              output += character;
              if (inString) {
                if (escaped) escaped = false;
                else if (character === "\\") escaped = true;
                else if (character === "\"") inString = false;
              } else if (character === "\"") inString = true;
            }
            return JSON.parse(output.replace(/,\s*([}\]])/g, "$1"));
          };
          const sourcePath = process.env.KNIP_SKIP_SOURCE_CONFIG;
          let config = {};
          if (sourcePath) {
            const parsed = parseJsonc(fs.readFileSync(sourcePath, "utf8"));
            config = path.basename(sourcePath) === "package.json" ? (parsed.knip ?? {}) : parsed;
          }
          const pattern = process.env.KNIP_SKIP_PATTERN.replaceAll("\\", "/");
          config = { ...config, ignore: [...(config.ignore ?? []), pattern] };
          fs.writeFileSync(process.env.KNIP_SKIP_OUTPUT, JSON.stringify(config, null, 2) + "\n");
          '@
          & $env:KNIP_SKIP_JS_RUNTIME -e $code
          exit $LASTEXITCODE
          POWERSHELL
        platforms: [windows]

  # Shared implementation of every analysis task. Each override is resolved
  # exactly once here; callers supply only the mode flag.
  _run:
    internal: true
    run: when_changed
    vars:
      RESOLVED_SKIP: '{{default .KNIP_LINT_SKIP_PATTERN .KNIP_LINT_SKIP_PATTERN_OVERRIDE}}'
      RESOLVED_CONFIG: '{{default .KNIP_CONFIG .KNIP_CONFIG_OVERRIDE}}'
    cmds:
      - task: config:skip
      - task: pnpm:exec
        vars:
          BINARY: knip
          ARGS: >-
            {{if .MODE}}{{.MODE}} {{end}}
            {{- if .RESOLVED_SKIP}}--config "{{.KNIP_INTERNAL_SKIP_CONFIG}}"
            {{- else if .RESOLVED_CONFIG}}--config "{{.RESOLVED_CONFIG}}"{{end}}
          EXTRA_ARGS: '{{default .KNIP_EXTRA_ARGS .KNIP_EXTRA_ARGS_OVERRIDE}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}'

  production:
    run: once
    desc: Run Knip against production dependency usage
    summary: Knip may report framework-specific false positives; review results before deleting files or dependencies.
    cmds:
      - task: _run
        vars:
          MODE: "--production"

  dependencies:
    run: once
    desc: Report unused production dependencies with Knip
    summary: Review Knip dependency results before removing packages.
    cmds:
      - task: _run
        vars:
          MODE: "--dependencies"

  dev-dependencies:
    run: once
    desc: Report unused development dependencies with Knip
    summary: Review Knip dependency results before removing packages.
    cmds:
      - task: _run
        vars:
          MODE: "--devDependencies"

  files:
    run: once
    desc: Report unused files with Knip
    summary: Review Knip file results before deleting files.
    cmds:
      - task: _run
        vars:
          MODE: "--files"

  exports:
    run: once
    desc: Report unused exports with Knip
    summary: Review Knip export results before deleting code.
    cmds:
      - task: _run
        vars:
          MODE: "--exports"

  ci:fix:
    run: once
    desc: Run Knip fix mode when supported by the installed version
    summary: Knip fixes can update project files; dependency removals should still be reviewed manually.
    cmds:
      - task: _run
        vars:
          MODE: "--fix"

  ci:
    run: once
    desc: Run Knip production checks for CI
    summary: Knip may report framework-specific false positives; tune configuration before enforcing broadly.
    cmds:
      - task: _run
        vars:
          MODE: "--production"
      - echo "✅ knip passed"

  version:
    run: once
    desc: Show the locally resolved Knip version
    cmds:
      - task: pnpm:exec
        vars:
          PM: '{{default .PM .PM_OVERRIDE}}'
          BINARY: knip
          ARGS: "--version"

  help:
    run: once
    desc: Show Knip CLI help
    cmds:
      - task: pnpm:exec
        vars:
          BINARY: knip
          ARGS: "--help"
          EXTRA_ARGS: '{{default .KNIP_EXTRA_ARGS .KNIP_EXTRA_ARGS_OVERRIDE}}{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}'
