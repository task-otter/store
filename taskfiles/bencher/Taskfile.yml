---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml

vars:
  BENCHER_NIX_INSTALLABLE: nixpkgs#bencher
  BENCHER_EXTRA_ARGS: ""

tasks:
  default:
    run: once
    desc: Show available Bencher CLI automation tasks
    summary: Display the list of available Bencher CLI-related tasks defined in this Taskfile.
    cmds:
      - task --list

  run:
    run: once
    desc: Track benchmarks with bencher run (BENCHER_EXTRA_ARGS or -- args)
    summary: |
      Run bencher run to execute a benchmark command and track its results.
      Pass the benchmark command and flags via BENCHER_EXTRA_ARGS or after --, e.g.
      task bencher:run -- --project my-project "make benchmarks".
      Auto-installs the CLI if it is missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.BENCHER_NIX_INSTALLABLE}}"
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          bencher run
          {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{if .BENCHER_EXTRA_ARGS_OVERRIDE}}{{.BENCHER_EXTRA_ARGS_OVERRIDE}}
          {{- else}}{{.BENCHER_EXTRA_ARGS}}{{end}}{{end}}'
        platforms: [linux, darwin]
      - cmd: >-
          bencher run
          {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{if .BENCHER_EXTRA_ARGS_OVERRIDE}}{{.BENCHER_EXTRA_ARGS_OVERRIDE}}
          {{- else}}{{.BENCHER_EXTRA_ARGS}}{{end}}{{end}}
        platforms: [windows]

  exec:
    run: once
    desc: Run any Bencher CLI subcommand (BENCHER_EXTRA_ARGS or -- args)
    summary: |
      Run an arbitrary bencher subcommand such as mock, project, or report.
      Pass the subcommand and its arguments via BENCHER_EXTRA_ARGS or after --.
      Auto-installs the CLI if it is missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.BENCHER_NIX_INSTALLABLE}}"
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          bencher
          {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{if .BENCHER_EXTRA_ARGS_OVERRIDE}}{{.BENCHER_EXTRA_ARGS_OVERRIDE}}
          {{- else}}{{.BENCHER_EXTRA_ARGS}}{{end}}{{end}}'
        platforms: [linux, darwin]
      - cmd: >-
          bencher
          {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{if .BENCHER_EXTRA_ARGS_OVERRIDE}}{{.BENCHER_EXTRA_ARGS_OVERRIDE}}
          {{- else}}{{.BENCHER_EXTRA_ARGS}}{{end}}{{end}}
        platforms: [windows]
