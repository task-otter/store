---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  cargo:
    taskfile: ../cargo/Taskfile.yml
  nix:
    taskfile: ../nix/Taskfile.yml

vars:
  BENCHER_NIX_INSTALLABLE: '{{.BENCHER_NIX_INSTALLABLE | default "nixpkgs#bencher"}}'
  BENCHER_CARGO_CRATE: '{{.BENCHER_CARGO_CRATE | default "bencher_cli"}}'
  BENCHER_CARGO_EXTRA_ARGS: >-
    {{.BENCHER_CARGO_EXTRA_ARGS | default "--git https://github.com/bencherdev/bencher
    --branch main --locked --force"}}
  BENCHER_EXTRA_ARGS: '{{.BENCHER_EXTRA_ARGS | default ""}}'

tasks:
  default:
    run: once
    desc: Show available Bencher CLI automation tasks
    summary: Display the list of available Bencher CLI-related tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install bencher via Nix (Unix) or cargo install (Windows)
    summary: |
      Install bencher into the user Nix profile on Linux and macOS when it
      is not already on PATH. On Windows, install via cargo:install:crate from
      the Bencher GitHub repo (BENCHER_CARGO_CRATE / BENCHER_CARGO_EXTRA_ARGS;
      no crates.io package). Override BENCHER_NIX_INSTALLABLE,
      BENCHER_CARGO_CRATE, or BENCHER_CARGO_EXTRA_ARGS to pin a different
      package, crate, or install source.
    status:
      - command -v bencher >/dev/null 2>&1
    cmds:
      - task: _install:unix
      - task: _install:windows

  _install:unix:
    internal: true
    platforms: [linux, darwin]
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.BENCHER_NIX_INSTALLABLE}}"

  _install:windows:
    internal: true
    platforms: [windows]
    cmds:
      - task: cargo:install:crate
        vars:
          CARGO_CRATE: "{{.BENCHER_CARGO_CRATE}}"
          CARGO_EXTRA_ARGS: "{{.BENCHER_CARGO_EXTRA_ARGS}}"

  version:
    run: once
    desc: Show the active Bencher CLI version
    summary: |
      Print the version reported by the bencher binary resolved from PATH.
      Auto-installs the CLI if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  run:
    run: once
    desc: Track benchmarks with bencher run (BENCHER_EXTRA_ARGS or -- args)
    summary: |
      Run bencher run to execute a benchmark command and track its results.
      Pass the benchmark command and flags via BENCHER_EXTRA_ARGS or after --, e.g.
      task bencher:run -- --project my-project "make benchmarks".
      Auto-installs the CLI if it is missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          bencher run
          {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{.BENCHER_EXTRA_ARGS}}{{end}}'
        platforms: [linux, darwin]
      - cmd: >-
          bencher run
          {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{.BENCHER_EXTRA_ARGS}}{{end}}
        platforms: [windows]

  exec:
    run: once
    desc: Run any Bencher CLI subcommand (BENCHER_EXTRA_ARGS or -- args)
    summary: |
      Run an arbitrary bencher subcommand such as mock, project, or report.
      Pass the subcommand and its arguments via BENCHER_EXTRA_ARGS or after --.
      Auto-installs the CLI if it is missing.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    cmds:
      - cmd: >-
          bash -lc '{{.NIX_LOAD}};
          bencher
          {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{.BENCHER_EXTRA_ARGS}}{{end}}'
        platforms: [linux, darwin]
      - cmd: >-
          bencher
          {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{.BENCHER_EXTRA_ARGS}}{{end}}
        platforms: [windows]

  _version:unix:
    run: once
    internal: true
    desc: Show Bencher CLI version on macOS or Linux
    summary: Print the Bencher CLI version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; bencher --version'

  _version:windows:
    run: once
    internal: true
    desc: Show Bencher CLI version on Windows
    summary: Print the Bencher CLI version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Get-Command bencher -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: The Bencher CLI is not installed or not available in PATH.
    cmds:
      - bencher --version
