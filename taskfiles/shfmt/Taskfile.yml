---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml

vars:
  SHFMT_EXTRA_ARGS: '{{.SHFMT_EXTRA_ARGS | default ""}}'
  SHFMT_NIX_INSTALLABLE: '{{.SHFMT_NIX_INSTALLABLE | default "nixpkgs#shfmt"}}'
  SHFMT_TARGETS: '{{.SHFMT_TARGETS | default "."}}'

tasks:
  default:
    run: once
    desc: Show available shfmt automation tasks
    summary: Display the list of available shfmt-related tasks defined in this Taskfile.
    cmds:
      - task --list

  install:
    run: once
    desc: Install shfmt via the Nix profile
    summary: |
      Install shfmt into the user Nix profile when it is not already
      available on PATH. Override the SHFMT_NIX_INSTALLABLE
      variable to pin a different package or version.
    status:
      - command -v shfmt >/dev/null 2>&1
    cmds:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.SHFMT_NIX_INSTALLABLE}}"

  version:
    run: once
    desc: Show the active shfmt version
    summary: |
      Print the version reported by the shfmt binary resolved from PATH.
      Auto-installs shfmt if missing.
    deps:
      - task: install
    cmds:
      - task: _version:unix
      - task: _version:windows

  ci:fix:
    run: once
    desc: Format shell scripts with shfmt (SHFMT_TARGETS=path)
    summary: |
      Reformat shell scripts at SHFMT_TARGETS (default: .) in place. Pass SHFMT_EXTRA_ARGS
      for shfmt options such as -i 2, -ci, -sr, or -ln bash. Auto-installs shfmt
      if needed.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    cmds:
      - task: _fmt:unix
      - task: _fmt:windows

  fmt:check:
    run: once
    desc: Check shell script formatting with shfmt (SHFMT_TARGETS=path)
    summary: |
      Report formatting differences for shell scripts at SHFMT_TARGETS (default: .)
      without modifying files. Pass SHFMT_EXTRA_ARGS for shfmt options such as -i 2,
      -ci, -sr, or -ln bash. Auto-installs shfmt if needed.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: install
    cmds:
      - task: _fmt:check:unix
      - task: _fmt:check:windows

  _fmt:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    cmds:
      - |
        bash -lc '{{.NIX_LOAD}};
        shfmt -w \
          {{.SHFMT_EXTRA_ARGS}} \
          "{{.SHFMT_TARGETS}}"'

  _fmt:windows:
    run: once
    internal: true
    platforms: [windows]
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "$target='{{.SHFMT_TARGETS}}';
        shfmt -w
          {{.SHFMT_EXTRA_ARGS}} $target;
        exit $LASTEXITCODE"

  _fmt:check:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    cmds:
      - |
        bash -lc '{{.NIX_LOAD}};
        shfmt -d \
          {{.SHFMT_EXTRA_ARGS}} \
          "{{.SHFMT_TARGETS}}"'

  _fmt:check:windows:
    run: once
    internal: true
    platforms: [windows]
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "$target='{{.SHFMT_TARGETS}}';
        shfmt -d
          {{.SHFMT_EXTRA_ARGS}} $target;
        exit $LASTEXITCODE"

  _version:unix:
    run: once
    internal: true
    desc: Show shfmt version on macOS or Linux
    summary: Print the shfmt version on macOS or Linux.
    platforms: [linux, darwin]
    cmds:
      - bash -lc '{{.NIX_LOAD}}; shfmt --version'

  _version:windows:
    run: once
    internal: true
    desc: Show shfmt version on Windows
    summary: Print the shfmt version on Windows.
    platforms: [windows]
    preconditions:
      - sh: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Get-Command shfmt -ErrorAction SilentlyContinue) {
          exit 0 } else { exit 1 }"
        msg: shfmt is not installed or not available in PATH.
    cmds:
      - shfmt --version
