---
version: "3.5"

output:
  group:
    begin: "::group::{{.TASK}}"
    end: "::endgroup::"
    error_only: false

silent: true

includes:
  nix:
    taskfile: ../nix/Taskfile.yml

vars:
  SHFMT_EXTRA_ARGS: ""
  SHFMT_NIX_INSTALLABLE: nixpkgs#shfmt
  SHFMT_TARGETS: "."

tasks:
  default:
    run: once
    desc: Show available shfmt automation tasks
    summary: Display the list of available shfmt-related tasks defined in this Taskfile.
    cmds:
      - task --list

  ci:fix:
    run: once
    desc: Format shell scripts with shfmt (SHFMT_TARGETS=path)
    summary: |
      Reformat shell scripts at SHFMT_TARGETS (default: .) in place. Pass SHFMT_EXTRA_ARGS
      for shfmt options such as -i 2, -ci, -sr, or -ln bash. Auto-installs shfmt
      if needed.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.SHFMT_NIX_INSTALLABLE}}"
    cmds:
      - task: _fmt:unix
      - task: _fmt:windows

  fmt:check:
    run: once
    desc: Check shell script formatting with shfmt (SHFMT_TARGETS=path)
    summary: |
      Report formatting differences for shell scripts at SHFMT_TARGETS (default: .)
      without modifying files. Pass SHFMT_EXTRA_ARGS for shfmt options such as -i 2,
      -ci, -sr, or -ln bash. Auto-installs shfmt if needed.
    dir: "{{.USER_WORKING_DIR}}"
    deps:
      - task: nix:install:profile
        vars:
          NIX_INSTALLABLE: "{{.SHFMT_NIX_INSTALLABLE}}"
    cmds:
      - task: _fmt:check:unix
      - task: _fmt:check:windows

  _fmt:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    cmds:
      - |
        bash -lc '{{.NIX_LOAD}};
        shfmt -w \
          {{if .SHFMT_EXTRA_ARGS_OVERRIDE}}{{.SHFMT_EXTRA_ARGS_OVERRIDE}}
          {{- else}}{{.SHFMT_EXTRA_ARGS}}{{end}} \
          "{{if .SHFMT_TARGETS_OVERRIDE}}{{.SHFMT_TARGETS_OVERRIDE}}
          {{- else}}{{.SHFMT_TARGETS}}{{end}}"'

  _fmt:windows:
    run: once
    internal: true
    platforms: [windows]
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "$target='{{if .SHFMT_TARGETS_OVERRIDE}}{{.SHFMT_TARGETS_OVERRIDE}}
        {{- else}}{{.SHFMT_TARGETS}}{{end}}';
        shfmt -w
          {{if .SHFMT_EXTRA_ARGS_OVERRIDE}}{{.SHFMT_EXTRA_ARGS_OVERRIDE}}
          {{- else}}{{.SHFMT_EXTRA_ARGS}}{{end}} $target;
        exit $LASTEXITCODE"

  _fmt:check:unix:
    run: once
    internal: true
    platforms: [linux, darwin]
    cmds:
      - |
        bash -lc '{{.NIX_LOAD}};
        shfmt -d \
          {{if .SHFMT_EXTRA_ARGS_OVERRIDE}}{{.SHFMT_EXTRA_ARGS_OVERRIDE}}
          {{- else}}{{.SHFMT_EXTRA_ARGS}}{{end}} \
          "{{if .SHFMT_TARGETS_OVERRIDE}}{{.SHFMT_TARGETS_OVERRIDE}}
          {{- else}}{{.SHFMT_TARGETS}}{{end}}"'

  _fmt:check:windows:
    run: once
    internal: true
    platforms: [windows]
    cmds:
      - >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "$target='{{if .SHFMT_TARGETS_OVERRIDE}}{{.SHFMT_TARGETS_OVERRIDE}}
        {{- else}}{{.SHFMT_TARGETS}}{{end}}';
        shfmt -d
          {{if .SHFMT_EXTRA_ARGS_OVERRIDE}}{{.SHFMT_EXTRA_ARGS_OVERRIDE}}
          {{- else}}{{.SHFMT_EXTRA_ARGS}}{{end}} $target;
        exit $LASTEXITCODE"
